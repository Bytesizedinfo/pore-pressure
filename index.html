<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Macro skin built from real photographs, with physics-based popping, cutting and extraction across 21 lesion types and 18 clinical instruments.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 3C16 3 6 15 6 21a10 10 0 0 0 20 0C26 15 16 3 16 3z%27 fill=%27%238f82f2%27/%3E%3C/svg%3E">
<title>Pore Pressure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: full-bleed macro camera view; instrument tray left, chart right, readouts in mono. Deliberately dark (clinic monitor). */
:root {
  --bg: #0b0d0e;
  --panel: rgba(17, 20, 22, 0.86);
  --panel-solid: #14181a;
  --line: rgba(222, 214, 205, 0.12);
  --fg: #ece6df;
  --muted: #a49d95;
  --accent: #8f82f2;      /* nitrile glove violet */
  --accent-ink: #15122c;
  --warn: #d79a3a;        /* povidone-iodine amber */
  --danger: #d0574f;
  --ok: #67c08e;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#ui { position: fixed; inset: 0; pointer-events: none;
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr auto; gap: 10px; }
#ui > * { pointer-events: auto; }
/* layout containers must not swallow input meant for the skin: only their panels take the pointer */
#ui > .hole, #ui > #bottom, #ui > #side { pointer-events: none; }
#bottom > *, #side > * { pointer-events: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
button, select, input { font: inherit; color: inherit; }
button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: rgba(222, 214, 205, 0.3); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

/* top bar */
#top { grid-column: 1 / 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; }
#brand { font: 600 17px/1 var(--font-head); letter-spacing: 0.02em; margin-right: 6px; white-space: nowrap; }
#brand small { display: block; font: 500 10px/1.2 var(--font-mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px; }
.group { display: flex; align-items: center; gap: 6px; }
.lbl { font: 500 10px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#tones { display: flex; gap: 4px; }
#tones button { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
#tones button.on { border-color: var(--fg); background-clip: padding-box; }
#clock { font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--fg); }
.spacer { flex: 1; }

/* tool tray */
#tray { grid-row: 2 / 3; display: flex; flex-direction: column; gap: 4px; padding: 8px; overflow-y: auto; max-height: 100%; width: 172px; }
#tray h3 { font: 500 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 8px 4px 2px; }
#tray h3:first-child { margin-top: 2px; }
.tool { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; text-align: left; border-color: transparent; padding: 5px 6px; }
.tool svg { width: 22px; height: 22px; }
.tool .k { font: 400 10px/1 var(--font-mono); color: var(--muted); }
.tool.on { background: rgba(143, 130, 242, 0.18); border-color: var(--accent); color: var(--fg); }
#toolopt { font-size: 12px; color: var(--muted); padding: 6px 4px 2px; line-height: 1.35; }

/* right chart */
#side { grid-row: 2 / 3; grid-column: 3; width: 250px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#chart { padding: 10px; overflow-y: auto; min-height: 0; flex: 1; }
#chart h2, #stats h2 { font: 600 13px/1 var(--font-head); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 8px; color: var(--muted); }
.les { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
.les:hover { background: rgba(255,255,255,0.04); }
.les .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.les .st { font: 400 11px/1 var(--font-mono); color: var(--muted); }
.les.done .dot { background: var(--ok); } .les.bad .dot { background: var(--danger); } .les.active .dot { background: var(--warn); }
#stats { padding: 10px; }
#stats dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 0; font-size: 12px; }
#stats dd { margin: 0; font: 500 12px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
#stats dt { color: var(--muted); }

/* bottom: info card + meters */
#bottom { grid-column: 2 / 3; grid-row: 3; display: flex; justify-content: center; align-items: flex-end; gap: 10px; min-width: 0; }
#info { max-width: 560px; padding: 12px 14px; min-width: 0; }
#info h4 { margin: 0 0 2px; font: 600 16px/1.2 var(--font-head); }
#info .sub { font: 400 11px/1.3 var(--font-mono); color: var(--muted); margin-bottom: 6px; }
#info p { margin: 0 0 6px; color: #d9d2cb; font-size: 13px; }
#info ol { margin: 4px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
#info li.done { color: var(--ok); text-decoration: line-through; text-decoration-color: rgba(103,192,142,0.5); }
#info a { color: var(--accent); }
#meters { padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; width: 226px; }
.meter { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; font: 500 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 80ms linear; }
#painbar i { background: linear-gradient(90deg, var(--warn), var(--danger)); }
#readout { font: 500 11px/1.2 var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
#zoom { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
#grip { display: grid; gap: 5px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.07); }
#grip[hidden] { display: none; }
.grow { display: flex; align-items: center; gap: 4px; }
.grow .lbl { width: 46px; flex: none; }
.grow button { padding: 2px 6px; min-width: 26px; }
.gval { font: 500 12px/1 var(--font-mono); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
#grip label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); flex: 1; cursor: pointer; }
#zoom button { padding: 2px 7px; min-width: 26px; }
#zoomv { font: 500 12px/1 var(--font-mono); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
#addsize { width: 72px; accent-color: var(--accent); }
#addsel { max-width: 170px; }
#gl.placing { cursor: copy; }
#gl.erasing { cursor: cell; }
#gl.pannable { cursor: grab; } #gl.grab { cursor: grab; } #gl.grabbing { cursor: grabbing; }
#gl.orbit { cursor: grab; } #gl.orbit.pointing { cursor: zoom-in; } #gl.orbit.grabbing { cursor: grabbing; }
#popbar.deep i { background: var(--warn) !important; }
#bodylabel { position: fixed; z-index: 5; pointer-events: none; transform: translate(14px, 14px); padding: 6px 9px; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--line); font: 500 11px/1.3 var(--font-mono); color: var(--fg); white-space: nowrap; }
#bodylabel b { font-weight: 600; color: var(--accent); }
body.bodyview #tray { opacity: 0.4; transition: opacity 200ms; }
body.bodyview #tray:hover { opacity: 1; }
#perf { font: 500 11px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* toasts */
#toasts { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; pointer-events: none; width: min(520px, calc(100vw - 32px)); z-index: 5; }
.toast { padding: 8px 12px; border-radius: 8px; background: var(--panel-solid); border: 1px solid var(--line); font-size: 13px; animation: tin 160ms ease-out; }
.toast b { font-family: var(--font-head); letter-spacing: 0.02em; }
.toast.good { border-color: rgba(103,192,142,0.6); } .toast.bad { border-color: rgba(208,87,79,0.7); } .toast.warn { border-color: rgba(215,154,58,0.7); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

/* cursor ring */
#ring { position: fixed; width: 54px; height: 54px; margin: -27px 0 0 -27px; pointer-events: none; z-index: 4; opacity: 0; transition: opacity 120ms; }
#ring.show { opacity: 1; }

/* modal */
#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,6,7,0.6); z-index: 10; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#modal .panel { width: min(640px, 100%); max-height: min(86vh, 900px); overflow-y: auto; padding: 18px 20px; background: var(--panel-solid); }
#modal h2 { font: 600 20px/1.2 var(--font-head); margin: 0 0 6px; text-wrap: balance; }
#modal h3 { font: 600 13px/1 var(--font-head); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 8px; }
#modal p, #modal li { color: #d9d2cb; font-size: 13.5px; max-width: 65ch; }
#modal a { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.set { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.set input[type=range] { width: 160px; accent-color: var(--accent); }
.set input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
#diag { position: fixed; left: 8px; bottom: 8px; max-width: 60vw; max-height: 40vh; overflow: auto; margin: 0; padding: 8px; font: 11px/1.3 var(--font-mono); background: rgba(40,0,0,0.85); color: #ffd7d2; border-radius: 6px; z-index: 20; white-space: pre-wrap; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 8; background: var(--bg); font: 500 12px/1.4 var(--font-mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

@media (max-width: 760px) {
  #ui { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto auto; }
  #top { grid-column: 1; }
  #side { grid-column: 1; grid-row: 2; width: auto; align-self: start; max-height: 34vh; }
  #chart { display: none; }
  #tray { grid-row: 4; flex-direction: row; width: auto; max-height: none; overflow-x: auto; overflow-y: hidden; }
  #tray h3 { display: none; }
  .tool { grid-template-columns: 22px; } .tool span, .tool .k { display: none; }
  #toolopt { display: none; }
  #bottom { grid-column: 1; grid-row: 3; flex-direction: column; align-items: stretch; }
  #meters { width: auto; }
  #info { max-width: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .bar i { transition: none; } }
</style>

<div id="stage"><canvas id="gl"></canvas></div>
<div id="ui">
  <header id="top" class="panel">
    <div id="brand">Pore Pressure<small>Macro extraction simulator</small></div>

      <select id="area" aria-label="Skin area"></select></div>

        <div class="grow"><span class="lbl">Spread</span><button id="gsm" title="Pads closer together ([ or Shift+scroll)" aria-label="Pads closer">−</button><span class="gval" id="gripv">—</span><button id="gsp" title="Pads further apart (] or Shift+scroll)" aria-label="Pads further apart">+</button></div>

<script>
/* ---- 00_util.js ---- */
'use strict';
/* Pore Pressure — shared utilities. Units: mm, seconds, N, kPa (1 kPa = 1e-3 N/mm^2), µL = mm^3. */
const PP = (window.PP = window.PP || {});

PP.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
PP.lerp = (a, b, t) => a + (b - a) * t;
PP.smooth = (e0, e1, x) => { const t = PP.clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
PP.len = (x, y) => Math.sqrt(x * x + y * y);

// deterministic RNG (mulberry32)
PP.rng = function (seed) {
  let a = seed >>> 0;
  const f = function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (lo, hi) => lo + (hi - lo) * f();
  f.pick = (arr) => arr[Math.floor(f() * arr.length) % arr.length];
  f.normal = () => { let u = 0, v = 0; while (u === 0) u = f(); v = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  return f;
};

PP.params = new URLSearchParams(location.search);
PP.TEST = PP.params.get('test') || '';

// diagnostics panel (errors always shown; test verdicts written here too)
PP.diag = {
  lines: [],
  errors: 0,
  el: null,
  write(msg, isErr) {
    if (isErr) this.errors++;
    this.lines.push((isErr ? 'ERROR: ' : '') + msg);
    if (!this.el) this.el = document.getElementById('diag');
    if (this.el && (isErr || PP.TEST)) { this.el.hidden = false; this.el.textContent = this.lines.join('\n'); }
  },
  error(msg) { this.write(String(msg), true); },
};
window.addEventListener('error', (e) => PP.diag.error('JS: ' + e.message + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')));
window.addEventListener('unhandledrejection', (e) => PP.diag.error('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));

PP.storage = {
  get(k, d) { try { const v = localStorage.getItem('pp.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem('pp.' + k, JSON.stringify(v)); } catch (_) { /* storage unavailable */ } },
};

PP.fmtVol = (ul) => (ul >= 1000 ? (ul / 1000).toFixed(ul >= 10000 ? 1 : 2) + ' mL' : ul >= 10 ? ul.toFixed(0) + ' µL' : ul.toFixed(1) + ' µL');
PP.fmtClock = (s) => {
  if (s < 3600) { const m = Math.floor(s / 60), ss = Math.floor(s % 60); return '+' + m + ':' + String(ss).padStart(2, '0'); }
  if (s < 172800) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return '+' + h + 'h ' + String(m).padStart(2, '0') + 'm'; }
  return '+' + (s / 86400).toFixed(1) + ' days';
};

// sRGB helpers
PP.s2l = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
PP.hex2lin = (h) => [1, 3, 5].map((i) => PP.s2l(parseInt(h.substr(i, 2), 16) / 255));

// 3x3 inverse (row-major arrays)
PP.inv3 = function (m) {
  const [a, b, c, d, e, f, g, h, i] = m;
  const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
  const det = a * A + b * B + c * C;
  return [A / det, -(b * i - c * h) / det, (b * f - c * e) / det,
    B / det, (a * i - c * g) / det, -(a * f - c * d) / det,
    C / det, -(a * h - b * g) / det, (a * e - b * d) / det];
};

/* ---- 01_gl.js ---- */
'use strict';
/* WebGL2 helpers: programs with uniform caching, textures, render targets, fullscreen + instanced geometry. */
PP.GL = function (canvas) {
  const gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: true, stencil: false, premultipliedAlpha: false,
    preserveDrawingBuffer: !!PP.TEST, powerPreference: 'high-performance',
  });
  if (!gl) throw new Error('WebGL2 is not available in this browser.');
  const extCBF = gl.getExtension('EXT_color_buffer_float');
  gl.getExtension('EXT_color_buffer_half_float');
  gl.getExtension('OES_texture_float_linear');
  if (!extCBF) PP.diag.error('EXT_color_buffer_float missing: float render targets unavailable');
  this.gl = gl;

  const HDR = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n';
  this.progs = [];
  this.parallel = gl.getExtension('KHR_parallel_shader_compile');
  // compile + link without querying status, so the driver can work while assets download
  this.program = function (name, vs, fs) {
    const mk = (type, src) => { const sh = gl.createShader(type); gl.shaderSource(sh, HDR + src); gl.compileShader(sh); return sh; };
    const vsS = mk(gl.VERTEX_SHADER, vs), fsS = mk(gl.FRAGMENT_SHADER, fs);
    const p = gl.createProgram();
    gl.attachShader(p, vsS); gl.attachShader(p, fsS);
    gl.linkProgram(p);
    const prog = { p, u: {}, name, done: false };
    prog.finish = () => {
      if (prog.done) return; prog.done = true;
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        for (const [sh, kind, src] of [[vsS, ' VS', vs], [fsS, ' FS', fs]]) {
          if (gl.getShaderParameter(sh, gl.COMPILE_STATUS)) continue;
          const log = gl.getShaderInfoLog(sh) || '';
          const lines = (HDR + src).split('\n');
          const m = /ERROR: \d+:(\d+)/.exec(log);
          PP.diag.error(name + kind + ': ' + log + (m ? '\n  > ' + (lines[+m[1] - 1] || '') : ''));
        }
        PP.diag.error(name + ' link: ' + gl.getProgramInfoLog(p));
      }
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) || 0;
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        prog.u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
      }
    };
    this.progs.push(prog);
    return prog;
  };
  this.finishAll = async function () {
    const ext = this.parallel;
    if (ext) {
      const t0 = performance.now();
      while (performance.now() - t0 < 90000 && !this.progs.every((pr) => gl.getProgramParameter(pr.p, ext.COMPLETION_STATUS_KHR))) {
        await new Promise((r) => setTimeout(r, 20));
      }
    }
    this.progs.forEach((pr) => pr.finish());
  };

  this.tex = function (w, h, opt = {}) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    const ifmt = opt.ifmt || gl.RGBA8, fmt = opt.fmt || gl.RGBA, type = opt.type || gl.UNSIGNED_BYTE;
    gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, opt.data || null);
    const filt = opt.filter || gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, opt.mip ? gl.LINEAR_MIPMAP_LINEAR : filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    const wrap = opt.wrap || gl.CLAMP_TO_EDGE;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    if (opt.mip) gl.generateMipmap(gl.TEXTURE_2D);
    return { t, w, h, ifmt, fmt, type };
  };

  this.texFromImage = function (img, opt = {}) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    const af = gl.getExtension('EXT_texture_filter_anisotropic');
    if (af) gl.texParameterf(gl.TEXTURE_2D, af.TEXTURE_MAX_ANISOTROPY_EXT, 8);
    return { t, w: img.width, h: img.height };
  };

  // render target with N color attachments (+ optional depth)
  this.target = function (w, h, specs, depth) {
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    const texs = specs.map((s, i) => {
      const tx = this.tex(w, h, s);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, tx.t, 0);
      return tx;
    });
    let db = null;
    if (depth) {
      db = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, db);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, db);
    }
    gl.drawBuffers(specs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
    const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (st !== gl.FRAMEBUFFER_COMPLETE) PP.diag.error('Framebuffer incomplete 0x' + st.toString(16));
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, texs, w, h, db };
  };
  this.freeTarget = function (rt) {
    if (!rt) return;
    rt.texs.forEach((t) => gl.deleteTexture(t.t));
    if (rt.db) gl.deleteRenderbuffer(rt.db);
    gl.deleteFramebuffer(rt.fb);
  };

  // fullscreen triangle
  this.fsVao = gl.createVertexArray();
  gl.bindVertexArray(this.fsVao);
  const fsb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, fsb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // instanced quad: per-instance 4 x vec4 attributes (locations 1..4)
  this.instVao = gl.createVertexArray();
  gl.bindVertexArray(this.instVao);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  this.instBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, this.instBuf);
  this.INST_FLOATS = 16;
  for (let i = 0; i < 4; i++) {
    gl.enableVertexAttribArray(1 + i);
    gl.vertexAttribPointer(1 + i, 4, gl.FLOAT, false, 64, i * 16);
    gl.vertexAttribDivisor(1 + i, 1);
  }
  gl.bindVertexArray(null);

  this.drawFS = function () { gl.bindVertexArray(this.fsVao); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  this.drawInstances = function (data, count) {
    if (!count) return;
    gl.bindVertexArray(this.instVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.instBuf);
    if (!this._instCap || this._instCap < count) { this._instCap = Math.max(count, 9000); gl.bufferData(gl.ARRAY_BUFFER, this._instCap * 64, gl.DYNAMIC_DRAW); }
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, count * 16);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
  };
  this.bindTex = function (unit, tex, loc) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex.t || tex);
    if (loc != null) gl.uniform1i(loc, unit);
  };
};

'use strict';
/* Skin mechanics (CPU mirror of the GLSL in 08_render.js).
   Skin + subcutis is treated as a nearly incompressible elastic body (nu = 0.48) with closed-form
   surface solutions superposed per contact (linear elasticity):
     - Boussinesq: uniform pressure on a disc -> vertical surface displacement (dent / suction dome)
     - Cerruti: tangential (friction) load -> in-plane displacement (skin dragged by the fingers)
     - incompressible layer thickening: w += -Heff * div(u)   (skin bulges between pinching fingers)
     - finite tissue depth: all fields decay as exp(-r / Ld)
     - prestress along relaxed-skin-tension lines: Griffith/Westergaard crack opening for incisions,
       Kirsch hole for punches (holes ovalise along the lines).
   Stress reaching a buried cavity: Boussinesq sigma_z at depth + lateral compression from the strain field. */

PP.Phys = function () {
  this.nu = 0.48;

     - pinch fold: pads that grip and drag the skin toward each other shorten the surface between them by the
       approach delta; the stiff surface layer cannot shorten that much, so the excess rises as a fold. Arc length of a
       cos^2 bump of span L gives h = (2/pi) sqrt(L delta); 0.66 of that (the rest is in-plane compression of soft
       tissue) is a calibrated estimate.
     - pile-up: nearly incompressible tissue displaced by a soft pad rises in a low rim around it (~12% of the dent,
       calibrated estimate).
     - viscoelastic recovery: on release, loads become decaying ghosts; about half the deformation returns at once and

    this.ghostT = 0;
  };

    if (!this.ghosts.length && !this.pinchGhost) return;

  };
  this.clearGhosts = function () { this.ghosts.length = 0; this.pinchGhost = null; this.pinch = null; };

  this.foldNow = function () { return this.pinch ? { P: this.pinch, k: 1 } : this.pinchGhost ? { P: this.pinchGhost, k: this.ghostK() } : null; };
  this.foldW = function (x, y, P) {
    const dx = x - P.mx, dy = y - P.my, s = dx * P.ux + dy * P.uy, q = -dx * P.uy + dy * P.ux;
    if (Math.abs(s) >= P.Ls * 0.5) return 0;

  // sigma_z (kPa) at depth z, horizontal offset r, from load F (N) on a disc of radius a:
  // on the axis the exact uniform-disc solution p[1 - z^3/(a^2+z^2)^1.5]; far away the Boussinesq point load.
  this.sigmaZ = function (F, a, r, z) {

    let sz = 0;

      this.px[i] = this.x[i]; this.py[i] = this.y[i]; this.pz[i] = this.z[i];
