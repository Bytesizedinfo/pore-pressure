  // grip readout: angle, and the pad-to-pad distance you would get pressing here
  { const gr = this.$('grip'), on = T.id === 'fingers' || T.id === 'swabs';
    if (gr.hidden === on) gr.hidden = !on;
    if (on) {
      const s = T.ptr.down ? T.spread[T.id] : T.gripPlace(T.ptr.x, T.ptr.y, T.altKey).s;
      const a = Math.round((T.angle * 180) / Math.PI) + '°', v = (2 * s).toFixed(1) + ' mm';
      if (this._ga !== a) { this._ga = a; this.$('gripa').textContent = a; }

    this.$('perf').textContent = pf + (R.gpuMs != null ? ' · GPU ' + R.gpuMs.toFixed(1) + ' ms' : '') + ' · ' + Math.round((R.lastDs || 1) * 100) + '% res';
  } else this.$('perf').hidden = true;

  ring.classList.toggle('show', !!show);
  if (show) {
    ring.style.left = this.lastSX + 'px'; ring.style.top = this.lastSY + 'px';
    const c = 2 * Math.PI * 22;
    this.$('ringv').setAttribute('stroke-dasharray', (PP.clamp(f, 0, 1) * c).toFixed(1) + ' ' + c.toFixed(1));

// ---------------------------------------------------------------- input
PP.UI.prototype.toWorld = function (sx, sy) {

};

PP.UI.ZMAX = 6;

PP.UI.PANNABLE = new Set(['fingers', 'swabs', 'loop', 'vacuum', 'hemostat', 'forceps', 'curette', 'packing']);
PP.UI.prototype.canPanFrom = function (x, y, id) {

  for (const q of Wd.punct) if (Math.hypot(x - q.x, y - q.y) < 3) return false;

PP.UI.prototype.eraseAt = function (x, y) {
  const W = this.W, P = W.parts;
  const brush = Math.max(0.5, (14 / W.cam.cw) * W.cam.vw);
  const gone = W.lesions.filter((L) => Math.hypot(L.x + L.ox - x, L.y + L.oy - y) < L.R + brush);
  if (!gone.length) return;

    const r = L.R * 1.4 + 0.5;
    for (let i = 0; i < P.hi; i++) if (P.alive[i] && Math.hypot(P.x[i] - L.x, P.y[i] - L.y) < r) P.kill(i);

PP.UI.prototype.zoomBy = function (k) {

  if (k < 1 && (C.tz || C.zoom) <= this.zmin() * 1.001) { B.enterAt(mx, my, 1 / k); return; }

// critically damped glide toward the target view, plus pan inertia
PP.UI.prototype.easeCamera = function (dt) {
  const W = this.W, C = W.cam;
  if (C.tz == null) { C.tz = C.zoom; C.tx = C.x; C.ty = C.y; C.vxp = C.vyp = 0; }
  if (!this.pan && (Math.abs(C.vxp) + Math.abs(C.vyp) > 0.05)) {
    C.tx += C.vxp * dt; C.ty += C.vyp * dt;
    const d = Math.exp(-dt / 0.22); C.vxp *= d; C.vyp *= d;
    this.clampTarget(); W.activeUntil = W.time + 0.5;
  }
  if (this.pan) return;
  const k = 1 - Math.exp(-dt / 0.07);
  const ez = C.tz - C.zoom, ex = C.tx - C.x, ey = C.ty - C.y;

};

'use strict';
/* Behaviour tests: drive the real tool API at a fixed 120 Hz step and assert the sourced real-world outcomes.
   ?test=all runs every assertion; ?test=<visual> stages a scene for a screenshot. */
PP.Tests = function (W) {
  this.W = W; this.dt = 1 / 120; this.results = [];
};
PP.Tests.prototype.step = function (sec) { const n = Math.max(1, Math.round(sec / this.dt)); for (let i = 0; i < n; i++) this.W.step(this.dt); };
PP.Tests.prototype.setup = async function (area, list, opt = {}) {
  const W = this.W;
  if (W.areaId !== area) await PP.main.switchArea(area);
  W.S.blood = opt.blood !== false; W.S.spurt = 1; W.S.ooze = 1; W.S.pain = false; W.S.shield = false; W.S.lens = true; W.S.bloodAmt = 1;
  W.rng = PP.rng(1234); W.ctx.rng = W.rng;
  W.parts.clear(); W.wounds.reset(); W.decals.reset(); W.render.setupWorld(); W.phys.clearGhosts(); W.phys.contacts.length = 0;
  W.lesions = []; W.clock = 0; W.ctx.clock = 0; W.stats = { pops: 0, vol: 0, perfect: 0, deep: 0, flinch: 0, bruise: 0 };
  W.tools.release(); W.tools.ptr.down = false; W.tools.spread = { fingers: 4.6, swabs: 3.0 }; W.tools.angle = 0; W.tools.wet = 0; W.painLevel = 0;
  W.tools.gripOff = { x: 0, y: 0 }; W.tools.snap = true; W.tools.fitOff = { fingers: 0, swabs: 0 };
  const out = list.map(([t, x, y, d]) => W.addLesion(t, x, y, d));
  W.cam.x = opt.cx || 0; W.cam.y = opt.cy || 0; W.cam.zoom = opt.zoom || 1.5;
  W.render.resize(); W.cam.update(W.render.w, W.render.h);
  return out;
};
PP.Tests.prototype.hold = function (tool, x, y, sec, opt = {}) {
  const T = this.W.tools;
  T.select(tool);
  if (opt.spread != null && T.spread[tool] != null) T.spread[tool] = opt.spread;
  if (opt.angle != null) T.angle = opt.angle;
  T.ptr.x = x; T.ptr.y = y; T.ptr.lx = x; T.ptr.ly = y;
  T.down(x, y, { shift: !!opt.shift });
  if (opt.until) { const n = Math.round(sec / this.dt); for (let i = 0; i < n; i++) { this.W.step(this.dt); if (opt.until()) break; } }
  else this.step(sec);
  if (!opt.keep) { T.up(); this.step(0.02); }
};
PP.Tests.prototype.drag = function (tool, x0, y0, x1, y1, sec, opt = {}) {
  const T = this.W.tools;
  T.select(tool); T.ptr.x = x0; T.ptr.y = y0; T.ptr.lx = x0; T.ptr.ly = y0;
  T.down(x0, y0, { shift: !!opt.shift });
  const n = Math.max(2, Math.round(sec / this.dt));
  for (let i = 1; i <= n; i++) { T.move(x0 + ((x1 - x0) * i) / n, y0 + ((y1 - y0) * i) / n); this.W.step(this.dt); }
  if (!opt.keep) { T.up(); this.step(0.02); }
};
PP.Tests.prototype.ok = function (name, pass, info) { this.results.push({ name, pass: !!pass, info }); PP.diag.write((pass ? 'PASS ' : 'FAIL ') + name + ' ' + JSON.stringify(info)); };

PP.Tests.prototype.all = async function () {
  const W = this.W, T = W.tools, P = W.parts;
  let L, L2;
  // 1. opposed fingers pop an unopened pustule at the roof
  [L] = await this.setup('cheek', [['pustule', 0, 0, 3]]);
  this.hold('fingers', 0, 0, 2.5, { spread: 4.6 });
  const popP = L.Pmax;

  // 1b. needle-opened pustule drains at lower pressure than the popping pressure

    let view;
    if (B.anchors[v]) { const a = B.anchors[v], o = B.viewOf(a); view = { p: a.p.slice(), yaw: o.yaw, pitch: o.pitch, dist: B.distW(PP.AREAS[v].size * +(PP.params.get('k') || 3)) }; }
    else view = B.overview(v === 'face' ? W.areaId : v);
    if (PP.params.get('yaw')) view.yaw = +PP.params.get('yaw');
    if (PP.params.get('pitch')) view.pitch = +PP.params.get('pitch');
    if (PP.params.get('h')) view.dist = B.distH(+PP.params.get('h'));
    await B.jump(view);
    if (PP.params.get('hover')) B.hover = B.order.indexOf(PP.params.get('hover'));
    if (PP.params.get('all')) B.showAll = 1;
    // ?pv=ox,oy,oz&pd=dx,dy,dz: hover preview of a close-up at the mesh point that ray hits
    if (PP.params.get('pv')) {
      const o = PP.params.get('pv').split(',').map(Number), d = (PP.params.get('pd') || '0,0,-1').split(',').map(Number);
      const h = B.raycast(o, d), f = h && B.spotFor(h);
      if (f && !f.bad) { B.preview = f; PP.diag.write('PREVIEW ' + f.name + ' ' + f.size); }
    }
    if (name === 'bodyfade') { W.cam.zoom = W.cam.tz = W.area.view / B.widthAt(B.cam.dist); B.mode = 'entering'; B.fade = +(PP.params.get('f') || 0.5); B.freeze = true; }
    else B.freeze = true;
  } else if (name === 'spot') {
    // ?o=ox,oy,oz&d=dx,dy,dz: open the close-up at the mesh point that ray hits and show the whole patch
    await this.setup('cheek', []); W.newPatch(+(PP.params.get('seed') || 7));
    const B = PP.main.B; await B.load(); W.ensureAreas();
    const o = (PP.params.get('o') || '0,592,600').split(',').map(Number), d = (PP.params.get('d') || '0,0,-1').split(',').map(Number);
    const h = B.raycast(o, d), f = h && B.spotFor(h), id = f && B.makeSpot(f);
    if (id) {
      await PP.main.switchArea(id);
      const C = W.cam; C.zoom = C.tz = +(PP.params.get('zoom') || PP.main.UI.zpatch()); C.x = C.y = C.tx = C.ty = 0;
      PP.diag.write('SPOT ' + W.area.name + ' size ' + W.area.size + ' lesions ' + W.lesions.length + ' ' + W.lesions.map((L) => L.type).join(','));
    } else PP.diag.write('SPOT none ' + JSON.stringify(f && f.bad));
  } else if (name === 'cutcyst') {
    await this.setup(PP.params.get('area') || 'back', [[PP.params.get('les') || 'epidermoid', 0, 0, +(PP.params.get('d') || 16)]], { zoom: +(PP.params.get('zoom') || 1.4) });
    const bl = PP.params.get('blade') || 'blade15';
    if (bl === 'blade11') this.drag('blade11', 0, -1.2, 0, 1.3, 0.25);
    else { this.drag('blade15', -6, 0, 6, 0, 0.5); this.drag('blade15', -6, 0, 6, 0, 0.5); }
    if (PP.params.get('sq')) this.hold('fingers', 0, 0, +PP.params.get('sq'), { spread: 11, keep: true });
  } else if (name === 'wipe') {
    // a bleeding cut; the left half wiped clean, the saline wipe still down on the skin
    await this.setup('back', [], { zoom: 2.2 });
    this.drag('blade15', -5, 0, 5, 0, 0.5); this.drag('blade15', -5, 0, 5, 0, 0.5);
    this.step(+(PP.params.get('bleed') || 6));
    const passes = +(PP.params.get('passes') || 2);
    const T = this.W.tools; T.select('wipe');   // one wipe, several passes (as when you keep holding it)
    for (let k = 0; k < passes; k++) {
      const y0 = k % 2 ? -3 : 3; T.ptr.x = -8; T.ptr.y = y0; T.ptr.lx = -8; T.ptr.ly = y0; T.down(-8, y0, {});
      for (let i = 1; i <= 60; i++) { T.move(-8 + 7.5 * i / 60, y0 - 2 * y0 * i / 60); this.W.step(this.dt); }
      if (k < passes - 1) { T.up(); this.step(0.02); }
    }
    if (PP.params.get('lift')) { T.up(); T.move(60, 60); this.step(0.05 + +(PP.params.get('after') || 0)); }
  } else if (name === 'grip') {
    // the fingers' grip turned 45 degrees over a pustule (hover preview), or pressing with it
    await this.setup('cheek', [['pustule', 0, 0, 3]], { zoom: 2.2 });
    const T = this.W.tools; T.select('fingers'); T.rotate(+(PP.params.get('rot') || 3));
    const x = +(PP.params.get('x') || 0.4), y = +(PP.params.get('y') || 0.3);
    if (PP.params.get('press')) this.hold('fingers', x, y, 0.8, { keep: true });
    else { T.ptr.x = x; T.ptr.y = y; T.ptr.lx = x; T.ptr.ly = y; this.step(0.05); }
  } else if (name === 'newles') {
    await this.setup('back', [['abscess', -38, 18, 26], ['inflamedCyst', 0, 22, 16], ['blister', 34, 22, 11], ['bloodBlister', 34, -6, 8], ['tophus', -8, -16, 6], ['calcinosis', 12, -18, 7]], { zoom: +(PP.params.get('zoom') || 0.55), cx: +(PP.params.get('cx') || 0), cy: +(PP.params.get('cy') || 0) });
  } else if (name === 'clusters') {
    await this.setup(PP.params.get('area') || 'cheek', [], { zoom: +(PP.params.get('zoom') || 1.2) });
    const t = PP.params.get('les') || 'solarComedone';
    W.lesions = W.genLesions(Object.assign({}, W.area, { mix: [[t, +(PP.params.get('n') || 7), { cluster: +(PP.params.get('c') || 12) }]] }), PP.rng(+(PP.params.get('seed') || 3)));
    const cx = W.lesions.reduce((s2, L) => s2 + L.x, 0) / Math.max(1, W.lesions.length), cy = W.lesions.reduce((s2, L) => s2 + L.y, 0) / Math.max(1, W.lesions.length);
    W.cam.x = W.cam.tx = cx; W.cam.y = W.cam.ty = cy; W.fx.patchChanged();
  } else if (name === 'tools') {
    await this.setup('cheek', [['pustule', 0, 0, 3]], { zoom: 1.0 });
    const ids = ['fingers', 'loop', 'vacuum', 'needle', 'blade11', 'punch', 'hemostat', 'gauze', 'compress'];
    const all = []; let k = 0;
    for (const id of ids) {
      T.select(id); const x = ((k % 3) - 1) * 8, y = (1 - Math.floor(k / 3)) * 6; T.ptr.x = x; T.ptr.y = y; T.ptr.lx = x - 0.1; T.ptr.ly = y; T.ptr.down = false;
      T.update(this.dt); all.push(T.prims.slice(0, T.nPrim * 16)); k++;
    }
    T.select('fingers');
    const merged = new Float32Array(all.reduce((s, a) => s + a.length, 0)); let o = 0; for (const a of all) { merged.set(a, o); o += a.length; }
    W._frozenPrims = merged;
  }
};

/* ---- 13_main.js ---- */
'use strict';
/* Boot + main loop. */
PP.main = {
  W: null, R: null, UI: null,
  // switch the macro view to another area, keeping every area's state (blemishes, wounds, films)
  async switchArea(id) {
    const W = this.W;
    if (id === W.areaId && W.lesions) { if (this.UI) this.UI.$('area').value = id; return; }
    W.switching = true;
    W.tools.up(); W.tools.ptr.down = false;
    const keepVw = W.area.view / (W.cam.zoom || 1);
    W.ensureAreas(); W.stashArea();
    W.setArea(id); W.setTone(W.toneIdx);
    try { await this.loadSets(); } finally {
      W.restoreArea(); W.switching = false;
      if (this.UI) { const z = PP.clamp(W.area.view / keepVw, this.UI.zmin(), PP.UI.ZMAX); W.cam.zoom = W.cam.tz = z; W.cam.vw = W.area.view / z; }
    }
    if (this.UI) { this.UI.$('area').value = id; this.UI.renderTray(); this.UI.sel = null; }
  },
  async switchTone(i) {
    const W = this.W;
    W.setTone(i);
    await this.loadSets();
  },
  async loadSets() {
    const W = this.W, R = this.R, A = W.area;
    const name = W.toneIdx >= 4 ? A.deepSet : A.set;
    const [cur, det] = await Promise.all([R.loadSet(name), R.loadSet('body')]);
    W.curSet = cur; W.detSet = det;
    // deep-tone and fair photos were normalised to their own statistics; nothing else to change here
  },
};

(async function boot() {
  const loading = document.getElementById('loading');
  const fail = (msg) => { loading.textContent = msg; loading.style.textTransform = 'none'; loading.style.letterSpacing = '0'; loading.style.padding = '24px'; loading.style.textAlign = 'center'; PP.diag.error(msg); };
  let W, R;
  try {
    W = new PP.World();
    R = new PP.Renderer(document.getElementById('gl'), W);
    W.render = R;
    PP.main.B = new PP.Body(R, W);
  } catch (e) {
    fail('This simulator needs WebGL2 with float render targets. ' + (e.message || e));
    return;
  }
  PP.main.W = W; PP.main.R = R;
  const tm = {}; const T0 = performance.now(); const mark = (k) => { tm[k] = Math.round(performance.now() - T0); };
  const say = (t) => { loading.textContent = t; };
  try {
    // start every download now; the GPU compiles shaders in parallel
    say('Downloading skin scans…');
    R.prefetchEnv();
    W.manifest = await fetch('tex/manifest.json').then((r) => { if (!r.ok) throw new Error('manifest ' + r.status); return r.json(); });
    W.setArea(W.areaId); W.setTone(W.toneIdx);
    const A = W.area; R.prefetchSet(W.toneIdx >= 4 ? A.deepSet : A.set); R.prefetchSet('body');
    mark('manifest');
    await R.G.finishAll(); mark('shaders');
    say('Preparing studio lighting…');
    await R.loadEnv(); mark('env');
    say('Building skin maps…');
    await PP.main.loadSets(); mark('sets');
  } catch (e) {
    fail('Could not load the skin scans: ' + (e.message || e));
    return;
  }
  R.resize();
  PP.main.UI = new PP.UI(W);
  W.newPatch(W.seed);
  R.warm(); mark('firstFrame');
  loading.hidden = true;
  if (PP.TEST) PP.diag.write('TIMING ' + JSON.stringify(tm));
  const B = PP.main.B;
  // after the first frame: fetch the face model and the other areas' scans, and draw the face once offscreen
  // so its shaders are fully compiled before the first zoom-out
  setTimeout(() => {
    for (const n of ['deep', 'nose', 'body']) R.loadSet(n).catch(() => {});
    B.load().then(() => { W.ensureAreas(); B.matrices(); B.render(); }).catch(() => {});
  }, PP.TEST ? 0 : 400);

  const dt = 1 / 120;
  let acc = 0, last = performance.now(), frozen = false;
  const origBuild = R.buildInstances.bind(R);
  R.buildInstances = function () {
    let n = origBuild();
    if (W._frozenPrims) { this.instData.set(W._frozenPrims, n * 16); n += W._frozenPrims.length / 16; }
    return n;
  };

  if (PP.TEST) {
    const tests = new PP.Tests(W);
    try {
      if (PP.TEST === 'all') { await tests.all(); }
      else await tests.visual(PP.TEST);
    } catch (e) { PP.diag.error('Test crashed: ' + (e.stack || e.message || e)); }
    frozen = true;
    PP.main.UI.update(0.3);
    PP.diag.write('RENDER ok ' + R.w + 'x' + R.h + ' particles=' + W.parts.count + ' lesions=' + W.lesions.length);
  }

  // Render on demand + dynamic resolution. While anything moves, render every frame and adapt the
  // internal resolution to hold ~60 fps (GPU timer when available). When everything is still, render a
  // full-resolution frame a few times a second (slow changes like redness fading) and re-present it otherwise.
  let goodN = 0, idleT = 9, lastFull = 0, pc = { x: NaN, y: NaN, z: NaN, w: 0, h: 0 };
  function frame(now) {
    const fdt = PP.clamp((now - last) / 1000, 0, 0.05);   // rAF's first timestamp can be earlier than 'last'
    last = now;
    PP.main.fps = PP.lerp(PP.main.fps || 60, 1 / Math.max(fdt, 1e-3), 0.05);
    if (!frozen) {
      acc += fdt;
      let n = 0;
      while (acc >= dt && n < 3) { W.step(dt); acc -= dt; n++; }
      if (n === 3) acc = 0;   // never snowball: a slow frame just runs the sim slower
      if (B.mode === 'macro' || B.mode === 'leaving') PP.main.UI.easeCamera(fdt);
    }
    const bMoved = B.update(fdt);
    if (W.switching) { R.present(); requestAnimationFrame(frame); return; }
    if (B.mode !== 'macro') {
      // face / body view; during a crossfade both views render and the body is blended over the macro composite
      if (B.fade < 1) { R.presentTex = null; R.onComposite = () => B.blendInto(); R.render(fdt); R.onComposite = null; }
      else {
        if (bMoved || B.dirty || frozen) B.render();
        R.presentTex = B.rt ? B.rt.texs[0] : null; R.present();
      }
      PP.main.UI.update(fdt);
      W.audio.vacuum(false, 0);
      requestAnimationFrame(frame);
      return;
    }
    R.presentTex = null;
    const C = W.cam;
    const camMoved = C.x !== pc.x || C.y !== pc.y || C.zoom !== pc.z || R.canvas.clientWidth !== pc.w || R.canvas.clientHeight !== pc.h;
    pc.x = C.x; pc.y = C.y; pc.z = C.zoom; pc.w = R.canvas.clientWidth; pc.h = R.canvas.clientHeight;
    const active = frozen || camMoved || W.phys.contacts.length > 0 || W.phys.ghosts.length > 0 || W.parts.moving || R.drops.length > 0 || R.brushes.length > 0 ||
      W.cam.shake > 0 || W.time < (W.activeUntil || 0) || W.tools.ptr.down;
    // camera shake on flinch
    const sh = W.cam.shake > 0 ? W.cam.shake * 0.6 : 0;
    const cx = C.x, cy = C.y;
    if (sh) { C.x += (Math.random() - 0.5) * sh; C.y += (Math.random() - 0.5) * sh; }
    if (active) {
      R.render(fdt);
      idleT = 0;
      if (PP.TEST) { R.dyn = +(PP.params.get('dyn') || 1); }
      else {
      const ms = R.gpuMs != null ? R.gpuMs : fdt * 1000;
      if (ms > 17.5) { R.dyn = Math.max(0.5, (R.dyn || 1) * 0.9); goodN = 0; }
      else if (ms < (R.gpuMs != null ? 11 : 17.4) && ++goodN > 25) { R.dyn = Math.min(1, (R.dyn || 1) + 0.05); goodN = 0; }
      }
    } else {
      idleT += fdt;
      if (idleT > 0.2 && now - lastFull > 250) { R.render(fdt); lastFull = now; }
      else R.present();
    }
    if (sh) { C.x = cx; C.y = cy; }
    PP.main.UI.update(fdt);
    W.audio.vacuum(W.tools.id === 'vacuum' && W.tools.ptr.down, W.tools.vacLevel / 2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
