  // photographic micro-detail (multiplicative, from the de-lit scan); keep part of its chroma
  vec3 dr = dtl.rgb*2.0; float dl = dot(dr, vec3(0.2126,0.7152,0.0722));
  alb *= pow(clamp(mix(vec3(dl), dr, 0.4), 0.35, 1.28), vec3(uDetK));
  // pores and furrows: light is trapped in the pits and sebum/keratin sits in them (post-scatter darkening)
  float cav = clamp((0.55-nr.z)*2.2,0.0,1.0);
  alb *= mix(1.0, 0.72, clamp(nr.w*1.2,0.0,1.0)*(1.0-stretch)) * mix(1.0, 0.86, cav*(1.0-stretch));
  // petechiae: pinpoint haemorrhages from suction
  float pet = smoothstep(0.55,0.9, hash12(floor(p*7.0)))*smoothstep(0.15,0.6,ph0.a);
  alb = mix(alb, vec3(0.32,0.03,0.04), pet*0.7);
  // lesion contents showing through thin roofs
  alb = mix(alb, lo.cCol, lo.cMix);
  // wound walls: epidermis edge, pink-white dermis, yellow fat below the dermis
  if(inW>0.0){
    vec3 wc = wd < uEpi*1.5 ? vec3(0.75,0.45,0.4) : wd < uDermis ? mix(vec3(0.86,0.6,0.58), vec3(0.93,0.78,0.74), wd/uDermis) : vec3(0.95,0.8,0.32);
    wc = mix(wc, vec3(0.42,0.03,0.03), uBloodOn*clamp(0.55+0.4*(1.0-film.r*0.0),0.0,1.0)*smoothstep(0.1,0.6,wd));
    alb = mix(alb, wc, inW);
  }
  if(pun>0.0) alb = mix(alb, vec3(0.3,0.03,0.03)*uBloodOn + vec3(0.5,0.35,0.3)*(1.0-uBloodOn), pun*0.8);
  // iodine (brown povidone film)
  alb *= mix(vec3(1.0), vec3(0.62,0.33,0.12), clamp(film.a,0.0,1.0)*0.85);
  // pus residue + blood film (wet = glossy bright red, dry = dark brown)
  alb = mix(alb, vec3(0.86,0.78,0.5), clamp(film.g,0.0,1.0)*0.55);
  float wetness = clamp(film.b,0.0,1.0);
  vec3 bloodC = mix(vec3(0.16,0.03,0.02), vec3(0.42,0.02,0.02), wetness);
  alb = mix(alb, bloodC, clamp(film.r*1.2,0.0,0.92)*uBloodOn);
  // hydrocolloid patches
  float patchM=0.0; float patchAge=0.0;
  for(int i=0;i<uNPatch;i++){ float r=length(p-uPatchD[i].xy); float m2=1.0-smoothstep(uPatchD[i].z*0.92,uPatchD[i].z,r); if(m2>patchM){patchM=m2; patchAge=uPatchD[i].w;} }
  // stubble / vellus hair (beard, scalp)
  float hairM=0.0;
  if(uHair>0.5){
    vec2 cell=floor(X*(uHair>1.5?1.6:2.4)); vec2 fr=fract(X*(uHair>1.5?1.6:2.4))-0.5; vec2 jit=hash22(cell)-0.5;
    vec2 hq=fr-jit*0.5; float hr=length(hq);
    hairM=(1.0-smoothstep(0.035,0.06,hr))*(1.0-stretch);
    alb=mix(alb, vec3(0.05,0.04,0.035), hairM*0.85);
    alb=mix(alb, alb*vec3(0.75,0.78,0.85), (1.0-smoothstep(0.06,0.14,hr))*0.35);
  }
  // ---- lighting
  vec3 Ne = toEnv(N);
  vec3 Lk0 = normalize(uKey);
  float ndl = dot(N, Lk0);
  // soft studio fill (HDRI SH) + key strip light; wrap lets light bleed past the terminator as in skin
  vec3 fill = 0.42*shEval(Ne)*uExposure;
  vec3 keyD = 0.86*vec3(1.0,0.98,0.95)*max(0.0,(ndl+0.12)/1.12);
  // cast shadows from instruments / fluids onto the skin (screen-space height march toward the key light)
  float sh2=0.0; vec3 Lk=normalize(uKey);
  vec2 stepUv = (Lk.xy/max(Lk.z,0.25))/uView;
  for(int k=1;k<=14;k++){
    float t = pow(float(k)/14.0, 1.6)*28.0;
    vec2 q = vUv + stepUv*t; float oh = objH(q);
    float rayH = H + t*1.0;
    sh2 = max(sh2, clamp((oh-rayH)/(0.6+t*0.25), 0.0, 1.0));
  }
  sh2 *= 0.62;   // the key is a large softbox: penumbrae are wide and never fully dark
  float ao = lo.ao;
  for(int k=0;k<6;k++){ float an=float(k)*1.047; vec2 q=vUv+vec2(cos(an),sin(an))*1.6/uView; float oh=objH(q); ao -= clamp((oh-H)*0.0+ (oh>H? 0.12*exp(-max(oh-H,0.0)*0.5):0.0),0.0,0.12); }
  ao *= 1.0 - 0.35*clamp((0.5-nr.z)*2.0,0.0,1.0)*(1.0-stretch);   // cavity occlusion in furrows/pores
  ao *= 1.0 - 0.4*clamp(nr.w,0.0,1.0)*(1.0-stretch);                 // pores (scan pore mask)
  vec3 irr = (fill*mix(1.0,0.7,sh2) + keyD*(1.0-sh2)) * ao;
  // specular: two lobes (broad + sebum sheen), wet films and tense domes are smoother
  vec3 V=vec3(0,0,1); float nv=max(N.z,1e-3);
  float oil = clamp(uOil + 0.4*heat*0.0 + lo.gloss*0.6 + stretch*0.25, 0.0, 1.0);
  float wet = clamp(max(wetness, lo.wet), 0.0, 1.0);
  vec3 R = reflect(-V, N);
  float F = 0.028 + (1.0-0.028)*pow(1.0-nv,5.0);
  vec3 spec = F*(0.55*envSpec(R,0.42) + oil*0.75*envSpec(R,0.2) + wet*1.4*envSpec(R,0.06))*uExposure*0.6;
  spec += (0.5*keySpec(N,Lk0,0.45,0.028) + oil*0.9*keySpec(N,Lk0,0.24,0.028) + wet*1.2*keySpec(N,Lk0,0.09,0.02) + lo.gloss*1.6*keySpec(N,Lk0,0.11,0.03))*0.55*(1.0-sh2);
  spec += lo.gloss*0.8*F*envSpec(R,0.1)*uExposure*0.6;
  spec *= mix(1.0,0.45,sh2)*ao;
  float skinH = H;
  // patch: semi-transparent film over everything
  if(patchM>0.0){ float whiten=clamp(patchAge,0.0,1.0); alb=mix(alb, mix(vec3(0.82,0.66,0.52), vec3(0.93,0.9,0.86), whiten), patchM*(0.45+0.5*whiten)); spec += patchM*0.03*envSpec(R,0.12); }

  // ---- objects (fluids, extracted material, instruments) over the skin
  vec4 ob = texture(uObj, vUv); vec4 oc = texture(uObjCol, vUv);
  oIrr = vec4(irr, 1.0); oAlb = vec4(alb, skinH); oSpec = vec4(spec, 0.0);
  if(uDbg>0){ vec3 dc = uDbg==1 ? vec3(nr.z) : uDbg==2 ? N*0.5+0.5 : uDbg==3 ? alb : uDbg==4 ? irr*0.5 : uDbg==5 ? vec3(ch.rgb) : spec*4.0; oIrr=vec4(0.0); oAlb=vec4(0.0,0.0,0.0,0.0); oSpec=vec4(dc,1.0); return; }
  float matI = ob.y;
  if(matI > 0.5 && ob.x > skinH - 0.01){
    int mat = int(matI+0.5);
    vec3 n2 = vec3(ob.zw, sqrt(max(0.0,1.0-dot(ob.zw,ob.zw))));
    // procedural surface detail per material
    vec2 wp = p*vec2(1.0);
    if(mat==6||mat==9||mat==13) n2 = normalize(n2 + vec3(vnoise(wp*7.0)-0.5, vnoise(wp*7.0+5.0)-0.5, 0.0)*1.1 + vec3(vnoise(wp*19.0)-0.5, vnoise(wp*19.0+2.0)-0.5, 0.0)*0.5);
    if(mat==8) n2 = normalize(n2 + vec3(vnoise(wp*3.0)-0.5, vnoise(wp*3.0+3.0)-0.5, 0.0)*0.35);
    if(mat==31||mat==35) n2 = normalize(n2 + vec3(vnoise(wp*14.0)-0.5, vnoise(wp*14.0+2.0)-0.5,0.0)*0.9);
    vec3 n2e = toEnv(n2);
    vec3 R2 = reflect(-V, n2); float nv2=max(n2.z,1e-3);
    float thick = max(ob.x - skinH, 0.0);
    vec3 base = oc.rgb; float rough=0.35, f0=0.03, metal=0.0, trans=0.0;
    if(mat==6) base *= 0.86 + 0.22*vnoise(wp*5.0);
    if(mat==1){ rough=0.22; } else if(mat==2||mat==15){ rough=0.1; trans=0.35; } else if(mat==3){ rough=0.05; trans=0.85; base=vec3(0.95,0.9,0.7); }
    else if(mat==4){ rough=0.04; trans=1.0; } else if(mat==7){ rough=0.06; trans=0.6; }
    else if(mat==5){ rough=0.35; } else if(mat==6){ rough=0.7; } else if(mat==8){ rough=0.18; }
    else if(mat==9){ rough=0.6; } else if(mat==10){ rough=0.28; } else if(mat==11){ rough=0.14; trans=0.3; } else if(mat==12){ rough=0.18; }
    else if(mat==13){ rough=0.5; } else if(mat==14){ rough=0.9; }
    else if(mat==30){ rough=mix(0.48,0.16,oc.a); trans=0.62; } else if(mat==31){ rough=0.95; } else if(mat==32){ rough=0.12; metal=1.0; f0=0.85; }
    else if(mat==33){ rough=0.04; trans=0.92; f0=0.04; } else if(mat==34){ rough=0.9; trans=0.55; } else if(mat==35){ rough=0.92; }
    else if(mat==36){ rough=0.32; } else if(mat==37){ rough=0.12; trans=0.6; } else if(mat==38){ rough=0.8; } else if(mat==39){ rough=0.8; }
    else if(mat==40){ rough=0.45; base=alb; }
    float Fo = f0 + (1.0-f0)*pow(1.0-nv2,5.0);
    vec3 env = envSpec(R2, rough);
    float osh=0.0; vec2 stepUv2 = (Lk.xy/max(Lk.z,0.25))/uView;
    for(int k=1;k<=8;k++){ float t=pow(float(k)/8.0,1.6)*24.0; float oh=objH(vUv+stepUv2*t); osh=max(osh, clamp((oh-(ob.x+t))/(0.8+t*0.3),0.0,1.0)); }
    vec3 dI = (0.55*shEval(n2e)*uExposure + 0.62*vec3(1.0,0.98,0.95)*max(0.0,dot(n2,Lk0)))*mix(1.0,0.45,osh);
    vec3 sI = env*mix(1.0,0.5,osh)*uExposure*0.6 + keySpec(n2,Lk0,max(rough,0.05),1.0)*0.55*(1.0-osh);
    vec3 col;
    if(metal>0.5) col = (sI + 0.22*uExposure*shEval(n2e))*mix(vec3(0.92,0.91,0.88), base, 0.25)*(0.45+0.55*Fo) + dI*0.05;
    else {
      // wrap diffuse approximates light scattering inside creamy pus / fat / nitrile
      float wrap = (mat==1||mat==8||mat==11||mat==12||mat==30) ? 0.35 : 0.1;
      col = base*dI*(1.0-wrap*0.3) + base*shEval(normalize(n2e+vec3(0,0,wrap)))*wrap*uExposure*0.3 + Fo*sI;
    }
    if(mat==34){ // gauze: open weave lets the skin show through
      vec2 g=fract(p*2.2); float weave = smoothstep(0.08,0.2,min(min(g.x,1.0-g.x),min(g.y,1.0-g.y)));
      trans = mix(0.1, 0.75, weave);
    }
    if(trans>0.0){
      // thin liquids: tint and darken the skin under them by thickness (Beer–Lambert) and add their reflection
      vec3 sig = mat==4 ? vec3(1.6,16.0,18.0) : mat==2||mat==15 ? vec3(0.4,0.8,2.5) : mat==7 ? vec3(0.05,0.35,2.6) : mat==3 ? vec3(0.05,0.12,0.6) : vec3(0.5);
      vec3 Tr = exp(-sig*thick*1.4);
      if(mat==33||mat==34||mat==37) Tr = vec3(trans);
      if(mat==30){ float rim = pow(1.0-nv2, 2.0); Tr = mix(vec3(0.55,0.5,0.95), vec3(0.18,0.14,0.45), rim) * 0.95; }
      bool liquid = mat==2||mat==3||mat==4||mat==7||mat==15||mat==11;
      if(liquid){
        // liquids: the skin is seen only through the drop's own absorption; no light bleeds in from around it
        oIrr = vec4(0.0); oAlb = vec4(0.0,0.0,0.0, ob.x);
        oSpec = vec4(alb*irr*Tr + Fo*sI*1.15 + base*dI*(1.0-trans)*0.6, 1.0);
      } else {
        oIrr = vec4(irr*Tr, 1.0);
        oAlb = vec4(alb*mix(vec3(1.0), base, mat==33?0.0:0.25), max(skinH, ob.x));
        oSpec = vec4(spec*Tr + Fo*sI*(mat==33?1.4:1.0) + base*dI*(1.0-trans)*0.6, 0.0);
      }
    } else {
      oIrr = vec4(0.0); oAlb = vec4(0.0,0.0,0.0, ob.x); oSpec = vec4(col, 1.0);
    }
  }
}`;

/* ---------- separable SSS (sum-of-Gaussians skin profile, GPU Gems 3 ch.14) ---------- */
PP.SH.sssFS = `
in vec2 vUv; out vec4 o; uniform sampler2D uIrr; uniform vec2 uDir; uniform float uPxMm;
uniform float uOff[25]; uniform vec3 uW[25];
void main(){
  vec4 c=texture(uIrr,vUv); if(c.a<0.5){ o=c; return; }
  vec3 s=vec3(0.0), ws=vec3(0.0);
  for(int i=0;i<25;i++){
    vec2 uv=vUv+uDir*uOff[i]*uPxMm;
    vec4 q=texture(uIrr,uv);
    float m=q.a; vec3 w=uW[i]*m;
    s+=q.rgb*w; ws+=w;
  }
  o=vec4(s/max(ws,vec3(1e-5)),1.0);
}`;

/* ---------- composite + post: DoF, lens droplets, ACES, vignette, grain ---------- */
PP.SH.compFS = `
in vec2 vUv; out vec4 o; uniform sampler2D uSss, uAlb, uSpec, uIrr0;
void main(){
  vec4 a=texture(uAlb,vUv), s=texture(uSpec,vUv), i=texture(uSss,vUv), i0=texture(uIrr0,vUv);
  // 65% diffused light + 35% direct: millimetre-scale shape stays legible, skin still reads soft
  vec3 irr = i0.a>0.5 ? mix(i0.rgb, i.rgb, 0.65) : i.rgb;
  vec3 c = s.a>0.5 ? s.rgb : a.rgb*irr + s.rgb;
  o=vec4(c, a.a);
}`;
PP.SH.postFS = PP.SH.common + `
in vec2 vUv; out vec4 o; uniform sampler2D uC; uniform float uPxMm2, uTime, uDof;
uniform vec4 uDrop[24]; uniform vec4 uDrop2[24]; uniform int uND; uniform float uAspect;
vec3 aces(vec3 x){ const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14; return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0); }
vec3 tap(vec2 uv){ return texture(uC,uv).rgb; }
void main(){
  vec2 uv=vUv;
  // lens droplets refract (inverted, magnified view), tint and blur what is behind them
  vec3 tint=vec3(1.0); float dropM=0.0; vec2 duv=uv;
  for(int i=0;i<uND;i++){ vec4 d=uDrop[i], d2=uDrop2[i];
    vec2 q=(uv-d.xy)*vec2(uAspect,1.0); float r=length(q)/d.z;
    if(r<1.0){ float hz=sqrt(1.0-r*r); vec2 nrm=q/d.z; duv = d.xy - (uv-d.xy)*0.55 + nrm*0.02*hz; dropM=max(dropM, 1.0-smoothstep(0.85,1.0,r));
      tint = d2.x<0.5 ? vec3(0.95,0.32,0.28)*(0.55+0.45*hz) : d2.x<1.5 ? vec3(0.97,0.93,0.78)*(0.8+0.2*hz) : vec3(1.0);
      tint = mix(vec3(1.0), tint, d.w);
    } }
  vec4 c0=texture(uC,uv);
  float coc = clamp(abs(c0.a-0.0)*uDof, 0.0, 14.0);
  vec3 c=c0.rgb;
  if(coc>0.8){ vec3 s=vec3(0.0); float w=0.0;
    for(int k=0;k<16;k++){ float an=float(k)*2.39996; float rr=sqrt((float(k)+0.5)/16.0)*coc; vec2 off=vec2(cos(an),sin(an))*rr/uRes; vec4 q=texture(uC,uv+off);
      float qc=clamp(abs(q.a)*uDof,0.0,14.0); float ww = qc>=rr*0.7 ? 1.0 : 0.2; s+=q.rgb*ww; w+=ww; }
    c = s/w; }
  if(dropM>0.0){ vec3 b=vec3(0.0); for(int k=0;k<8;k++){ float an=float(k)*0.785; b+=tap(duv+vec2(cos(an),sin(an))*0.004); } b/=8.0; c=mix(c, b*tint, dropM); c += dropM*0.04; }
  // chromatic aberration toward the frame edge
  vec2 cd=(uv-0.5); float ca=dot(cd,cd)*0.004;
  c.r = mix(c.r, texture(uC, uv+cd*ca).r, 0.6); c.b = mix(c.b, texture(uC, uv-cd*ca).b, 0.6);
  c = aces(c*1.0);
  c = pow(c, vec3(1.0/2.2));

  c *= vig;
  float g = hash12(gl_FragCoord.xy + fract(uTime*7.31)*97.0)-0.5;
  c += g*0.022;
  o=vec4(c,1.0);
}`;

'use strict';
/* Renderer: owns GL resources and runs the passes each frame. */
PP.Renderer = function (canvas, W) {
  const G = (this.G = new PP.GL(canvas));
  const gl = (this.gl = G.gl);
  this.W = W;
  this.canvas = canvas;
  const SH = PP.SH;
  this.P = {
    def: G.program('deform', SH.fsVS, SH.defFS),
    grad: G.program('grad', SH.fsVS, SH.gradFS),
    pref: G.program('prefilter', SH.fsVS, SH.prefFS),
    obj: G.program('objects', SH.objVS, SH.objFS),
    smooth: G.program('smooth', SH.fsVS, SH.smoothFS),
    phys: G.program('phys', SH.fsVS, SH.physFS),
    brush: G.program('brush', SH.brushVS, SH.brushFS),
    skin: G.program('skin', SH.fsVS, SH.skinFS),
    sss: G.program('sss', SH.fsVS, SH.sssFS),
    comp: G.program('comp', SH.fsVS, SH.compFS),
    post: G.program('post', SH.fsVS, SH.postFS),
  };
  this.scale = PP.TEST ? 0.75 : PP.Renderer.scaleFor(PP.storage.get('quality', 'high'));
  this.rt = {};
  this.instData = new Float32Array(16 * 9000);
  this.lesData = new Float32Array(6 * 64 * 4);
  this.lesTex = G.tex(6, 64, { ifmt: gl.RGBA32F, fmt: gl.RGBA, type: gl.FLOAT, filter: gl.NEAREST });
  this.gridN = 48;
  this.gridData = new Uint16Array(this.gridN * this.gridN * 4);
  this.gridTex = G.tex(this.gridN, this.gridN, { ifmt: gl.RGBA16UI, fmt: gl.RGBA_INTEGER, type: gl.UNSIGNED_SHORT, filter: gl.NEAREST });
  this.heatBytes = new Uint8Array(64 * 64);
  this.heatTex = G.tex(64, 64, { ifmt: gl.R8, fmt: gl.RED, type: gl.UNSIGNED_BYTE });
  this.dummy = G.tex(4, 4, { data: new Uint8Array(64) });
  this.physA = null; this.physB = null; this.film = null;
  this.brushes = [];
  this.drops = [];   // lens droplets
  this.initSSS();
};

PP.Renderer.prototype.initSSS = function () {
  // GPU Gems 3 ch.14 three-layer skin: variances (mm^2) and RGB weights
  const V = [0.0064, 0.0484, 0.187, 0.567, 1.99, 7.41];
  const Wt = [[0.233, 0.455, 0.649], [0.1, 0.336, 0.344], [0.118, 0.198, 0.0], [0.113, 0.007, 0.007], [0.358, 0.004, 0.0], [0.078, 0, 0]];
  const N = 12, Rmax = 4.2;
  const xs = [];
  for (let k = -N; k <= N; k++) xs.push(Math.sign(k) * Rmax * Math.pow(Math.abs(k) / N, 2));
  const off = new Float32Array(25), w = new Float32Array(75), sum = [0, 0, 0];
  for (let k = 0; k < 25; k++) {
    const x = xs[k];
    const dx = k === 0 ? xs[1] - xs[0] : k === 24 ? xs[24] - xs[23] : (xs[k + 1] - xs[k - 1]) / 2;
    off[k] = x;
    for (let c = 0; c < 3; c++) {
      let p = 0;
      for (let i = 0; i < 6; i++) p += (Wt[i][c] * Math.exp((-x * x) / (2 * V[i]))) / Math.sqrt(2 * Math.PI * V[i]);
      w[k * 3 + c] = p * dx; sum[c] += p * dx;
    }
  }
  for (let k = 0; k < 25; k++) for (let c = 0; c < 3; c++) w[k * 3 + c] /= sum[c];
  this.sssOff = off; this.sssW = w;
};

PP.Renderer.prototype.resize = function () {
  const G = this.G, gl = this.gl;
  const cw = Math.max(16, Math.floor(this.canvas.clientWidth * this.scale)), ch = Math.max(16, Math.floor(this.canvas.clientHeight * this.scale));
  if (this.w === cw && this.h === ch) return;
  this.w = cw; this.h = ch;
  this.canvas.width = cw; this.canvas.height = ch;
  for (const k in this.rt) G.freeTarget(this.rt[k]);
  const F16 = { ifmt: gl.RGBA16F, fmt: gl.RGBA, type: gl.HALF_FLOAT };
  const F16N = { ifmt: gl.RGBA16F, fmt: gl.RGBA, type: gl.HALF_FLOAT, filter: gl.NEAREST };
  const hw = Math.max(8, cw >> 1), hh = Math.max(8, ch >> 1);
  this.rt.def = G.target(hw, hh, [F16, F16]);
  this.rt.obj = G.target(cw, ch, [F16N, { ifmt: gl.RGBA8, fmt: gl.RGBA, type: gl.UNSIGNED_BYTE, filter: gl.NEAREST }], true);
  this.rt.objS = G.target(cw, ch, [F16]);
  this.rt.skin = G.target(cw, ch, [F16, F16, F16]);
  this.rt.sssA = G.target(cw, ch, [F16]);
  this.rt.sssB = G.target(cw, ch, [F16]);
  this.rt.comp = G.target(cw, ch, [F16]);
};

PP.Renderer.prototype.setupWorld = function () {
  const G = this.G, gl = this.gl;
  const F16 = { ifmt: gl.RGBA16F, fmt: gl.RGBA, type: gl.HALF_FLOAT };
  for (const k of ['physA', 'physB', 'film']) if (this[k]) G.freeTarget(this[k]);
  this.physA = G.target(512, 512, [F16]); this.physB = G.target(512, 512, [F16]);
  this.film = G.target(1024, 1024, [{ ifmt: gl.RGBA8, fmt: gl.RGBA, type: gl.UNSIGNED_BYTE }]);
  // perfusion starts at 1
  for (const t of [this.physA, this.physB]) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.viewport(0, 0, 512, 512); gl.clearColor(1, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.film.fb); gl.viewport(0, 0, 1024, 1024); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  this.drops.length = 0;
};

// ---------- assets ----------
PP.Renderer.scaleFor = (q) => (q === 'low' ? 0.6 : q === 'sharp' ? Math.min(window.devicePixelRatio || 1, 1.5) : Math.min(window.devicePixelRatio || 1, 1));
PP.Renderer.prototype.prefetchSet = function (name) {
  for (const k of ['_chromo.webp', '_hgt.webp', '_detail.webp']) this.loadImage('tex/' + name + k);
};
PP.Renderer.prototype.loadImage = function (url) {
  this._img = this._img || new Map();
  if (this._img.has(url)) return this._img.get(url);
  const pr = this._loadImage(url);
  this._img.set(url, pr);
  return pr;
};
PP.Renderer.prototype._loadImage = function (url) {
  return fetch(url).then((r) => { if (!r.ok) throw new Error('Failed to load ' + url + ' (' + r.status + ')'); return r.blob(); })
    .then((b) => createImageBitmap(b, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' }));
};
PP.Renderer.prototype.loadSet = async function (name) {
  this.sets = this.sets || {};

  const G = this.G, gl = this.gl;
  const [ci, hi, di] = await Promise.all([this.loadImage('tex/' + name + '_chromo.webp'), this.loadImage('tex/' + name + '_hgt.webp'),
    this.loadImage('tex/' + name + '_detail.webp').catch(() => null)]);
  const chromo = G.texFromImage(ci);
  const detail = di ? G.texFromImage(di) : G.tex(4, 4, { data: new Uint8Array(64).fill(128), wrap: gl.REPEAT });
  const hraw = G.texFromImage(hi);
  // gradient texture (RGBA16F: d/du, d/dv, height, pore)
  const sz = hi.width;
  const rt = G.target(sz, sz, [{ ifmt: gl.RGBA16F, fmt: gl.RGBA, type: gl.HALF_FLOAT, wrap: gl.REPEAT, mip: false }]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fb); gl.viewport(0, 0, sz, sz);
  gl.useProgram(this.P.grad.p);
  G.bindTex(0, hraw, this.P.grad.u.uH); gl.uniform1f(this.P.grad.u.uSize, sz);
  G.drawFS();
  gl.bindTexture(gl.TEXTURE_2D, rt.texs[0].t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteTexture(hraw.t);

  this.sets[name] = set;

};
PP.Renderer.prototype.prefetchEnv = function () {
  this._envP = this._envP || fetch('env/env.json').then((r) => { if (!r.ok) throw new Error('env.json ' + r.status); return r.json(); });
  return this._envP;
};
PP.Renderer.prototype.loadEnv = async function () {
  const G = this.G, gl = this.gl;
  const meta = await this.prefetchEnv();
  this.envMeta = meta;
  // half-float RGBA radiance, base64 in the JSON (artifacts serve JSON but not raw binary)
  const bin = atob(meta.data_b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const env = G.tex(meta.width, meta.height, { ifmt: gl.RGBA16F, fmt: gl.RGBA, type: gl.HALF_FLOAT, data: new Uint16Array(bytes.buffer), wrap: gl.REPEAT });
  const lw = 128, lh = 64;
  const atlas = G.target(lw, lh * 5, [{ ifmt: gl.RGBA16F, fmt: gl.RGBA, type: gl.HALF_FLOAT }]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, atlas.fb);
  gl.useProgram(this.P.pref.p);
  G.bindTex(0, env, this.P.pref.u.uEnv);
  const rough = [0.05, 0.2, 0.38, 0.56, 0.74];

    gl.uniform1f(this.P.pref.u.uRough, rough[l]);
    G.drawFS();
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  this.envAtlas = atlas.texs[0];

  const yaw = this.W.envYaw;

  const s = meta.sh9, Y = (k) => s[k];
  const E = [0, 1, 2].map((c) => 0.886227 * Y(0)[c] + 1.023328 * (Y(1)[c] * n[1] + Y(2)[c] * n[2] + Y(3)[c] * n[0]) + 0.858086 * (Y(4)[c] * n[0] * n[1] + Y(5)[c] * n[1] * n[2] + Y(7)[c] * n[0] * n[2]) + 0.247708 * Y(6)[c] * (3 * n[2] * n[2] - 1) + 0.429043 * Y(8)[c] * (n[0] * n[0] - n[1] * n[1]));
  const lum = 0.2126 * E[0] + 0.7152 * E[1] + 0.0722 * E[2];

};

// ---------- per-frame data ----------
PP.Renderer.prototype.uploadLesions = function () {
  const W = this.W, d = this.lesData;
  d.fill(0);
  const Ls = W.lesions.slice(0, 64);
  Ls.forEach((L, i) => {
    const o = i * 24;
    const cx = L.x + L.ox, cy = L.y + L.oy;
    const T = L.T;
    const f = L.queue.length ? L.fill() : 1;
    const H = L.domeH();
    const plugExt = L.plug ? (L.plug.out ? 1 : L.plug.ext / L.plug.L) : (L.coreOut || (L.T.vis === 20 && L.done) ? 1 : 0);
    const headR = T.vis === 9 || T.vis === 10 ? L.R * (0.12 + 0.2 * L.pointing) : T.vis === 1 || T.vis === 2 ? L.R * 0.35 : L.R * 0.45;
    let openVis = L.open.r > 0 && (L.popped || L.open.kind === 'needle' || L.open.kind === 'tear') ? Math.min(L.ropen ? L.ropen() : L.open.r, L.R * 0.6) : 0;
    if (T.open === 'open') openVis = L.open.r;
    const cc = L.type === 'pustule' || L.type === 'giant' || L.type === 'ingrown' || L.type === 'furuncle' || L.type === 'carbuncle' ? L.pusCol : L.type === 'pseudocyst' ? PP.hex2lin('#b97f6a') : L.type === 'epidermoid' || L.type === 'pilar' ? PP.hex2lin('#efe2b8') : L.type === 'whitehead' || L.type === 'macrocomedone' ? PP.hex2lin('#f0ead8') : PP.hex2lin('#f2eee4');
    const vis = T.vis;
    const vals = [
      cx, cy, L.R, H,
      vis, L.inflam + L.deep * 0.4 + L.irrit * 0.5, headR, openVis,
      cc[0], cc[1], cc[2], L.type === 'furuncle' || L.type === 'carbuncle' ? 1 : f,
      L.depth, L.queue.length && L.open.r > 0 ? 1 - f : 0, L.crater, L.punctum || 0,
      L.seed, L.pointing, L.hematoma, plugExt,
      0, L.steroidT >= 0 ? PP.clamp(L.steroidT / 172800, 0, 1) : 0, L.scab, 0,
    ];
    d.set(vals, o);
  });
  const gl = this.gl;
  gl.bindTexture(gl.TEXTURE_2D, this.lesTex.t);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 6, 64, gl.RGBA, gl.FLOAT, d);
  // culling grid in material (patch) coordinates
  const N = this.gridN, s = W.area.size, cell = s / N;
  const gd = this.gridData; gd.fill(0);
  const best = new Float32Array(N * N * 4).fill(1e9);
  Ls.forEach((L, i) => {
    const ext = L.R * (L.T.vis >= 15 && L.T.vis <= 18 ? 1.25 : 2.4) + 1.0 + Math.hypot(L.ox, L.oy);
    const cx = L.x + L.ox, cy = L.y + L.oy;
    const x0 = Math.max(0, Math.floor((cx - ext + s / 2) / cell)), x1 = Math.min(N - 1, Math.floor((cx + ext + s / 2) / cell));
    const y0 = Math.max(0, Math.floor((cy - ext + s / 2) / cell)), y1 = Math.min(N - 1, Math.floor((cy + ext + s / 2) / cell));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const mx = (x + 0.5) * cell - s / 2, my = (y + 0.5) * cell - s / 2;
      const dist = Math.hypot(mx - cx, my - cy) - L.R;
      const k = (y * N + x) * 4;
      // keep the 4 nearest (by edge distance)
      let slot = -1, worst = -1;
      for (let j = 0; j < 4; j++) { if (gd[k + j] === 0) { slot = j; break; } if (best[k + j] > worst) { worst = best[k + j]; slot = j; } }
      if (gd[k + slot] === 0 || best[k + slot] > dist) { gd[k + slot] = i + 1; best[k + slot] = dist; }
    }
  });
  gl.bindTexture(gl.TEXTURE_2D, this.gridTex.t);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.RGBA_INTEGER, gl.UNSIGNED_SHORT, gd);

  const hb = this.heatBytes, ht = W.wounds.heat;

  gl.bindTexture(gl.TEXTURE_2D, this.heatTex.t);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 64, 64, gl.RED, gl.UNSIGNED_BYTE, hb);
};

PP.Renderer.prototype.contactUniforms = function (prog) {
  const gl = this.gl, C = this.W.phys.contacts;
  const n = Math.min(48, C.length);
  const a = new Float32Array(48 * 4), b = new Float32Array(48 * 4);
  for (let i = 0; i < n; i++) { const c = C[i]; a.set([c.x, c.y, c.a, c.fn || 0], i * 4); b.set([c.qx || 0, c.qy || 0, c.suction || 0, 0], i * 4); }

};
PP.Renderer.prototype.woundUniforms = function (prog) {
  const gl = this.gl, Wd = this.W.wounds;
  const cuts = Wd.cuts.slice(-16), c0 = new Float32Array(64), c1 = new Float32Array(64);
  cuts.forEach((c, i) => { c0.set([c.ax, c.ay, c.bx, c.by], i * 4); c1.set([c.depth, c.gape, c.clot, this.W.clock - c.t], i * 4); });

  holes.forEach((h, i) => { h0.set([h.x, h.y, h.along, h.across], i * 4); h1.set([h.depth, h.core ? 1 : 0, h.clot, 0], i * 4); });
  if (prog.u.uHole0) { gl.uniform4fv(prog.u.uHole0, h0); if (prog.u.uHole1) gl.uniform4fv(prog.u.uHole1, h1); gl.uniform1i(prog.u.uNH, holes.length); }

  inj.forEach((j, i) => {
    const e = Wd.epi(j.x, j.y);
    const R = 5 + 4 * j.vol;
    const age = this.W.clock - j.t;
    const wheal = j.kind === 'lido' ? Math.min(0.6, j.vol * 0.5) * Math.exp(-age / 900) : 0.05 * Math.exp(-age / 300);
    j0.set([j.x, j.y, j.kind === 'lido' ? R * 0.55 : 1.5, j.kind === 'lido' ? e : 0], i * 4); j1.set([wheal, 0, 0, 0], i * 4);

    pu.forEach((p, i) => p0.set([p.x, p.y, p.r * (1 - 0.5 * p.clot), 0], i * 4));
    gl.uniform4fv(prog.u.uPun, p0); gl.uniform1i(prog.u.uNP, pu.length);

PP.Renderer.prototype.camUniforms = function (prog, w, h) {
  const gl = this.gl, C = this.W.cam;
  gl.uniform2f(prog.u.uCam, C.x, C.y);
  gl.uniform2f(prog.u.uView, C.vw, C.vh);
  if (prog.u.uRes) gl.uniform2f(prog.u.uRes, w, h);
  if (prog.u.uPatch) gl.uniform1f(prog.u.uPatch, this.W.area.size);

// brush ops into the film decal texture: kind -> channel colour
PP.Renderer.prototype.brush = function (x, y, r, rgba, mode) { if (this.brushes.length < 40000) this.brushes.push({ x, y, r, c: rgba, mode: mode || 'add' }); };

PP.Renderer.prototype.render = function (dt) {
  const G = this.G, gl = this.gl, W = this.W, P = this.P;
  this.resize();
  const w = this.w, h = this.h;
  W.cam.update(w, h);
  this.uploadLesions();
  const A = W.area;
  const ph = W.phys;

  // 1. physiology field (ping-pong)
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.physB.fb); gl.viewport(0, 0, 512, 512);
  gl.useProgram(P.phys.p); this.camUniforms(P.phys, 512, 512);
  G.bindTex(0, this.physA.texs[0], P.phys.u.uPrev);
  gl.uniform1f(P.phys.u.uDt, Math.min(this.timelapseDt || dt, 1e7)); this.timelapseDt = 0;
  this.contactUniforms(P.phys); this.woundUniforms(P.phys);

  // 2. film decals (brushes)
  if (this.brushes.length) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.film.fb); gl.viewport(0, 0, 1024, 1024);
    gl.useProgram(P.brush.p); this.camUniforms(P.brush, 1024, 1024);

        if (n === 8000) { G.drawInstances(d, n); n = 0; }
      }
      if (n) G.drawInstances(d, n);
    }
    gl.blendEquation(gl.FUNC_ADD); gl.disable(gl.BLEND);
    this.brushes.length = 0;
  }

  // 3. deformation (half res)
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.rt.def.fb); gl.viewport(0, 0, this.rt.def.w, this.rt.def.h);
  gl.useProgram(P.def.p); this.camUniforms(P.def, this.rt.def.w, this.rt.def.h);
  this.contactUniforms(P.def); this.woundUniforms(P.def);
  gl.uniform1f(P.def.u.uNu, ph.nu); gl.uniform1f(P.def.u.uEn, ph.En); gl.uniform1f(P.def.u.uG, ph.G); gl.uniform1f(P.def.u.uLd, ph.Ld); gl.uniform1f(P.def.u.uHeff, ph.Heff);
  gl.uniform2f(P.def.u.uT, ph.tx, ph.ty);
  G.drawFS();

  // 4. objects (particles + instruments)
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.rt.obj.fb); gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
  gl.useProgram(P.obj.p); this.camUniforms(P.obj, w, h);
  const n = this.buildInstances();
  G.drawInstances(this.instData, n);
  gl.disable(gl.DEPTH_TEST);

  // 5. fluid smoothing
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.rt.objS.fb); gl.viewport(0, 0, w, h);
  gl.useProgram(P.smooth.p); this.camUniforms(P.smooth, w, h);
  G.bindTex(0, this.rt.obj.texs[0], P.smooth.u.uObj); gl.uniform1f(P.smooth.u.uPxMm, w / W.cam.vw);
  G.drawFS();

  // 6. skin + object shading

  gl.bindFramebuffer(gl.FRAMEBUFFER, this.rt.skin.fb); gl.viewport(0, 0, w, h);
  const S = P.skin; gl.useProgram(S.p); this.camUniforms(S, w, h);
  G.bindTex(0, set.chromo, S.u.uChromo); G.bindTex(1, set.nrm, S.u.uNrm); G.bindTex(2, det.nrm, S.u.uDet);
  G.bindTex(3, this.rt.def.texs[0], S.u.uDef0); G.bindTex(4, this.rt.def.texs[1], S.u.uDef1);
  G.bindTex(5, this.rt.objS.texs[0], S.u.uObj); G.bindTex(6, this.rt.obj.texs[1], S.u.uObjCol);
  G.bindTex(7, this.physA.texs[0], S.u.uPhys); G.bindTex(8, this.film.texs[0], S.u.uFilm); G.bindTex(9, this.dummy, S.u.uMarks);
  G.bindTex(10, this.envAtlas, S.u.uEnvP); G.bindTex(11, this.heatTex, S.u.uHeat); G.bindTex(12, this.lesTex, S.u.uLes);
  G.bindTex(14, set.detail, S.u.uDetail);
  gl.activeTexture(gl.TEXTURE13); gl.bindTexture(gl.TEXTURE_2D, this.gridTex.t); gl.uniform1i(S.u.uLGrid, 13);
  gl.uniform1i(S.u.uGridN, this.gridN); gl.uniform1i(S.u.uLSlots, 4);
  gl.uniform1f(S.u.uTile, set.meta.tile_mm); gl.uniform1f(S.u.uHmm, set.meta.height_mm * W.reliefK);
  gl.uniform1f(S.u.uDetTile, det.meta.tile_mm * W.detScale); gl.uniform1f(S.u.uDetAmt, W.detAmt);
  gl.uniform1f(S.u.uPxMm, w / W.cam.vw); gl.uniform1f(S.u.uTime, W.time);
  gl.uniform1f(S.u.uOil, A.oil); gl.uniform1f(S.u.uRedBase, A.red); gl.uniform1f(S.u.uHair, A.hair);
  gl.uniform3fv(S.u.uTone, W.tone.mean); gl.uniform3fv(S.u.uToneA, W.tone.amp);
  gl.uniform3fv(S.u.uVM, W.manifest.basis.melanin); gl.uniform3fv(S.u.uVH, W.manifest.basis.hemoglobin); gl.uniform3fv(S.u.uVS, W.manifest.basis.shade);
  gl.uniform3fv(S.u.uSH, this.sh); gl.uniform1f(S.u.uYaw, W.envYaw); gl.uniform1f(S.u.uExposure, W.exposure); gl.uniform1f(S.u.uRing, W.S.ring ? 1 : 0);
  gl.uniform3fv(S.u.uKey, W.keyDir);
  gl.uniform2f(S.u.uT, ph.tx, ph.ty); gl.uniform1f(S.u.uDermis, A.dermis); gl.uniform1f(S.u.uEpi, A.epi);
  gl.uniform1f(S.u.uBloodOn, W.S.blood ? 1 : 0);
  gl.uniform1i(S.u.uDbg, +(PP.params.get('dbg') || 0));
  // the face scan comes from deep-toned skin; its pore pigment contrast is toned down for lighter skin
  gl.uniform1f(S.u.uDetK, W.curSet === (this.sets && this.sets.deep) ? 0.55 + 0.09 * W.toneIdx : 0.85);
  this.woundUniforms(S);
  const pd = new Float32Array(32); const pts = W.decals.patches.slice(-8);
  pts.forEach((q, i) => pd.set([q.x, q.y, q.r, PP.clamp((W.clock - q.t) / 86400, 0, 1)], i * 4));
  gl.uniform4fv(S.u.uPatchD, pd); gl.uniform1i(S.u.uNPatch, pts.length);
  G.drawFS();

  // 7. subsurface scattering (separable, two passes)
  const pxmm = w / W.cam.vw;
  gl.useProgram(P.sss.p);
  gl.uniform1fv(P.sss.u.uOff, this.sssOff); gl.uniform3fv(P.sss.u.uW, this.sssW);
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.rt.sssA.fb);
  G.bindTex(0, this.rt.skin.texs[0], P.sss.u.uIrr); gl.uniform2f(P.sss.u.uDir, 1 / w, 0); gl.uniform1f(P.sss.u.uPxMm, pxmm);
  G.drawFS();
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.rt.sssB.fb);
  G.bindTex(0, this.rt.sssA.texs[0], P.sss.u.uIrr); gl.uniform2f(P.sss.u.uDir, 0, 1 / h);
  G.drawFS();

  // 8. composite
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.rt.comp.fb);
  gl.useProgram(P.comp.p);
  G.bindTex(0, this.rt.sssB.texs[0], P.comp.u.uSss); G.bindTex(1, this.rt.skin.texs[1], P.comp.u.uAlb); G.bindTex(2, this.rt.skin.texs[2], P.comp.u.uSpec);
  G.bindTex(3, this.rt.skin.texs[0], P.comp.u.uIrr0);
  G.drawFS();

  // 9. post to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, w, h);
  const PO = P.post; gl.useProgram(PO.p); this.camUniforms(PO, w, h);
  G.bindTex(0, this.rt.comp.texs[0], PO.u.uC);
  gl.uniform1f(PO.u.uTime, W.time); gl.uniform1f(PO.u.uDof, pxmm * 0.022);
  gl.uniform1f(PO.u.uAspect, w / h);
  const d0 = new Float32Array(96), d1 = new Float32Array(96);
  const drops = this.drops.slice(-24);
  drops.forEach((d, i) => { d0.set([d.u, d.v, d.r, d.a], i * 4); d1.set([d.m, 0, 0, 0], i * 4); });
  gl.uniform4fv(PO.u.uDrop, d0); gl.uniform4fv(PO.u.uDrop2, d1); gl.uniform1i(PO.u.uND, drops.length);

// particles + tool primitives -> instance buffer
PP.Renderer.prototype.buildInstances = function () {
  const W = this.W, P = W.parts, d = this.instData;
  let n = 0;
  const maxN = 9000;
  for (let i = 0; i < P.hi && n < maxN - 200; i++) {
    if (!P.alive[i]) continue;
    const j = P.next[i];
    const m = P.mat[i];
    if (j >= 0 && P.alive[j]) {
      d.set([P.x[i], P.y[i], P.z[i], P.r[i], P.x[j], P.y[j], P.z[j], P.r[j], 1, m, 0, 0, P.cr[i], P.cg[i], P.cb[i], 0], n * 16); n++;
    } else if (P.prev[i] < 0) {
      // free particle: liquids flatten into a sessile bead on the skin
      let r = P.r[i], z = P.z[i];
      if (P.onSkin[i] && P.isLiquid(m)) { z = z - r * 0.55; }
      d.set([P.x[i], P.y[i], z, r, P.x[i], P.y[i], z, r, 0, m, 0, 0, P.cr[i], P.cg[i], P.cb[i], 0], n * 16); n++;
    }
  }
  const T = W.tools;
  if (T.nPrim) { d.set(T.prims.subarray(0, T.nPrim * 16), n * 16); n += T.nPrim; }
  // draped splatter shield (loose gauze) over the active lesion while squeezing
  if (W.S.shield && W.phys.contacts.length && W.activeLesion) {
    const L = W.activeLesion;
    d.set([L.x, L.y, 9, 0, Math.max(L.R * 2.2, 6), Math.max(L.R * 2.2, 6), 0.4, 0.3, 2, PP.MATOBJ.gauze, 0, 0, W.decals.gauzeCol[0], W.decals.gauzeCol[1], W.decals.gauzeCol[2], 0.6], n * 16); n++;
  }
  return n;
};

/* Decals (film texture) + patches + suction dose + gauze stain. */
PP.Decals = function (W) {
  this.W = W; this.patches = []; this.gauzeCol = [0.95, 0.95, 0.93]; this.dose = new Map();
};
PP.Decals.prototype.reset = function () { this.patches.length = 0; this.gauzeCol = [0.95, 0.95, 0.93]; this.dose.clear(); };
PP.Decals.prototype.paint = function (x, y, r, kind, amt) {
  const R = this.W.render;
  const c = kind === 'blood' ? [0.6 * amt, 0, 0.7 * amt, 0] : kind === 'pus' ? [0, 0.5 * amt, 0.5 * amt, 0] : kind === 'serum' ? [0, 0, 0.7 * amt, 0] : kind === 'iodine' ? [0, 0, 0.25 * amt, 0.35 * amt] : [0, 0, 0, 0];
  R.brush(x, y, r, c, 'add');
};
PP.Decals.prototype.wipe = function (x, y, r, W) {
  this.W.render.brush(x, y, r, [0.12, 0.15, 0.25, 0.05], 'sub');
  // smear: a little of what was wiped is dragged along
  if (W.rng() < 0.3) this.W.render.brush(x + (W.rng() - 0.5) * r, y + (W.rng() - 0.5) * r, r * 0.6, [0.03, 0.0, 0.05, 0], 'add');
};
PP.Decals.prototype.suction = function (x, y, a, s, dt) {
  // the GPU physiology field draws the congestion / petechiae; the CPU tracks dose per 1 mm cell so
  // the simulation (and tests) know when a spot passed the makers' ~3 s limit at >=40 kPa
  if (s > 30 && this.W.rng() < dt * 4) this.W.render.brush(x, y, a + 0.5, [0, 0, 0.05, 0], 'add');
  if (s < 30) return;   // cupping data: ~-30 kPa ruptured capillaries, -20 kPa did not
  const key = Math.round(x) + ',' + Math.round(y);
  const d = (this.dose.get(key) || 0) + dt * (s / 52);
  this.dose.set(key, d);
  if (d > 3 && !this['_pet' + key]) {
    this['_pet' + key] = 1; this.W.stats.bruise++; this.petechiae = (this.petechiae || 0) + 1;
    this.W.fx.toast('bad', 'Petechiae', 'Suction held on one spot for more than ~3 s broke superficial capillaries (pinpoint bleeding, bruising).');
  }
};
PP.Decals.prototype.stain = function (rgb) {
  const g = this.gauzeCol;
  for (let k = 0; k < 3; k++) g[k] = PP.lerp(g[k], rgb[k] * 0.9 + 0.05, 0.08);
};

'use strict';
/* Procedural sound (Web Audio). Starts on the first user gesture. */
PP.Audio = function () {
  this.ctx = null; this.on = PP.storage.get('sound', true); this.master = null;
  this.lastGrain = 0; this.vac = null; this.creakT = 0;
};
PP.Audio.prototype.start = function () {
  if (this.ctx || !this.on) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
    const n = this.ctx.sampleRate * 1.5;
    this.noise = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.noise.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { this.ctx = null; }
};
PP.Audio.prototype.setOn = function (v) { this.on = v; PP.storage.set('sound', v); if (this.master) this.master.gain.value = v ? 0.55 : 0; if (v) this.start(); };
PP.Audio.prototype.burst = function (o) {
  const c = this.ctx; if (!c || !this.on) return;
  const t = c.currentTime + (o.delay || 0);
  const src = c.createBufferSource(); src.buffer = this.noise; src.playbackRate.value = o.rate || 1;
  const f = c.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f0 || 800, t);
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + (o.dur || 0.1));
  f.Q.value = o.q || 2;
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t + (o.att || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + (o.dur || 0.1));
  src.connect(f); f.connect(g); g.connect(this.master);
  src.start(t, Math.random() * 1.2); src.stop(t + (o.dur || 0.1) + 0.05);
};
PP.Audio.prototype.tone = function (o) {
  const c = this.ctx; if (!c || !this.on) return;
  const t = c.currentTime + (o.delay || 0);
  const osc = c.createOscillator(); osc.type = o.wave || 'sine'; osc.frequency.setValueAtTime(o.f0, t);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + o.dur + 0.05);
};
PP.Audio.prototype.pop = function (P) {
  const k = PP.clamp(P / 40, 0.3, 1.2);
  this.burst({ f0: 2600, f1: 600, q: 1.2, dur: 0.05, vol: 0.35 * k, type: 'bandpass' });
  this.tone({ f0: 180 * (1 + k * 0.3), f1: 70, dur: 0.09, vol: 0.32 * k });
  this.burst({ f0: 900, f1: 300, q: 3, dur: 0.16, vol: 0.12, delay: 0.03, rate: 0.7 });
};
PP.Audio.prototype.deep = function () { this.tone({ f0: 90, f1: 55, dur: 0.25, vol: 0.25 }); this.burst({ f0: 300, q: 1, dur: 0.2, vol: 0.12, type: 'lowpass' }); };
PP.Audio.prototype.spurt = function (v) { this.burst({ f0: 1800, f1: 500, q: 0.8, dur: 0.22, vol: PP.clamp(v / 6000, 0.1, 0.45), type: 'bandpass', rate: 1.4 }); };
PP.Audio.prototype.extrude = function (rate) {
  const c = this.ctx; if (!c || !this.on) return;
  const now = c.currentTime;
  const interval = PP.clamp(0.14 / Math.max(rate, 0.05), 0.025, 0.25);
  if (now - this.lastGrain < interval) return;
  this.lastGrain = now;
  this.burst({ f0: 260 + Math.random() * 380, f1: 120 + Math.random() * 100, q: 6, dur: 0.07 + Math.random() * 0.05, vol: 0.16, type: 'bandpass', rate: 0.6 });
};
PP.Audio.prototype.creak = function () { this.burst({ f0: 140, f1: 220, q: 9, dur: 0.12, vol: 0.12, type: 'bandpass', rate: 0.5 }); };
PP.Audio.prototype.tick = function () { this.burst({ f0: 5200, q: 4, dur: 0.02, vol: 0.18, type: 'bandpass' }); };
PP.Audio.prototype.slice = function () { this.burst({ f0: 6500, f1: 3500, q: 1.5, dur: 0.09, vol: 0.12, type: 'highpass' }); };
PP.Audio.prototype.click = function () { this.tone({ f0: 2400, f1: 1800, dur: 0.03, vol: 0.12, wave: 'square' }); };
PP.Audio.prototype.splat = function (size) { this.burst({ f0: 700, f1: 200, q: 2, dur: 0.06, vol: PP.clamp(size * 0.3, 0.05, 0.25), type: 'lowpass' }); };
PP.Audio.prototype.vacuum = function (on, level) {
  const c = this.ctx; if (!c) return;
  if (on && this.on && !this.vac) {
    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 118;
    const src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = c.createGain(); g.gain.value = 0.0;
    o.connect(f); src.connect(f); f.connect(g); g.connect(this.master); o.start(); src.start();
    this.vac = { o, src, g, f };
  }
  if (this.vac) {
    this.vac.g.gain.setTargetAtTime(on && this.on ? 0.05 + level * 0.05 : 0, c.currentTime, 0.05);
    this.vac.o.frequency.setTargetAtTime(110 + level * 30, c.currentTime, 0.1);
    if (!on) { const v = this.vac; this.vac = null; setTimeout(() => { try { v.o.stop(); v.src.stop(); } catch (_) { /* already stopped */ } }, 300); }
  }
};

/* ---- 10_world.js ---- */
'use strict';
/* World: simulation state + orchestration. */
PP.World = function () {
  const W = this;
  this.S = Object.assign({ blood: true, bloodAmt: 1, lens: true, surgical: true, pain: true, sound: true, spurt: 1.6, ooze: 1.4, shield: false, ring: true, preset: 'max' }, PP.storage.get('settings', {}));
  this.S.shield = false;
  this.phys = new PP.Phys();
  this.parts = new PP.Particles(7000);
  this.wounds = new PP.Wounds(this);
  this.decals = new PP.Decals(this);
  this.lesions = [];
  this.tools = new PP.Tools(this);
  this.audio = new PP.Audio();
  this.clock = 0; this.time = 0;
  this.seed = +(PP.params.get('seed') || Math.floor(Math.random() * 1e9));
  this.rng = PP.rng(this.seed);
  this.toneIdx = PP.storage.get('tone', 1);
  this.areaId = PP.params.get('area') || PP.storage.get('area', 'cheek');
  if (!PP.AREAS[this.areaId]) this.areaId = 'cheek';
  this.cam = { x: 0, y: 0, zoom: 1, vw: 24, vh: 15, cw: 1, ch: 1, shake: 0, sx: 0, sy: 0,
    update(w, h) { this.cw = w; this.ch = h; this.vw = W.area.view / this.zoom; this.vh = (this.vw * h) / w; } };
  this.envYaw = -0.55; this.exposure = 1.0; this.keyDir = [-0.58, 0.52, 0.62];
  this.reliefK = 1; this.detScale = 0.6; this.detAmt = 0.6;
  this.stats = { pops: 0, vol: 0, perfect: 0, deep: 0, flinch: 0, bruise: 0 };
  this.painLevel = 0;
  this.activeLesion = null;
  this.gravity = [0, -9000, -3000];
  this.lensZ = 125;
  this.grid = { n: 0 };
  this.ctx = { phys: this.phys, parts: this.parts, S: this.S, heatAt: (x, y) => this.wounds.heatAt(x, y), fx: null, rng: this.rng, clock: 0 };
};

PP.World.prototype.setArea = function (id) {
  this.areaId = id; this.area = PP.AREAS[id];
  this.phys.setArea(this.area);
  const g = this.area.grav;
  this.gravity = [g[0] * 9810, g[1] * 9810, g[2] * 9810];
  this.detScale = id === 'back' || id === 'scalp' ? 1.0 : 0.55;
  this.detAmt = id === 'back' || id === 'scalp' ? 0.35 : 0.22;
  this.reliefK = id === 'nose' ? 1.5 : 1.35;
  PP.storage.set('area', id);
};

// tone means (melanin, hemoglobin, shade) solved from a target sRGB colour in optical density space
PP.World.prototype.setTone = function (i) {
  this.toneIdx = i; PP.storage.set('tone', i);
  const lin = PP.hex2lin(PP.TONES[i].hex);
  const OD = lin.map((c) => -Math.log(Math.max(c, 1e-3)));
  const B = this.manifest.basis;
  const M = [B.melanin[0], B.hemoglobin[0], B.shade[0], B.melanin[1], B.hemoglobin[1], B.shade[1], B.melanin[2], B.hemoglobin[2], B.shade[2]];
  const inv = PP.inv3(M);
  const m = inv[0] * OD[0] + inv[1] * OD[1] + inv[2] * OD[2];
  const h = inv[3] * OD[0] + inv[4] * OD[1] + inv[5] * OD[2];
  const s = inv[6] * OD[0] + inv[7] * OD[1] + inv[8] * OD[2];
  this.tone = { mean: new Float32Array([m, h - this.area.red, s]), amp: new Float32Array([0.02 + 0.035 * m, 0.02, 0.08]) };
  this.skinLin = lin;
};
PP.World.prototype.skinColLin = function () { return this.skinLin || [0.7, 0.5, 0.4]; };

PP.World.prototype.newPatch = function (seed) {
  if (seed != null) this.seed = seed;
  this.rng = PP.rng(this.seed); this.ctx.rng = this.rng;
  this.parts.clear(); this.wounds.reset(); this.decals.reset();
  this.lesions = []; this.clock = 0; this.ctx.clock = 0;
  this.render.setupWorld();
  this.cam.x = 0; this.cam.y = 0; this.cam.zoom = 1;
  const A = this.area, rng = this.rng;
  const placed = [];
  const tryPlace = (type, d) => {
    const T = PP.LTYPES[type];
    if (!this.S.surgical && ['epidermoid', 'pilar', 'lipoma', 'carbuncle', 'furuncle', 'steatocystoma'].includes(type)) return;
    for (let k = 0; k < 60; k++) {
      const span = A.size * 0.42;
      const x = rng.range(-span, span) * (type === 'filament' ? 0.6 : 1), y = rng.range(-span, span) * (type === 'filament' ? 0.6 : 1);
      const R = (d || (T.d[0] + T.d[1]) / 2) / 2;
      const ok = placed.every((p) => Math.hypot(p.x - x, p.y - y) > p.R + R + (type === 'filament' ? 0.8 : 2.5));
      if (ok) { const L = new PP.Lesion(this.lesions.length, type, x, y, rng, { d }); this.lesions.push(L); placed.push({ x, y, R: L.R }); return L; }
    }
    return null;
  };
  // big ones first
  const mix = A.mix.slice().sort((a, b) => PP.LTYPES[b[0]].d[1] - PP.LTYPES[a[0]].d[1]);
  for (const [type, n] of mix) for (let k = 0; k < n; k++) tryPlace(type);
  // centre the camera on something interesting
  const focus = this.lesions.find((L) => L.type !== 'filament') || null;
  if (focus) { this.cam.x = focus.x * 0.6; this.cam.y = focus.y * 0.6; }
  this.fx.patchChanged();
};

PP.World.prototype.clearPatch = function () {
  this.parts.clear(); this.wounds.reset(); this.decals.reset(); this.render.setupWorld();
  this.lesions = []; this.fx.patchChanged();
};
PP.World.prototype.addLesion = function (type, x, y, d) {
  const L = new PP.Lesion(this.lesions.length, type, x, y, this.rng, { d });
  this.lesions.push(L); this.fx.patchChanged(); return L;
};

// skin height grid over the view (for particle collisions and tool placement)
PP.World.prototype.buildHeightGrid = function () {
  // one pass: dents + in-plane displacement per node; thickening (-Heff * div u) from grid differences
  const C = this.cam, G = this.grid, ph = this.phys;
  const nx = 56, ny = Math.max(20, Math.round((56 * C.vh) / C.vw));
  if (G.n !== nx * ny) { G.h = new Float32Array(nx * ny); G.ux = new Float32Array(nx * ny); G.uy = new Float32Array(nx * ny); G.n = nx * ny; }
  G.nx = nx; G.ny = ny;
  const pad = 6;
  G.x0 = C.x - C.vw / 2 - pad; G.y0 = C.y - C.vh / 2 - pad; G.dx = (C.vw + 2 * pad) / (nx - 1); G.dy = (C.vh + 2 * pad) / (ny - 1);
  const cs = ph.contacts, hasQ = cs.some((c) => c.qx || c.qy);
  const tmp = [0, 0];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const x = G.x0 + i * G.dx, y = G.y0 + j * G.dy, k = j * nx + i;
    let w = 0;
    for (const c of cs) {
      const r = Math.hypot(x - c.x, y - c.y);
      if (r > 6 * ph.Ld) continue;
      if (c.fn) w += ph.dentW(c.fn, c.a, r);
      if (c.suction) w -= ph.dentW(c.suction * 1e-3 * Math.PI * c.a * c.a, c.a, r) * 0.5;
    }
    if (hasQ) { ph.uAt(x, y, tmp); G.ux[k] = tmp[0]; G.uy[k] = tmp[1]; }
    G.h[k] = w + this.lesionH(x, y);
  }
  if (hasQ) for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
    const k = j * nx + i;
    const div = (G.ux[k + 1] - G.ux[k - 1]) / (2 * G.dx) + (G.uy[k + nx] - G.uy[k - nx]) / (2 * G.dy);
    G.h[k] -= ph.Heff * div;
  }
};
PP.World.prototype.lesionH = function (x, y) {
  let h = 0;
  for (const L of this.lesions) {
    const dx = x - L.x - L.ox, dy = y - L.y - L.oy;
    const r2 = (dx * dx + dy * dy) / (L.R * L.R);
    if (r2 >= 1) continue;
    h += L.domeH() * Math.pow(1 - r2, 1.5);
  }
  return h;
};
PP.World.prototype.skinH = function (x, y) {
  const G = this.grid;
  const fx = (x - G.x0) / G.dx, fy = (y - G.y0) / G.dy;
  if (!G.h || fx < 0 || fy < 0 || fx >= G.nx - 1 || fy >= G.ny - 1) return this.lesionH(x, y);
  const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j, n = G.nx;
  const h = G.h;
  return (h[j * n + i] * (1 - u) + h[j * n + i + 1] * u) * (1 - v) + (h[(j + 1) * n + i] * (1 - u) + h[(j + 1) * n + i + 1] * u) * v;
};

PP.World.prototype.pain = function (x, y, amt) {
  const an = this.wounds.anesth(x, y);
  this.painLevel = Math.min(1.6, this.painLevel + amt * (1 - an));
  if (this.S.pain && this.painLevel > 1 && !this._flinchCool) {
    this._flinchCool = 1.2;
    this.stats.flinch++;
    this.cam.shake = 0.25;
    // the tool slips: an extra cut segment if a blade is down
    const T = this.tools;
    if ((T.id === 'blade15' || T.id === 'blade11') && T.ptr.down) {
      const a = this.rng() * Math.PI * 2;
      this.wounds.addCut(T.ptr.x, T.ptr.y, T.ptr.x + Math.cos(a) * 1.5, T.ptr.y + Math.sin(a) * 1.5, 0.6, T.id, -this.rng());
    }
    this.fx.toast('bad', 'Patient flinched', 'That hurt: no local anaesthetic here. Infiltrate lidocaine around the site first, then use Wait for it to take effect.');
  }
};

PP.World.prototype.absorb = function (x, y, r, zmax) {
  const P = this.parts;
  for (let i = 0; i < P.hi; i++) {
    if (!P.alive[i]) continue;
    if (Math.hypot(P.x[i] - x, P.y[i] - y) > r || P.z[i] > zmax) continue;
    if (P.pin[i]) continue;
    const m = P.mat[i];
    if (P.isLiquid(m) || m === PP.MAT.pus || m === PP.MAT.keratin || m === PP.MAT.sebum || m === PP.MAT.oil || m === PP.MAT.fat || m === PP.MAT.molluscum) {
      this.decals.stain([P.cr[i], P.cg[i], P.cb[i]]);
      P.kill(i);
    }
  }
};

PP.World.prototype.lensHit = function (i) {
  if (!this.S.lens) return;
  const P = this.parts, C = this.cam;
  const u = (P.x[i] - C.x) / C.vw + 0.5, v = (P.y[i] - C.y) / C.vh + 0.5;
  if (u < -0.1 || u > 1.1 || v < -0.1 || v > 1.1) return;
  const m = P.mat[i] === PP.MAT.blood || P.mat[i] === PP.MAT.bloodyPus ? 0 : P.mat[i] === PP.MAT.serum ? 2 : 1;
  this.render.drops.push({ u, v, r: PP.clamp(P.r[i] * 0.09, 0.012, 0.07), a: 0.95, m, vy: 0 });
  if (this.render.drops.length > 24) this.render.drops.shift();
  if (!this._lensToast) { this._lensToast = 1; this.fx.toast('warn', 'On the lens', 'Spray reached the camera. Hold gauze loosely over the site (Shift-click with gauze) or wipe the lens.'); }
};

PP.World.prototype.particleWorld = function () {
  const W = this;
  if (this._pw) return this._pw;
  this._pw = {
    area: null, gravity: null, lensZ: this.lensZ,
    skinH: (x, y) => W.skinH(x, y),
    onLens: (i) => W.lensHit(i),
    onSettle: (i) => {
      const P = W.parts, m = P.mat[i];
      const kind = m === PP.MAT.blood || m === PP.MAT.bloodyPus ? 'blood' : m === PP.MAT.serum ? 'serum' : 'pus';
      W.decals.paint(P.x[i], P.y[i], P.r[i] * 1.6, kind, 1);
    },
    onTrail: (i) => {
      const P = W.parts, m = P.mat[i];
      if (W.rng() < 0.35) W.decals.paint(P.x[i], P.y[i], P.r[i] * 0.7, m === PP.MAT.blood ? 'blood' : 'serum', 0.5);
    },
    onBreak: () => {},
    colliders: [],
  };
  // splatter shield: loose gauze over the active lesion catches anything rising through it
  this._pw.colliders.push((i, P) => {
    if (!W.S.shield || !W.activeLesion || P.pin[i]) return;
    const L = W.activeLesion;
    if (P.z[i] > 8.5 && P.z[i] < 12 && Math.hypot(P.x[i] - L.x, P.y[i] - L.y) < Math.max(L.R * 2.2, 6)) { W.decals.stain([P.cr[i], P.cg[i], P.cb[i]]); P.kill(i); }
  });
  return this._pw;
};

// one simulation step (dt seconds, real time)
PP.World.prototype.step = function (dt) {
  this.time += dt; this.clock += dt; this.ctx.clock = this.clock;
  this.tools.update(dt);
  this.ctx.toolId = this.tools.id;
  // the collision surface only needs refreshing once per displayed frame
  if (this.time - (this._gridT || -1) >= 1 / 60) { this.buildHeightGrid(); this._gridT = this.time; }
  // active lesion = the one nearest the pointer
  const p = this.tools.ptr;
  let best = null, bd = 1e9;
  for (const L of this.lesions) { const d = Math.hypot(p.x - L.x - L.ox, p.y - L.y - L.oy) - L.R; if (d < bd) { bd = d; best = L; } }
  this.activeLesion = bd < 6 ? best : null;
  for (const L of this.lesions) L.update(dt, this.ctx);
  for (const L of this.lesions) if (L.suck) { /* suction helps open pores: handled through pressure */ }
  this.wounds.stepHeat(dt);
  this.wounds.stepBleed(dt);
  const pw = this.particleWorld();
  pw.area = this.area; pw.gravity = this.gravity;
  const sub = 2;
  for (let k = 0; k < sub; k++) this.parts.step(dt / sub, pw);
  // pain decays; flinch cooldown
  this.painLevel = Math.max(0, this.painLevel - dt * 0.35);
  if (this._flinchCool) this._flinchCool = Math.max(0, this._flinchCool - dt);
  // lens droplets run down slowly
  for (const d of this.render.drops) { d.vy = Math.min(d.vy + dt * 0.002 * d.r * 40, 0.02); d.v -= d.vy * dt; d.a = Math.max(0, d.a - dt * 0.004); }
  this.render.drops = this.render.drops.filter((d) => d.v > -0.2 && d.a > 0.05);
  // stats
  let vol = 0; for (const L of this.lesions) vol += L.ext; this.stats.vol = vol;
  // camera shake
  if (this.cam.shake > 0) { this.cam.shake = Math.max(0, this.cam.shake - dt); }
};

// time-lapse: advance slow processes by sec seconds
PP.World.prototype.timelapse = function (sec) {
  const steps = 24, dt = sec / steps;
  for (let k = 0; k < steps; k++) {
    this.clock += dt; this.ctx.clock = this.clock;
    for (const L of this.lesions) L.slow(dt, this.ctx);
    for (const el of [...this.wounds.cuts, ...this.wounds.holes, ...this.wounds.punct]) el.clot = Math.min(1, el.clot + dt / 240);
    this.wounds.stepHeat(Math.min(dt, 600));
  }
  // settle all loose liquid into the skin film; dry films
  const P = this.parts;
  for (let i = 0; i < P.hi; i++) if (P.alive[i] && P.isLiquid(P.mat[i]) && !P.pin[i]) { this.particleWorld().onSettle(i); P.kill(i); }
  this.render.brush(0, 0, this.area.size, [0, 0, Math.min(1, sec / 600), 0], 'sub');
  this.render.timelapseDt = sec;
  this.fx.toast('', 'Time-lapse ' + PP.fmtClock(sec).replace('+', ''), 'Clinic clock ' + PP.fmtClock(this.clock) + '. Anaesthetic onset, clotting, healing and steroid response advanced.');
  this.fx.patchChanged();
};

/* ---- 11_ui.js ---- */
'use strict';
/* DOM UI + input. */
PP.UI = function (W) {
  this.W = W;
  const $ = (id) => document.getElementById(id);
  this.$ = $;
  this.canvas = $('gl');
  this.sel = null;          // lesion pinned in the info card
  this.placeType = null;    // sandbox placement
  this.ptrs = new Map();
  this.pan = null;
  this.lastInfo = '';
  W.fx = this.fx();
  W.ctx.fx = W.fx;
  this.build();
  this.bindInput();
};

PP.UI.prototype.fx = function () {
  const W = this.W, ui = this, A = W.audio;
  return {
    toast: (k, t, b) => ui.toast(k, t, b),
    pop: (L, P) => { A.pop(P); W.stats.pops++; },
    deep: () => { A.deep(); W.stats.deep++; },
    spurt: (L, v) => A.spurt(v),
    extrude: (L, rate) => A.extrude(rate),
    creak: () => A.creak(),
    opened: (L, kind) => { if (kind === 'needle') A.tick(); else A.slice(); },
    click: () => A.click(),
    toolChanged: (id) => ui.renderTray(),
    patchChanged: () => { ui.renderChart(true); },
    spreadMolluscum: (L) => {
      const n = 1 + Math.floor(W.rng() * 3);
      for (let k = 0; k < n; k++) { const a = W.rng() * Math.PI * 2, r = 4 + W.rng() * 6; W.addLesion('molluscum', L.x + Math.cos(a) * r, L.y + Math.sin(a) * r, 1.4 + W.rng()); }
      ui.toast('bad', 'Molluscum spread', n + ' new papule' + (n > 1 ? 's' : '') + ' appeared nearby: squeezing with fingers spread the virus (autoinoculation, DermNet).');
    },
  };
};

PP.UI.prototype.build = function () {
  const W = this.W, $ = this.$;
  // areas
  const area = $('area');
  area.innerHTML = Object.entries(PP.AREAS).map(([k, a]) => `<option value="${k}">${a.name}</option>`).join('');
  area.value = W.areaId;
  area.addEventListener('change', async () => { await PP.main.switchArea(area.value); });
  // tones
  const tones = $('tones');
  tones.innerHTML = PP.TONES.map((t, i) => `<button role="radio" aria-label="${t.name}" title="${t.name}" style="background:${t.hex}" data-i="${i}"></button>`).join('');
  tones.addEventListener('click', async (e) => { const b = e.target.closest('button'); if (!b) return; await PP.main.switchTone(+b.dataset.i); this.renderTones(); });
  this.renderTones();
  $('newpatch').addEventListener('click', () => { W.newPatch(Math.floor(Math.random() * 1e9)); this.sel = null; });
  $('wait').addEventListener('click', () => { W.timelapse(+$('waitsel').value); });
  $('wipelens').addEventListener('click', () => { W.render.drops.length = 0; W._lensToast = 0; this.toast('', 'Lens wiped', ''); });
  const mute = $('mute');
  const setMute = () => { mute.classList.toggle('on', W.audio.on); mute.setAttribute('aria-pressed', W.audio.on ? 'true' : 'false'); };
  mute.addEventListener('click', () => { W.audio.setOn(!W.audio.on); setMute(); });
  setMute();
  $('settings').addEventListener('click', () => this.openSettings());
  // zoom controls
  $('zin').addEventListener('click', () => this.zoomBy(1.35));
  $('zout').addEventListener('click', () => this.zoomBy(1 / 1.35));
  $('zfit').addEventListener('click', () => { W.cam.zoom = this.zmin(); this.zoomBy(1); });
  // add your own blemishes (any area)
  const add = $('addsel');
  const groups = {};
  for (const [k, t] of Object.entries(PP.LTYPES)) (groups[t.group] = groups[t.group] || []).push([k, t]);
  add.innerHTML = '<option value="">Add blemish…</option>' + Object.entries(groups).map(([g, list]) => `<optgroup label="${g}">${list.map(([k, t]) => `<option value="${k}">${t.name}</option>`).join('')}</optgroup>`).join('');
  add.addEventListener('change', () => this.setPlace(add.value || null));
  $('erasebtn').addEventListener('click', () => this.setErase(!this.erasing));
  $('clearles').addEventListener('click', () => { W.clearPatch(); this.sel = null; this.toast('', 'Blank skin', 'Pick a blemish from the Add menu and click the skin to place it.'); });
  this.renderTray();
  this.renderChart(true);
  this.renderStats();
};

PP.UI.prototype.renderTones = function () {
  [...this.$('tones').children].forEach((b, i) => { b.classList.toggle('on', i === this.W.toneIdx); b.setAttribute('aria-checked', i === this.W.toneIdx ? 'true' : 'false'); });
};

PP.UI.prototype.renderTray = function () {
  const W = this.W, tray = this.$('tray');
  const groups = {};
  for (const t of PP.TOOLS) (groups[t.group] = groups[t.group] || []).push(t);
  let html = '';
  for (const [g, list] of Object.entries(groups)) {
    html += `<h3>${g}</h3>`;
    for (const t of list) html += `<button class="tool${W.tools.id === t.id ? ' on' : ''}" data-id="${t.id}" title="${t.name} (${t.key})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${PP.ICONS[t.id]}</svg><span>${t.name}</span><span class="k">${t.key}</span></button>`;
  }
  const cur = PP.TOOLS.find((t) => t.id === W.tools.id);
  html += `<div id="toolopt">${cur ? cur.opt : ''}</div>`;
  tray.innerHTML = html;
  tray.onclick = (e) => { const b = e.target.closest('.tool'); if (!b) return; W.tools.select(b.dataset.id); W.audio.start(); };
};

PP.UI.prototype.status = function (L) {
  if (L.recur) return ['bad', 'wall left'];
  if (L.deep) return ['bad', 'ruptured'];
  if (L.done) return ['done', L.type === 'nodule' || L.type === 'papule' ? 'settled' : 'done'];
  if (L.bad) return ['bad', 'trauma'];
  if (L.drained) return ['active', 'drained'];
  if (L.ext > 0) return ['active', PP.fmtVol(L.ext)];
  if (L.open.r > 0 && L.T.open !== 'open') return ['active', 'opened'];
  return ['', ''];
};
PP.UI.prototype.renderChart = function (rebuild) {
  const W = this.W, list = this.$('leslist');
  const Ls = W.lesions.filter((L) => L.type !== 'filament');
  const fil = W.lesions.filter((L) => L.type === 'filament');
  if (rebuild || list.childElementCount !== Ls.length + (fil.length ? 1 : 0)) {
    list.innerHTML = Ls.map((L) => `<div class="les" data-id="${L.id}"><span class="dot"></span><span>${L.T.name.replace(/ \(.*\)/, '')}</span><span class="st"></span></div>`).join('') +
      (fil.length ? `<div class="les" data-fil="1"><span class="dot"></span><span>Sebaceous filaments ×${fil.length}</span><span class="st"></span></div>` : '');
    list.onclick = (e) => {
      const row = e.target.closest('.les'); if (!row) return;
      const L = row.dataset.fil ? fil[0] : W.lesions[+row.dataset.id];
      if (!L) return;
      W.cam.x = L.x; W.cam.y = L.y; W.cam.zoom = Math.max(W.cam.zoom, PP.clamp(W.area.view / (L.R * 9), 1, 4));
      this.sel = L;
    };
  }
  [...list.children].forEach((row) => {
    if (row.dataset.fil) { const n = fil.filter((l) => l.done).length; row.className = 'les' + (n === fil.length ? ' done' : n ? ' active' : ''); row.querySelector('.st').textContent = n + '/' + fil.length; return; }
    const L = W.lesions[+row.dataset.id]; if (!L) return;
    const [cls, txt] = this.status(L);
    row.className = 'les' + (cls ? ' ' + cls : '');
    row.querySelector('.st').textContent = txt;
  });
};
PP.UI.prototype.renderStats = function () {
  const s = this.W.stats;
  const perfect = this.W.lesions.filter((L) => L.done && !L.bad && !L.recur).length;
  this.$('statlist').innerHTML = `<dt>Pops</dt><dd>${s.pops}</dd><dt>Extracted</dt><dd>${PP.fmtVol(s.vol)}</dd><dt>Clean extractions</dt><dd>${perfect}</dd><dt>Ruptured under skin</dt><dd>${s.deep}</dd><dt>Petechiae / flinches</dt><dd>${s.bruise} / ${s.flinch}</dd>`;
};

PP.UI.prototype.stepDone = function (L, step) {
  const W = this.W, u = L.used || new Set();
  switch (step) {
    case 'compress': return (L.maxT || 0) > 34.5;
    case 'needle': return L.events.includes('opened:needle') || L.events.includes('hairLifted');
    case 'loop': return u.has('loop') && L.ext > 0;
    case 'squeeze': return (u.has('fingers') || u.has('swabs')) && L.ext > 0;
    case 'vacuum': return u.has('vacuum') && L.ext > 0;
    case 'lido': return W.wounds.anesth(L.x, L.y) > 0.3;
    case 'blade11': return L.events.some((e) => e === 'opened:blade11' || e === 'opened:punch');
    case 'blade15': return L.events.includes('opened:blade15');
    case 'hemostat': return u.has('hemostat');
    case 'forceps': return u.has('forceps') || L.events.includes('core') || L.events.includes('hairFreed');
    case 'iodine': return !!L.prepped;
    case 'gauze': return u.has('gauze');
    case 'steroid': return L.steroidT >= 0;
    case 'curette': return !!L.coreOut;
    case 'packing': return L.events.includes('packed');
  }
  return false;
};
const STEP_TXT = { compress: 'Warm compress', needle: 'Sterile needle', loop: 'Comedone loop', squeeze: 'Opposed pressure beside it', vacuum: 'Pore vacuum (low)', lido: 'Lidocaine + epi around and beneath', blade11: '#11 stab incision (or punch)', blade15: '#15 incision ~¼ of the diameter', hemostat: 'Hemostat: spread / deliver', forceps: 'Forceps', iodine: 'Povidone-iodine prep', gauze: 'Gauze pressure', steroid: 'Triamcinolone injection', curette: 'Curette', packing: 'Pack the cavity' };

PP.UI.prototype.renderInfo = function () {
  const W = this.W;
  const L = W.activeLesion || this.sel;
  if (!L) {
    const html = `<h4>${W.area.name}</h4><div class="sub">${W.lesions.length} lesions · patch ${W.area.size} mm · view ${W.cam.vw.toFixed(0)} mm</div><p>Hover a lesion to see what it is and how a clinician would treat it. Zoom with − / + (or scroll), right-drag to pan. Add your own from the Add blemish menu.</p><p class="sub">Simulation for entertainment and education. Don't pop at home; see a dermatologist.</p>`;
    if (html !== this.lastInfo) { this.$('info').innerHTML = html; this.lastInfo = html; }
    return;
  }
  const T = L.T;
  const srcs = T.src.map((k) => `<a href="${PP.SRC[k][1]}" target="_blank" rel="noopener">${PP.SRC[k][0]}</a>`).join(' · ');
  const steps = T.protocol.map((s) => `<li class="${this.stepDone(L, s) ? 'done' : ''}">${STEP_TXT[s]}</li>`).join('');
  const [, st] = this.status(L);
  const size = L.d >= 10 ? (L.d / 10).toFixed(1) + ' cm' : L.d.toFixed(1) + ' mm';
  const html = `<h4>${T.name}</h4><div class="sub">${size} · ${T.group}${st ? ' · ' + st : ''}${L.V0 > 0 && T.contents.length ? ' · contents ' + PP.fmtVol(L.V0) : ''}</div><p>${T.desc}</p><p><b>Technique:</b> ${T.hint}</p>${steps ? '<ol>' + steps + '</ol>' : ''}<div class="sub" style="margin-top:6px">${srcs}</div>`;
  if (html !== this.lastInfo) { this.$('info').innerHTML = html; this.lastInfo = html; }
};

PP.UI.prototype.toast = function (kind, title, body) {
  if (!title) return;
  const box = this.$('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.innerHTML = `<b>${title}</b>${body ? ' · ' + body : ''}`;
  box.prepend(el);
  while (box.childElementCount > 3) box.lastChild.remove();
  setTimeout(() => el.remove(), kind === 'bad' ? 7000 : 5000);
  if (PP.TEST) PP.diag.write('[toast] ' + title);
};

PP.UI.prototype.update = function (dt) {
  const W = this.W, T = W.tools;
  // meters
  const f = T.forceMax ? T.force / T.forceMax : 0;
  this.$('forcebar').firstChild.style.width = (PP.clamp(f, 0, 1) * 100).toFixed(0) + '%';
  this.$('painbar').firstChild.style.width = (PP.clamp(W.painLevel, 0, 1) * 100).toFixed(0) + '%';
  const L = W.activeLesion;
  let ro = '';
  if (T.force > 0) ro += (T.id === 'vacuum' ? (T.vacLevels[T.vacLevel] * PP.clamp(f, 0, 1)).toFixed(0) + ' kPa' : T.force.toFixed(1) + ' N');
  if (L && L.P > 0.5) ro += (ro ? ' · ' : '') + 'cavity ' + L.P.toFixed(0) + ' kPa';
  if (L) { const t = W.wounds.heatAt(L.x, L.y); L.maxT = Math.max(L.maxT || 0, t); if (t > 33.2) ro += (ro ? ' · ' : '') + t.toFixed(1) + ' °C'; }
  this.$('readout').textContent = ro || '—';
  const zt = W.cam.zoom.toFixed(1) + '×';
  if (this._zt !== zt) { this._zt = zt; this.$('zoomv').textContent = zt; }
  // ring at cursor
  const ring = this.$('ring');
  const show = T.ptr.down && T.forceMax;
  ring.classList.toggle('show', !!show);
  if (show) {
    ring.style.left = this.lastSX + 'px'; ring.style.top = this.lastSY + 'px';
    const c = 2 * Math.PI * 22;
    this.$('ringv').setAttribute('stroke-dasharray', (PP.clamp(f, 0, 1) * c).toFixed(1) + ' ' + c.toFixed(1));
  }
  // record tool use per lesion
  if (L && T.force > 0.3) { L.used = L.used || new Set(); L.used.add(T.id); }
  this._t = (this._t || 0) + dt;
  if (this._t > 0.25) { this._t = 0; this.renderChart(false); this.renderStats(); this.renderInfo(); this.$('clock').textContent = PP.fmtClock(W.clock); }
};

// ---------------------------------------------------------------- input
PP.UI.prototype.toWorld = function (sx, sy) {
  const r = this.canvas.getBoundingClientRect(), C = this.W.cam;
  return { x: C.x + ((sx - r.left) / r.width - 0.5) * C.vw, y: C.y + (0.5 - (sy - r.top) / r.height) * C.vh };
};
PP.UI.prototype.bindInput = function () {
  const W = this.W, cv = this.canvas, T = W.tools;
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('pointerdown', (e) => {
    W.audio.start();
    cv.setPointerCapture(e.pointerId);
    this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
    this.lastSX = e.clientX; this.lastSY = e.clientY;
    const p = this.toWorld(e.clientX, e.clientY);
    if (e.button === 2 || e.button === 1) { this.pan = { sx: e.clientX, sy: e.clientY, cx: W.cam.x, cy: W.cam.y }; return; }
    if (this.erasing) { this.eraseDrag = true; this.eraseAt(p.x, p.y); return; }
    if (this.placeType) {
      const T = PP.LTYPES[this.placeType];
      const k = +this.$('addsize').value;
      const L = W.addLesion(this.placeType, p.x, p.y, PP.lerp(T.d[0], T.d[1], k));
      this.sel = L; W.audio.click();
      return;
    }
    if (this.ptrs.size === 2) {
      // second finger: pinch squeeze with fingers/swabs, otherwise pan/zoom
      T.up();
      const [a, b] = [...this.ptrs.values()];
      const wa = this.toWorld(a.x, a.y), wb = this.toWorld(b.x, b.y);
      if (T.id === 'fingers' || T.id === 'swabs') T.touch = { a: wa, b: wb, d0: Math.hypot(wb.x - wa.x, wb.y - wa.y) };
      else this.pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), z0: W.cam.zoom, cx: W.cam.x, cy: W.cam.y, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      return;
    }
    T.down(p.x, p.y, { shift: e.shiftKey, pressure: e.pointerType === 'pen' ? e.pressure : 0 });
  });
  cv.addEventListener('pointermove', (e) => {
    const pt = this.ptrs.get(e.pointerId);
    if (pt) { pt.x = e.clientX; pt.y = e.clientY; }
    this.lastSX = e.clientX; this.lastSY = e.clientY;
    if (this.pan) {
      const r = cv.getBoundingClientRect();
      W.cam.x = this.pan.cx - ((e.clientX - this.pan.sx) / r.width) * W.cam.vw;
      W.cam.y = this.pan.cy + ((e.clientY - this.pan.sy) / r.height) * W.cam.vh;
      this.clampCam(); return;
    }
    if (T.touch && this.ptrs.size === 2) {
      const [a, b] = [...this.ptrs.values()];
      T.touch.a = this.toWorld(a.x, a.y); T.touch.b = this.toWorld(b.x, b.y);
      return;
    }
    if (this.pinch && this.ptrs.size === 2) {
      const [a, b] = [...this.ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      W.cam.zoom = PP.clamp(this.pinch.z0 * (d / this.pinch.d0), this.zmin(), PP.UI.ZMAX);
      const r = cv.getBoundingClientRect();
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      W.cam.vw = W.area.view / W.cam.zoom;
      W.cam.x = this.pinch.cx - ((mx - this.pinch.mx) / r.width) * W.cam.vw;
      W.cam.y = this.pinch.cy + ((my - this.pinch.my) / r.height) * W.cam.vh;
      this.clampCam(); return;
    }
    const p = this.toWorld(e.clientX, e.clientY);
    if (this.eraseDrag) { this.eraseAt(p.x, p.y); return; }
    if (!T.ptr.down) { T.ptr.x = p.x; T.ptr.y = p.y; T.ptr.lx = p.x; T.ptr.ly = p.y; }
    else T.move(p.x, p.y, { pressure: e.pointerType === 'pen' ? e.pressure : null });
  });
  const end = (e) => {
    this.ptrs.delete(e.pointerId);
    if (this.eraseDrag) { this.eraseDrag = false; return; }
    if (this.pan && this.ptrs.size === 0) { this.pan = null; return; }
    if (T.touch) { if (this.ptrs.size < 2) { T.touch = null; } return; }
    if (this.pinch) { if (this.ptrs.size < 2) this.pinch = null; return; }
    T.up();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.shiftKey) {
      const k = e.deltaY > 0 ? -1 : 1;
      if (T.id === 'fingers' || T.id === 'swabs') T.spread[T.id] = PP.clamp(T.spread[T.id] + k * 0.3, 1.5, 12);
      else if (T.id === 'loop') T.loopR = T.loopR > 1 ? 0.75 : 1.25;
      else if (T.id === 'vacuum') T.vacLevel = PP.clamp(T.vacLevel + k, 0, 2);
      return;
    }
    const before = this.toWorld(e.clientX, e.clientY);
    W.cam.zoom = PP.clamp(W.cam.zoom * Math.exp(-e.deltaY * 0.0015), this.zmin(), PP.UI.ZMAX);
    W.cam.vw = W.area.view / W.cam.zoom; W.cam.vh = (W.cam.vw * W.cam.ch) / W.cam.cw;
    const after = this.toWorld(e.clientX, e.clientY);
    W.cam.x += before.x - after.x; W.cam.y += before.y - after.y;
    this.clampCam();
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
    const k = e.key.toUpperCase();
    const t = PP.TOOLS.find((x) => x.key === k);
    if (t) { T.select(t.id); return; }
    if (k === 'Q') T.angle += 0.2; else if (k === 'E') T.angle -= 0.2;
    else if (k === '[') { if (T.spread[T.id] != null) T.spread[T.id] = Math.max(1.5, T.spread[T.id] - 0.4); }
    else if (k === ']') { if (T.spread[T.id] != null) T.spread[T.id] = Math.min(12, T.spread[T.id] + 0.4); }
    else if (e.key === '+' || e.key === '=') this.zoomBy(1.35);
    else if (e.key === '-' || e.key === '_') this.zoomBy(1 / 1.35);
    else if (k === 'X') this.setErase(!this.erasing);
    else if (e.key === 'Escape') { this.setPlace(null); this.setErase(false); this.closeSettings(); }
  });
};
PP.UI.ZMAX = 6;
// zoom far enough out to see the whole skin patch
PP.UI.prototype.zmin = function () { return Math.min(0.6, this.W.area.view / this.W.area.size); };
PP.UI.prototype.setErase = function (on) {
  this.erasing = !!on;
  if (on) { this.placeType = null; this.$('addsel').value = ''; this.canvas.classList.remove('placing'); }
  this.canvas.classList.toggle('erasing', this.erasing);
  const b = this.$('erasebtn'); b.classList.toggle('on', this.erasing); b.setAttribute('aria-pressed', this.erasing ? 'true' : 'false');
  if (on) this.toast('', 'Eraser on', 'Click or drag over blemishes to remove them. Press X or Esc to stop.');
};
// remove every blemish under the eraser (plus whatever it has oozed onto the skin)
PP.UI.prototype.eraseAt = function (x, y) {
  const W = this.W, P = W.parts;
  const brush = Math.max(0.5, (14 / W.cam.cw) * W.cam.vw);
  const gone = W.lesions.filter((L) => Math.hypot(L.x + L.ox - x, L.y + L.oy - y) < L.R + brush);
  if (!gone.length) return;
  for (const L of gone) {
    const r = L.R * 1.4 + 0.5;
    for (let i = 0; i < P.hi; i++) if (P.alive[i] && Math.hypot(P.x[i] - L.x, P.y[i] - L.y) < r) P.kill(i);
    if (this.sel === L) this.sel = null;
  }
  W.lesions = W.lesions.filter((L) => !gone.includes(L));
  W.lesions.forEach((L, i) => { L.id = i; });
  W.audio.click();
  W.fx.patchChanged();
};
PP.UI.prototype.clampCam = function () {
  const W = this.W, C = W.cam, s = W.area.size / 2;
  C.x = C.vw / 2 >= s ? 0 : PP.clamp(C.x, -s + C.vw / 2, s - C.vw / 2);
  C.y = C.vh / 2 >= s ? 0 : PP.clamp(C.y, -s + C.vh / 2, s - C.vh / 2);
};
PP.UI.prototype.zoomBy = function (k) {
  const W = this.W, C = W.cam;
  C.zoom = PP.clamp(C.zoom * k, this.zmin(), PP.UI.ZMAX);
  C.vw = W.area.view / C.zoom; C.vh = (C.vw * C.ch) / C.cw;
  this.clampCam();
};
PP.UI.prototype.setPlace = function (type) {
  if (type && this.erasing) this.setErase(false);
  this.placeType = type;
  this.$('addsel').value = type || '';
  this.canvas.classList.toggle('placing', !!type);
  if (type) this.toast('', 'Click the skin to place', PP.LTYPES[type].name + '. Set its size with the slider; press Esc when done.');
};

'use strict';
/* Behaviour tests: drive the real tool API at a fixed 120 Hz step and assert the sourced real-world outcomes.
   ?test=all runs every assertion; ?test=<visual> stages a scene for a screenshot. */
PP.Tests = function (W) {
  this.W = W; this.dt = 1 / 120; this.results = [];
};
PP.Tests.prototype.step = function (sec) { const n = Math.max(1, Math.round(sec / this.dt)); for (let i = 0; i < n; i++) this.W.step(this.dt); };
PP.Tests.prototype.setup = async function (area, list, opt = {}) {
  const W = this.W;
  if (W.areaId !== area) await PP.main.switchArea(area, true);
  W.S.blood = opt.blood !== false; W.S.spurt = 1; W.S.ooze = 1; W.S.pain = false; W.S.shield = false; W.S.lens = true; W.S.bloodAmt = 1;
  W.rng = PP.rng(1234); W.ctx.rng = W.rng;
  W.parts.clear(); W.wounds.reset(); W.decals.reset(); W.render.setupWorld();
  W.lesions = []; W.clock = 0; W.ctx.clock = 0; W.stats = { pops: 0, vol: 0, perfect: 0, deep: 0, flinch: 0, bruise: 0 };
  W.tools.release(); W.tools.ptr.down = false; W.tools.spread = { fingers: 4.6, swabs: 3.0 }; W.tools.angle = 0; W.tools.wet = 0; W.painLevel = 0;
  const out = list.map(([t, x, y, d]) => W.addLesion(t, x, y, d));
  W.cam.x = opt.cx || 0; W.cam.y = opt.cy || 0; W.cam.zoom = opt.zoom || 1.5;
  W.render.resize(); W.cam.update(W.render.w, W.render.h);
  return out;
};
PP.Tests.prototype.hold = function (tool, x, y, sec, opt = {}) {
  const T = this.W.tools;
  T.select(tool);
  if (opt.spread != null && T.spread[tool] != null) T.spread[tool] = opt.spread;
  if (opt.angle != null) T.angle = opt.angle;
  T.ptr.x = x; T.ptr.y = y; T.ptr.lx = x; T.ptr.ly = y;
  T.down(x, y, { shift: !!opt.shift });
  if (opt.until) { const n = Math.round(sec / this.dt); for (let i = 0; i < n; i++) { this.W.step(this.dt); if (opt.until()) break; } }
  else this.step(sec);
  if (!opt.keep) { T.up(); this.step(0.02); }
};
PP.Tests.prototype.drag = function (tool, x0, y0, x1, y1, sec, opt = {}) {
  const T = this.W.tools;
  T.select(tool); T.ptr.x = x0; T.ptr.y = y0; T.ptr.lx = x0; T.ptr.ly = y0;
  T.down(x0, y0, { shift: !!opt.shift });
  const n = Math.max(2, Math.round(sec / this.dt));
  for (let i = 1; i <= n; i++) { T.move(x0 + ((x1 - x0) * i) / n, y0 + ((y1 - y0) * i) / n); this.W.step(this.dt); }
  if (!opt.keep) { T.up(); this.step(0.02); }
};
PP.Tests.prototype.ok = function (name, pass, info) { this.results.push({ name, pass: !!pass, info }); PP.diag.write((pass ? 'PASS ' : 'FAIL ') + name + ' ' + JSON.stringify(info)); };

PP.Tests.prototype.all = async function () {
  const W = this.W, T = W.tools, P = W.parts;
  let L, L2;
  // 1. opposed fingers pop an unopened pustule at the roof
  [L] = await this.setup('cheek', [['pustule', 0, 0, 3]]);
  this.hold('fingers', 0, 0, 2.5, { spread: 4.6 });
  const popP = L.Pmax;
  this.ok('pustule_roof_pop', L.events.includes('pop') && !L.events.includes('deep'), { events: L.events, Pmax: +popP.toFixed(1), ext: +L.ext.toFixed(2) });
  // 1b. needle-opened pustule drains at lower pressure than the popping pressure
  [L] = await this.setup('cheek', [['pustule', 0, 0, 3]]);
