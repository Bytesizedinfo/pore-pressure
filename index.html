      if (!this.alive[i]) continue;
      this.age[i] += dt;
      if (this.pin[i]) { this.px[i] = this.x[i]; this.py[i] = this.y[i]; this.pz[i] = this.z[i]; continue; }
      const mp = MP[this.mat[i]] || MP[1];
      const damp = this.onSkin[i] ? mp.damp * 0.97 : 0.999;
      let vx = (this.x[i] - this.px[i]) * damp, vy = (this.y[i] - this.py[i]) * damp, vz = (this.z[i] - this.pz[i]) * damp;
      this.px[i] = this.x[i]; this.py[i] = this.y[i]; this.pz[i] = this.z[i];
      const air = this.onSkin[i] ? 1 : 1; // (air drag negligible at these scales)
      this.x[i] += vx * air + g[0] * dt * dt; this.y[i] += vy * air + g[1] * dt * dt; this.z[i] += vz * air + g[2] * dt * dt;
    }
    // constraints
    const iters = 4;
    for (let it = 0; it < iters; it++) {
      for (let i = 0; i < hi; i++) {
        if (!this.alive[i]) continue;
        const j = this.next[i];
        if (j >= 0) {
          let dx = this.x[j] - this.x[i], dy = this.y[j] - this.y[i], dz = this.z[j] - this.z[i];
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz) + 1e-9;
          const rest = this.rest[i];
          if (it === iters - 1 && d > rest * this.brk[i]) {
            // over-stretched: the strand tears here
            this.next[i] = -1; this.prev[j] = -1; if (W.onBreak) W.onBreak(i, j); continue;
          }
          const wi = this.pin[i] ? 0 : 1, wj = this.pin[j] ? 0 : 1, ws = wi + wj;
          if (ws > 0) {
            const k = ((d - rest) / d) / ws;
            this.x[i] += dx * k * wi; this.y[i] += dy * k * wi; this.z[i] += dz * k * wi;
            this.x[j] -= dx * k * wj; this.y[j] -= dy * k * wj; this.z[j] -= dz * k * wj;
          }
          // bending: keep i and next(next) apart (resists folding)
          const k2 = this.next[j];
          if (k2 >= 0 && this.bend[i] > 0) {
            dx = this.x[k2] - this.x[i]; dy = this.y[k2] - this.y[i]; dz = this.z[k2] - this.z[i];
            const d2 = Math.sqrt(dx * dx + dy * dy + dz * dz) + 1e-9;
            const target = rest * 2 * (0.55 + 0.45 * this.bend[i]);
            if (d2 < target) {
              const wk = this.pin[k2] ? 0 : 1, wsum = wi + wk;
              if (wsum > 0) {
                const s = (((d2 - target) / d2) / wsum) * this.bend[i] * 0.5;
                this.x[i] += dx * s * wi; this.y[i] += dy * s * wi; this.z[i] += dz * s * wi;
                this.x[k2] -= dx * s * wk; this.y[k2] -= dy * s * wk; this.z[k2] -= dz * s * wk;
              }
            }
          }
        }
      }
      // skin + tool collisions
      for (let i = 0; i < hi; i++) {
        if (!this.alive[i] || this.pin[i]) continue;
        const r = this.r[i];
        const sh = W.skinH(this.x[i], this.y[i]);
        const floor = sh + r * 0.82;
        if (this.z[i] < floor) {
          this.z[i] = floor;
          this.onSkin[i] = 1;
          if (it === iters - 1) {
            const mp = MP[this.mat[i]] || MP[1];
            // friction / contact-line pinning: beads smaller than pinR hold; larger ones slide
            let fr = mp.fric;
            if (this.isLiquid(this.mat[i])) fr = r < mp.pinR ? 0.97 : PP.clamp(0.75 - (r - mp.pinR) * 1.4, 0.05, 0.75);
            this.x[i] = PP.lerp(this.x[i], this.px[i], fr);
            this.y[i] = PP.lerp(this.y[i], this.py[i], fr);
          }
        } else if (it === iters - 1) this.onSkin[i] = this.z[i] < floor + 0.05 ? 1 : 0;
        if (W.colliders) for (const c of W.colliders) c(i, this);
      }
    }
    // droplet merging (liquids only)
    buildGrid(W);
    for (let i = 0; i < hi; i++) {
      if (!this.alive[i] || !this.isLiquid(this.mat[i]) || this.next[i] >= 0 || this.prev[i] >= 0) continue;
      const gx = Math.floor((this.x[i] - ox) / CS), gy = Math.floor((this.y[i] - oy) / CS);
      for (let yy = gy - 1; yy <= gy + 1; yy++) for (let xx = gx - 1; xx <= gx + 1; xx++) {
        if (xx < 0 || yy < 0 || xx >= gridW || yy >= gridH) continue;
        for (let j = head[yy * gridW + xx]; j >= 0; j = link[j]) {
          if (j <= i || !this.alive[j] || !this.alive[i]) continue;
          const mj = this.mat[j], mi = this.mat[i];
          if (!this.isLiquid(mj)) continue;
          const dx = this.x[j] - this.x[i], dy = this.y[j] - this.y[i], dz = this.z[j] - this.z[i];
          const d2 = dx * dx + dy * dy + dz * dz, rs = (this.r[i] + this.r[j]) * 0.75;
          if (d2 > rs * rs) continue;
          const cap2 = (MP[mi] || MP[4]).rmax;
          const vi = this.r[i] ** 3, vj = this.r[j] ** 3;
          const rn = Math.cbrt(vi + vj);
          if (rn > cap2) continue;
          const wi = vi / (vi + vj), wj = 1 - wi;
          this.x[i] = this.x[i] * wi + this.x[j] * wj; this.y[i] = this.y[i] * wi + this.y[j] * wj; this.z[i] = Math.max(this.z[i], this.z[j]);
          this.px[i] = this.px[i] * wi + this.px[j] * wj; this.py[i] = this.py[i] * wi + this.py[j] * wj; this.pz[i] = Math.max(this.pz[i], this.pz[j]);
          // blood dominates colour when mixed
          if (mj === PP.MAT.blood && mi !== mj) { this.mat[i] = mj; }
          this.cr[i] = this.cr[i] * wi + this.cr[j] * wj; this.cg[i] = this.cg[i] * wi + this.cg[j] * wj; this.cb[i] = this.cb[i] * wi + this.cb[j] * wj;
          this.r[i] = rn;
          this.kill(j);
        }
      }
    }
    // bookkeeping: lens hits, bounds, settling
    const half = W.area.size / 2 + 4;
    for (let i = 0; i < hi; i++) {
      if (!this.alive[i]) continue;
      if (this.z[i] > W.lensZ) { if (W.onLens) W.onLens(i); this.kill(i); continue; }
      if (Math.abs(this.x[i]) > half || Math.abs(this.y[i]) > half || this.z[i] < -20) { this.kill(i); continue; }
      const sp = Math.abs(this.x[i] - this.px[i]) + Math.abs(this.y[i] - this.py[i]) + Math.abs(this.z[i] - this.pz[i]);
      this.still[i] = sp < 0.002 ? this.still[i] + dt : 0;
      if (this.onSkin[i] && this.isLiquid(this.mat[i]) && W.onTrail && sp > 0.01) W.onTrail(i);
      // settled small liquid droplets soak into the film decal (keeps the particle budget)
      if (this.isLiquid(this.mat[i]) && this.onSkin[i] && this.still[i] > 2.5 && this.r[i] < 0.45 && this.next[i] < 0) {
        if (W.onSettle) W.onSettle(i);
        this.kill(i);
      }
    }
    while (this.hi > 0 && !this.alive[this.hi - 1]) this.hi--;
  };

  this.nearest = function (x, y, maxD, filter) {
    let best = -1, bd = maxD * maxD;
    for (let i = 0; i < this.hi; i++) {
      if (!this.alive[i] || (filter && !filter(i))) continue;
      const dx = this.x[i] - x, dy = this.y[i] - y;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  };
  this.chainOf = function (i) {
    let a = i; while (this.prev[a] >= 0) a = this.prev[a];
    const out = []; for (let k = a; k >= 0; k = this.next[k]) out.push(k);
    return out;
  };
  this.clear = function () { for (let i = 0; i < this.hi; i++) if (this.alive[i]) this.kill(i); this.hi = 0; };
};

/* ---- 05_lesions.js ---- */
'use strict';
/* Lesion cavity model.
   Pressure: contact loads reach the cavity via Boussinesq stress at depth + lateral compression (PP.Phys).
   Rupture: thin-shell (Laplace) stress sigma = P*R/(2t) in the roof vs the follicle/cyst wall. Whichever exceeds
   its strength first fails: roof -> surface pop; wall -> deep rupture into the dermis (AAD/AAFP behaviour).
   Contents leave through the opening according to their rheology (PP.flow), or as plugs (stick-slip,
   temperature-dependent friction), pearls, lobules, cores, hairs and sacs. */

PP.Lesion = function (id, type, x, y, rng, opt = {}) {
  const T = PP.LTYPES[type];
  this.id = id; this.type = type; this.T = T;
  this.x = x; this.y = y; this.ox = 0; this.oy = 0;
  this.seed = rng();
  const d = opt.d || rng.range(T.d[0], T.d[1]);
  this.d = d; this.R = d / 2;
  this.H0 = T.hf * this.R;
  const sizeK = d / ((T.d[0] + T.d[1]) / 2);
  this.depth = T.depth * Math.sqrt(sizeK);
  this.rc = T.cav * this.R;
  this.roofT = T.roofT * (0.85 + 0.3 * rng()); this.wallT = T.wallT;
  this.roofS = T.roofS * (0.85 + 0.3 * rng()); this.wallS = T.wallS * (0.85 + 0.3 * rng());
  this.inflam = { pustule: 0.55, giant: 0.6, furuncle: 0.9, carbuncle: 0.95, pseudocyst: 0.75, papule: 0.6, nodule: 0.8,
    ingrown: 0.45, molluscum: 0.05, sebhyper: 0.08, epidermoid: 0.05, pilar: 0, steatocystoma: 0.03, lipoma: 0,
    whitehead: 0.05, macrocomedone: 0.08, blackhead: 0.02, dpow: 0.03, trichostasis: 0.02, filament: 0, milium: 0 }[type] || 0;
  this.inflam *= 0.8 + 0.4 * rng();
  // contents
  let V0 = (4 / 3) * Math.PI * Math.pow(this.rc, 3) * 0.85;
  this.plug = null;
  if (T.contents.length && T.contents[0].k === 'plug') {
    const L = rng.range(T.plugL[0], T.plugL[1]) * Math.sqrt(sizeK);
    const pr = (T.openR || this.R * 0.35) * (T.vis === 1 || T.vis === 2 ? 0 : 1) || this.R * 0.32;
    this.plug = { L, r: Math.max(pr, this.R * 0.3), ext: 0, moving: false, out: false, tip: T.contents[0].tip, tuft: T.contents[0].tuft, stiff: T.contents[0].stiff, soft: T.contents[0].soft, chainTop: -1, chainRoot: -1 };
    V0 = Math.PI * this.plug.r * this.plug.r * L;
  }
  if (type === 'milium') V0 = (4 / 3) * Math.PI * Math.pow(this.rc, 3);
  if (type === 'lipoma') V0 = (4 / 3) * Math.PI * Math.pow(this.rc, 3) * 0.7;
  this.V0 = V0; this.V = V0;
  this.queue = T.contents.map((c) => Object.assign({}, c, { vol: c.f * V0 }));
  this.qi = 0;
  // pus colour variation: white-yellow, occasionally greenish (myeloperoxidase / pyocyanin) or blood-tinged
  const pr = rng();
  this.pusCol = pr < 0.08 ? PP.hex2lin('#dcd9a2') : pr < 0.2 ? PP.hex2lin('#ead0b2') : PP.hex2lin(rng() < 0.5 ? '#efe4b8' : '#ecdca8');
  // openings
  this.open = { r: 0, L: Math.max(this.roofT, 0.03), kind: '' };
  if (T.open === 'open') this.open = { r: T.openR * Math.sqrt(sizeK), L: 0.05, kind: 'pore' };
  if (T.open === 'punctum') this.punctum = T.openR;
  if (T.open === 'umbil') this.punctum = T.openR;
  this.P = 0; this.Pext = 0; this.Pcov = 0;
  this.state = 'intact';
  this.deep = 0; this.drained = false; this.popped = false;
  this.ext = 0;           // extracted volume (µL)
  this.irrit = 0; this.crater = 0; this.hematoma = 0; this.scab = 0; this.heal = 0;
  this.steroidT = -1; this.spreadFlag = false; this.recur = false;
  this.pointing = T.point ? 0.15 : 0;
  this.bleedOpen = 0;
  this.sac = T.sac ? { tear: T.sac.tear, integrity: 1, out: 0, chain: -1, frags: 0, ready: false, done: false } : null;
  this.lig = type === 'lipoma' && d > 30;   // retaining ligaments (large lipomas)
  this.pockets = T.pockets || 0;            // carbuncle loculations
  this.heads = [];
  if (T.heads) for (let k = 0; k < T.heads; k++) {
    const a = rng() * Math.PI * 2, rr = this.R * rng.range(0.15, 0.45);
    this.heads.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  this.hair = T.hair ? { angle: rng() * Math.PI * 2, freed: false, out: false, len: rng.range(5, 11), chain: -1 } : null;
  this.coreOut = false; this.coreChain = -1;
  this.done = false; this.bad = false;
  this.lastSq = 0;          // seconds since last squeeze (for tests / UI)
  this.Pmax = 0;
  this.events = [];
};

// volumetric flow (µL/s) through the current opening. Incisions are slits: Q = w h^3 dP / (12 mu L)
// (h = gape + hemostat spread); round openings use Hagen–Poiseuille. Both capped by the inertial
// (Bernoulli) limit Q <= A sqrt(2 dP / rho).
PP.Lesion.prototype.flowQ = function (c, dP, rRound) {
  const o = this.open;
  let Q, A;
  if (o.w && rRound == null) {
    const h = Math.max(o.h || 0.12, 0.05) + (this.spread || 0);
    let drive = dP;
    if (c.k === 'paste') { drive = dP - (2 * (c.ty || 0) * Math.max(o.L, 0.05)) / (h / 2); if (drive <= 0) return 0; }
    Q = (o.w * h * h * h * drive * 1e6) / (12 * (c.mu || 1000) * Math.max(o.L, 0.05));
    A = o.w * h;
  } else {
    const r = rRound != null ? rRound : o.r;
    Q = PP.flow(c.k, dP, r, o.L, c.mu || 1000, c.ty);
    A = Math.PI * r * r;
  }
  return Math.min(Q, A * PP.jetSpeed(Math.max(dP, 0)));
};
PP.Lesion.prototype.ropen = function () {
  const o = this.open;
  if (o.w) { const h = Math.max(o.h || 0.12, 0.05) + (this.spread || 0); return Math.sqrt((o.w * h) / Math.PI); }
  return o.r;
};
PP.Lesion.prototype.fill = function () { return this.V0 > 0 ? PP.clamp(this.V / this.V0, 0, 1) : 0; };
PP.Lesion.prototype.cur = function () { return this.queue[this.qi]; };
PP.Lesion.prototype.solid = function () { return this.T.open === 'none' && !this.queue.length; };

// current visible dome height (mm)
PP.Lesion.prototype.domeH = function () {
  const f = this.queue.length ? this.fill() : 1;
  const press = 1 + 0.5 * PP.clamp(this.P / 30, 0, 1) * f;
  let h = this.H0 * press * (0.25 + 0.75 * f) * (1 + 0.35 * this.deep);
  if (this.type === 'dpow' || this.type === 'blackhead' || this.type === 'filament' || this.type === 'trichostasis') h = this.H0;
  if (this.steroidT >= 0) h *= PP.clamp(1 - this.steroidT / (2.5 * 86400), 0.15, 1);
  return h + this.hematoma * 0.6;
};

/* Per-frame update. ctx: {phys, parts, W, S (settings), heatAt, fx (callbacks), dt} */
PP.Lesion.prototype.update = function (dt, ctx) {
  const ph = ctx.phys, S = ctx.S, T = this.T;
  if (this.done && this.type !== 'molluscum') { this.P *= 0.9; }
  const cx = this.x + this.ox, cy = this.y + this.oy;
  const load = ph.cavityLoad(cx, cy, Math.max(this.depth, 0.08));
  const headR = Math.max(this.R * 0.45, 0.4);
  const coverNow = ph.roofCover(cx, cy, Math.min(headR, this.R * 0.6));
  // contact pressure on the roof relaxes with the same tissue lag as the cavity pressure (no release artefact)
  this.Pcov += (coverNow - this.Pcov) * (1 - Math.exp(-dt / 0.06));
  const cover = this.Pcov;
  // lipoma is mobile: contacts push it aside instead of pressurising it (unless an incision gives it somewhere to go)
  if (T.mobile) {
    let fx = 0, fy = 0;
    for (const c of ph.contacts) {
      if (!c.fn) continue;
      const dx = cx - c.x, dy = cy - c.y, dd = Math.hypot(dx, dy) + 1e-6;
      if (dd < this.R + c.a) { const k = (c.fn * (1 - dd / (this.R + c.a))) / dd; fx += dx * k; fy += dy * k; }
    }
    const lim = this.R * 0.28;
    const tx = PP.clamp(fx * 3, -lim, lim), ty = PP.clamp(fy * 3, -lim, lim);
    const opened = this.open.r > 0;
    this.ox = PP.lerp(this.ox, opened ? tx * 0.2 : tx, 1 - Math.exp(-dt / 0.15));
    this.oy = PP.lerp(this.oy, opened ? ty * 0.2 : ty, 1 - Math.exp(-dt / 0.15));
  }
  const f = this.queue.length ? this.fill() : 1;
  // intrinsic tension (tense pustules/boils) + transmitted load; Kelvin–Voigt-like lag
  const intrinsic = (this.type === 'giant' ? 5 : this.type === 'furuncle' || this.type === 'carbuncle' ? 3 : this.type === 'pseudocyst' ? 2 : 0.5) * f;
  let target = intrinsic + load.total * (0.25 + 0.75 * Math.pow(f, 0.6));
  if (T.mobile && this.open.r <= 0) target *= 0.15;
  // pore vacuum: reduced pressure over an open pore adds to the outward pressure difference
  target += this.suck || 0;
  // molluscum: picking/squeezing with fingers spreads the virus to nearby skin (autoinoculation)
  if (this.type === 'molluscum' && load.total > 3 && (ctx.toolId === 'fingers' || ctx.toolId === 'swabs') && !this.spreadFlag) { this.spreadFlag = true; this.spreadAt = ctx.clock; this.events.push('autoinoc'); }
  this.Pext = load.total;
  this.P += (target - this.P) * (1 - Math.exp(-dt / 0.06));
  this.Pmax = Math.max(this.Pmax, this.P);
  if (load.total > 4) { this.lastSq = 0; this.irrit = Math.min(1, this.irrit + dt * load.total * 0.0015); }
  else this.lastSq += dt;

  // --- rupture criteria (only for closed lesions) -------------------------------------
  if (this.open.r <= 0 && !this.done) {
    const H = Math.max(this.domeH(), 0.05);
    const a = Math.max(headR * 0.8, 0.3);
    const Rc = PP.clamp((a * a + H * H) / (2 * H), 0.3, 25);
    const tRoof = Math.max(this.roofT * (T.point ? (0.2 + 0.8 * (1 - this.pointing)) : 1), 0.02);
    const sRoof = T.roofS ? (Math.max(0, this.P - cover) * Rc) / (2 * tRoof) : 0;
    const sWall = (this.P * Math.max(this.rc, 0.2)) / (2 * this.wallT);
    const rRoof = T.roofS ? sRoof / this.roofS : 0, rWall = sWall / this.wallS;
    if (rWall > 1 && rWall >= rRoof && this.deep < 1) this.deepRupture(ctx, cover > this.P * 0.6 ? 'covered' : 'closed');
    else if (rRoof > 1) this.surfaceRupture(ctx, Rc);
    // punctum: thick keratin may squeeze through the tiny opening (DermNet) before the wall fails
    if (this.punctum && this.open.r <= 0 && this.qi < this.queue.length) {
      const c = this.cur();
      const Q = this.flowQ(c, this.P, this.punctum) * S.ooze;
      if (Q > 0) this.emitFlow(ctx, Q, dt, this.punctum, true);
    }
  } else if (this.open.r > 0 && !this.done) {
    // with an opening: excess compression fragments a thin cyst wall (AAFP / StatPearls)
    if (this.sac && this.sac.integrity > 0.2) {
      const sWall = (this.P * Math.max(this.rc, 0.2)) / (2 * this.wallT);
      if (sWall > this.wallS * 1.6) {
        this.sac.integrity = Math.max(0.15, this.sac.integrity - dt * 0.8);
        if (!this._fragWarn) { this._fragWarn = 1; ctx.fx.toast('warn', 'Wall fragmenting', 'Excess compression is breaking up the cyst wall. Pieces left behind can let it recur (AAFP).'); }
      }
    }
    this.expel(dt, ctx);
  }
  // solid lesions: squeezing only inflames
  if (this.solid() && load.total > 6) {
    this.inflam = Math.min(1.4, this.inflam + dt * 0.02 * load.total);
  }
  // physiology over (time-lapsed) time
  this.slow(dt, ctx);
};

PP.Lesion.prototype.surfaceRupture = function (ctx, Rc) {
  const S = ctx.S;
  this.popped = true; this.state = 'open';
  this.open.r = PP.clamp(0.1 + this.R * 0.09, 0.12, 0.55);
  this.open.L = Math.max(this.roofT, 0.04);
  this.open.kind = 'tear';
  this.events.push('pop');
  const c = this.cur();
  ctx.fx.pop(this, this.P);
  // stored pressure + low viscosity -> burst jet; thick pus -> small blob
  if (c && (c.k === 'liquid' || c.k === 'paste')) {
    // thin contents burst out as a jet; thick pus only bulges out of the tear (it extrudes, it doesn't spray)
    const thin = c.k === 'liquid' && (c.mu || 1) < 400;
    const v = PP.jetSpeed(this.P) * (thin ? 1 : 0.018) * S.spurt;
    const vol = Math.min(c.vol, this.V0 * (thin ? 0.35 : 0.02) * S.spurt);
    if (vol > 0) this.spray(ctx, vol, v, thin ? 0.55 : 0.25, c);
  }
  ctx.fx.toast('good', 'Pop', 'The roof gave way at the apex: the thin-shell stress in the roof exceeded its strength before the wall did.');
};

PP.Lesion.prototype.deepRupture = function (ctx, why) {
  this.deep = Math.min(1, this.deep + 1); this.state = 'ruptured';
  this.events.push('deep');
  this.inflam = Math.min(1.5, this.inflam + 0.55);
  this.R *= 1.12; this.H0 *= 1.1;
  if (this.queue.length) { const lost = this.V * 0.45; this.V -= lost; const c = this.cur(); if (c) c.vol = Math.max(0, c.vol - lost); }
  this.roofT *= 1.35; this.roofS *= 1.3;
  this.bad = true;
  ctx.fx.deep(this);
  const reason = why === 'covered'
    ? 'Pressing straight on top seals the exit, so pressure loads the follicle wall instead. Contents spilled into the dermis (AAD).'
    : this.solid()
      ? 'There is nothing to drain here. Squeezing pushed inflamed material deeper into the dermis (AAD).'
      : 'Squeezing a closed lesion loaded the follicle wall until it gave way under the skin. Contents spilled into the dermis (AAD).';
  ctx.fx.toast('bad', 'Ruptured under the skin', reason);
};

// spray droplets (Bernoulli jet speed; Plateau–Rayleigh breakup into drops ~1.9x jet radius)
PP.Lesion.prototype.spray = function (ctx, vol, v, cone, c) {
  const P = ctx.parts, cx = this.x + this.ox, cy = this.y + this.oy;
  const rj = Math.max(this.open.r, 0.12);
  let rd = PP.clamp(1.9 * rj, 0.12, 0.45);
  const vd = (4 / 3) * Math.PI * rd * rd * rd;
  let n = Math.min(260, Math.max(3, Math.round(vol / vd)));
  rd = Math.cbrt((vol / n) / ((4 / 3) * Math.PI));
  const ax = ctx.rng() - 0.5, ay = ctx.rng() - 0.5;
  const col = this.contentCol(c);
  for (let k = 0; k < n; k++) {
    const th = Math.acos(1 - ctx.rng() * (1 - Math.cos(cone)));
    const phi = ctx.rng() * Math.PI * 2;
    let dx = Math.sin(th) * Math.cos(phi) + ax * 0.5, dy = Math.sin(th) * Math.sin(phi) + ay * 0.5, dz = Math.cos(th);
    const nn = Math.hypot(dx, dy, dz); dx /= nn; dy /= nn; dz /= nn;
    const sp = v * (0.55 + 0.45 * ctx.rng());
    const i = P.spawn(cx + dx * 0.2, cy + dy * 0.2, this.domeH() + 0.1, rd * (0.7 + 0.6 * ctx.rng()), c.m === 1 ? PP.MAT.pusThin : c.m, col);
    if (i >= 0) P.setVel(i, dx * sp, dy * sp, dz * sp, 1 / 120);
  }
  c.vol = Math.max(0, c.vol - vol); this.V = Math.max(0, this.V - vol); this.ext += vol;
  ctx.fx.spurt(this, v);
};

PP.Lesion.prototype.contentCol = function (c) {
  if (!c) return PP.hex2lin('#e9dba4');
  if (c.m === 1 || c.m === 2) return this.pusCol;
  return PP.hex2lin(PP.MATCOL[c.m] || '#ffffff');
};

// flow through the current opening
PP.Lesion.prototype.expel = function (dt, ctx) {
  const S = ctx.S, T = this.T;
  const blocked = this.Pcov > this.P * 0.8 && this.Pcov > 2;
  const plugIn = this.plug && !this.plug.out;
  if (this.qi >= this.queue.length || (this.V <= this.V0 * 0.003 && !plugIn)) {
    if (!this.drained && this.queue.length) {
      this.drained = true; this.state = 'drained'; this.events.push('drained');
      if (!this.sac && !this.hair && !(T.contents[0] && T.contents[0].k === 'core')) this.done = !this.bad;
      if (!this.plug) ctx.fx.toast('good', 'Drained', 'Contents fully expressed: ' + PP.fmtVol(this.ext) + '.');
    }
    // squeezing an empty cavity: capillaries in the inflamed wall bleed; trauma deepens the crater
    if (this.Pext > 8) {
      this.bleedOpen = Math.min(1, this.bleedOpen + dt * 0.5);
      this.crater = Math.min(0.6, this.crater + dt * 0.02 * (this.Pext / 20));
      this.irrit = Math.min(1, this.irrit + dt * 0.05);
      if (this.crater > 0.35 && !this._scarWarn) { this._scarWarn = 1; this.bad = true; ctx.fx.toast('bad', 'Over-squeezed', 'Nothing left to come out. Continued pressure is only bruising the follicle and deepening the crater (scar risk).'); }
    }
    this.sacUpdate(dt, ctx);
    return;
  }
  const c = this.cur();
  if (blocked) return;
  const dP = this.P;
  if (c.k === 'liquid' || c.k === 'paste') {
    let Q = this.flowQ(c, dP) * S.ooze;
    if (this.pockets > 0) Q *= 0.25;        // loculated: most pus is walled off until the pockets are opened
    if (T.mobile) Q = 0;
    if (Q > 0) this.emitFlow(ctx, Q, dt, this.ropen(), false);
  } else if (c.k === 'plug') this.plugUpdate(dt, ctx);
  else if (c.k === 'pearl') {
    if (dP > 5 && !this.blockedPearl) {
      const P = ctx.parts;
      const i = P.spawn(this.x + this.ox, this.y + this.oy, this.domeH() + this.rc, this.rc * 0.95, PP.MAT.pearl);
      if (i >= 0) P.setVel(i, (ctx.rng() - 0.5) * 60, (ctx.rng() - 0.5) * 60, 90, 1 / 120);
      this.ext += this.V; this.V = 0; c.vol = 0; this.qi++;
      this.done = true; this.events.push('pearl');
      ctx.fx.pop(this, dP * 0.5);
      ctx.fx.toast('good', 'Kernel out', 'The keratin pearl popped out whole once the roof was opened.');
    }
  } else if (c.k === 'core') {
    // molluscum core: expressible once opened; boil core: needs forceps (spawned protruding)
    if (this.type === 'molluscum') {
      if (dP > 4) this.spawnCore(ctx, true);
    } else if (!this.coreOut && this.qi === this.queue.length - 1) this.spawnCore(ctx, false);
  } else if (c.k === 'lobule') this.lipomaUpdate(dt, ctx);
  this.sacUpdate(dt, ctx);
};

// emit liquid droplets or a paste strand at the opening, volume rate Q (µL/s)
PP.Lesion.prototype.emitFlow = function (ctx, Q, dt, ropen, viaPunctum) {
  const c = this.cur(); if (!c) return;
  let dV = Math.min(c.vol, Q * dt);
  if (dV <= 0) { this.qi++; return; }
  const P = ctx.parts, cx = this.x + this.ox, cy = this.y + this.oy;
  const top = Math.max(this.domeH() * 0.9, 0.02);
  const col = this.contentCol(c);
  if (c.k === 'paste') {
    // continuous strand ~ opening diameter (slight die swell), extruded along the surface normal
    const rs = PP.clamp(ropen * 1.12, 0.06, 1.6);
    const sp = rs * 0.62;
    const vol1 = Math.PI * rs * rs * sp;
    this.strandAcc = (this.strandAcc || 0) + dV;
    const v = Q / (Math.PI * rs * rs);
    let root = this.strandRoot;
    while (this.strandAcc >= vol1) {
      this.strandAcc -= vol1;
      // push the existing root up and insert a new particle under it
      const i = P.spawn(cx, cy, top, rs * (0.94 + 0.12 * ctx.rng()), c.m === 1 ? PP.MAT.pus : c.m, col);
      if (i < 0) break;
      if (c.m === PP.MAT.keratin) { const k = 0.9 + 0.15 * ctx.rng(); P.cr[i] *= k; P.cg[i] *= k; P.cb[i] *= k * 0.97; }
      P.pin[i] = 1;
      if (root != null && root >= 0 && P.alive[root] && P.pin[root]) {
        P.pin[root] = 0;
        P.z[root] = top + sp; P.pz[root] = P.z[root] - v / 120;
        const brk = c.m === PP.MAT.keratin ? 1.08 + 0.1 * ctx.rng() : 1.45;
        P.link(root, i, sp, c.m === PP.MAT.keratin ? 0.25 : 0.12, brk);
      } else if (root != null && root >= 0 && P.alive[root]) {
        P.link(root, i, sp, 0.12, 1.45);
      }
      root = i;
    }
    this.strandRoot = root;
  } else {
    // Newtonian: high exit velocity -> jet; otherwise welling droplets
    const v = Q / (Math.PI * ropen * ropen);
    if (v > 600) {
      const cone = 0.35;
      this.spray(ctx, dV, Math.min(v, PP.jetSpeed(this.P)), cone, c);
      return;
    }
    this.dropAcc = (this.dropAcc || 0) + dV;
    const rd = PP.clamp(ropen * 1.4, 0.1, 0.4);
    const vd = (4 / 3) * Math.PI * rd * rd * rd;
    while (this.dropAcc >= vd) {
      this.dropAcc -= vd;
      const a = ctx.rng() * Math.PI * 2, rr = ropen * 0.5 * ctx.rng();
      const mat = c.m === 1 ? PP.MAT.pusThin : c.m;
      const i = P.spawn(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, top + rd, rd, mat, col);
      if (i >= 0) P.setVel(i, Math.cos(a) * 3, Math.sin(a) * 3, Math.min(v, 120), 1 / 120);
      if (c.hairs && ctx.rng() < 0.03) this.spawnHair(ctx, cx, cy, top, 3 + ctx.rng() * 3, true);
    }
  }
  c.vol -= dV; this.V = Math.max(0, this.V - dV); this.ext += dV;
  ctx.fx.extrude(this, dV / dt);
  if (c.vol <= 1e-6) {
    this.qi++;
    if (this.strandRoot != null && this.strandRoot >= 0 && P.alive[this.strandRoot]) P.pin[this.strandRoot] = 0;
    this.strandRoot = null;
  }
};

// blackhead / comedone plug: force balance with stick-slip friction; friction falls with temperature (sebum melts 30–35 °C)
PP.Lesion.prototype.plugUpdate = function (dt, ctx) {
  const pl = this.plug, P = ctx.parts;
  if (!pl || pl.out) { this.qi = this.queue.length; return; }
  const T = ctx.heatAt(this.x, this.y);
  const solid = PP.sebumSolid(T);
  const area = Math.PI * pl.r * pl.r;                    // mm^2
  const Fpush = this.P * 1e-3 * area;                    // N
  const base = (pl.stiff ? 0.009 : pl.soft ? 0.0007 : 0.0024) * (pl.r / 0.25);
  const Fs = base * (solid / 0.55) * (1 - 0.6 * (pl.ext / pl.L));
  const Fk = Fs * 0.55;
  this.plugF = Fs;
  if (!pl.moving && Fpush > Fs) { pl.moving = true; ctx.fx.creak(this); }
  if (pl.moving) {
    if (Fpush < Fk * 0.9) pl.moving = false;
    else {
      const v = PP.clamp(((Fpush - Fk) / Fs) * 3.5, 0, 6) * (pl.soft ? 1.5 : 1);  // mm/s
      const dl = Math.min(v * dt, pl.L - pl.ext);
      pl.ext += dl;
      const dV = area * dl;
      this.V = Math.max(0, this.V - dV); this.ext += dV; this.cur().vol = Math.max(0, this.cur().vol - dV);
      this.P *= 1 - Math.min(0.5, dl / pl.L);            // the cavity relaxes as the plug moves
      this.growPlug(ctx, dl);
      ctx.fx.extrude(this, dV / dt);
    }
  }
  if (pl.ext >= pl.L - 1e-3) {
    pl.out = true; this.qi = this.queue.length; this.V = 0;
    if (pl.chainRoot >= 0 && P.alive[pl.chainRoot]) P.pin[pl.chainRoot] = 0;
    this.done = !this.bad; this.events.push('plugOut');
    ctx.fx.toast('good', 'Plug out', 'Extracted a ' + pl.L.toFixed(1) + ' mm plug' + (pl.tip ? ' with its oxidised dark cap' : '') + (T > 34.5 ? '. The warmth softened the sebum.' : '.'));
    if (this.type === 'filament') this.refill = 1;
  }
};

PP.Lesion.prototype.growPlug = function (ctx, dl) {
  const pl = this.plug, P = ctx.parts, cx = this.x + this.ox, cy = this.y + this.oy;
  const sp = Math.max(pl.r * 0.55, 0.05);
  pl.acc = (pl.acc || 0) + dl;
  while (pl.acc >= sp) {
    pl.acc -= sp;
    const frac = pl.ext / pl.L;           // 0 = tip
    const bulb = frac > 0.75 ? 1 + 0.35 * (frac - 0.75) / 0.25 : 1 - 0.25 * Math.max(0, 0.15 - frac) / 0.15;
    let col;
    if (pl.tip && frac < 0.12) col = PP.hex2lin(frac < 0.05 ? '#1d1712' : '#4a3a2a');
    else if (this.type === 'dpow') col = PP.hex2lin(frac < 0.3 ? '#3b3128' : '#cfc3a8');
    else col = PP.hex2lin(pl.soft ? '#d9d2bf' : '#e8dcb4');
    const i = P.spawn(cx, cy, 0.0, pl.r * bulb, this.type === 'dpow' ? PP.MAT.keratin : PP.MAT.sebum, col);
    if (i < 0) return;
    P.pin[i] = 1;
    if (pl.chainRoot >= 0 && P.alive[pl.chainRoot]) {
      // advance the previous root up the follicle axis and link
      P.pin[pl.chainRoot] = 0;
      P.z[pl.chainRoot] = sp; P.pz[pl.chainRoot] = sp * 0.98;
      P.link(pl.chainRoot, i, sp, pl.stiff ? 1 : 0.85, 2.2);
    } else pl.chainTop = i;
    pl.chainRoot = i;
    if (pl.tuft && frac < 0.1 && !pl.tuftDone) {
      pl.tuftDone = 1;
      for (let k = 0; k < 9; k++) this.spawnHair(ctx, cx, cy, sp, 0.8 + ctx.rng() * 1.2, false, i);
    }
  }
};

PP.Lesion.prototype.spawnHair = function (ctx, x, y, z, len, free, attachTo) {
  const P = ctx.parts;
  const sp = 0.12, n = Math.max(3, Math.round(len / sp));
  const r = free ? 0.03 : 0.022;
  let prev = attachTo != null ? attachTo : -1;
  const a = ctx.rng() * Math.PI * 2, tilt = 0.4 + ctx.rng() * 0.6;
  for (let k = 0; k < n; k++) {
    const i = P.spawn(x + Math.cos(a) * k * sp * tilt, y + Math.sin(a) * k * sp * tilt, z + k * sp * 0.8, r, PP.MAT.hair, free ? PP.hex2lin('#3a2a1e') : PP.hex2lin('#6e5a44'));
    if (i < 0) return -1;
    if (prev >= 0) P.link(prev, i, sp, 0.9, 3.0);
    prev = i;
  }
  return prev;
};

PP.Lesion.prototype.spawnCore = function (ctx, express) {
  const P = ctx.parts, cx = this.x + this.ox, cy = this.y + this.oy;
  if (this.coreOut) return;
  this.coreOut = true;
  const c = this.cur();
  const isMoll = this.type === 'molluscum';
  const r = isMoll ? this.R * 0.32 : PP.clamp(this.open.r * 0.9, 0.3, 1.1);
  const n = isMoll ? 3 : 7;
  let prev = -1;
  for (let k = 0; k < n; k++) {
    const i = P.spawn(cx, cy, this.domeH() + r + k * r * 0.9, r * (1 - k * 0.05), isMoll ? PP.MAT.molluscum : PP.MAT.core);
    if (i < 0) break;
    if (!isMoll) { const kk = 0.85 + 0.25 * ctx.rng(); P.cr[i] *= kk; P.cg[i] *= kk; }
    if (prev >= 0) P.link(prev, i, r * 0.9, 0.8, 1.9);
    else if (!isMoll) { P.pin[i] = 1; this.coreChain = i; }   // root anchored in the cavity until pulled with forceps
    prev = i;
  }
  if (isMoll || express) {
    this.ext += c ? c.vol : 0; this.V = 0; if (c) c.vol = 0; this.qi = this.queue.length;
    this.done = !this.bad; this.events.push('core');
    if (P.alive[prev]) P.setVel(prev, 0, 0, 40, 1 / 120);
    ctx.fx.toast('good', 'Core out', isMoll ? 'The white molluscum body came out whole.' : 'Necrotic core released.');
  } else ctx.fx.toast('warn', 'Core visible', 'A fibrous necrotic core is wedged in the opening. Grip it with forceps and pull steadily.');
};

// lipoma: needs an incision ~1/4 of its diameter; side pressure extrudes lobules; ligaments hold large ones
PP.Lesion.prototype.lipomaUpdate = function (dt, ctx) {
  const inc = this.incLen || 0;
  const need = 0.22 * this.d;
  if (inc < need * 0.6) { if (this.P > 6 && !this._lipWarn) { this._lipWarn = 1; ctx.fx.toast('warn', 'Opening too small', 'Squeeze technique needs an incision about a quarter of the lipoma\'s diameter (' + (this.d / 4).toFixed(0) + ' mm).'); } return; }
  const fracOut = 1 - this.fill();
  if (this.lig && fracOut > 0.38) { if (!this._ligWarn) { this._ligWarn = 1; ctx.fx.toast('warn', 'Held by ligaments', 'Retaining ligaments anchor this large lipoma. Sweep the hemostat inside to free it.'); } return; }
  const Pneed = 6 * Math.pow(need / Math.max(inc, 0.1), 2);
  if (this.P < Pneed) return;
  this.lobAcc = (this.lobAcc || 0) + dt * (this.P - Pneed) * 0.08 * this.V0 * ctx.S.ooze;
  const P = ctx.parts, cx = this.x + this.ox + (this.incCx || 0), cy = this.y + this.oy + (this.incCy || 0);
  while (this.lobAcc > 0) {
    const r = PP.clamp(this.d * 0.05 * (0.7 + 0.6 * ctx.rng()), 0.9, 3.2);
    const v = (4 / 3) * Math.PI * r * r * r;
    this.lobAcc -= v;
    const i = P.spawn(cx + (ctx.rng() - 0.5), cy + (ctx.rng() - 0.5), 0.5, r, PP.MAT.fat);
    if (i >= 0) {
      const k = 0.92 + 0.12 * ctx.rng(); P.cr[i] *= k; P.cg[i] *= k;
      P.setVel(i, (ctx.rng() - 0.5) * 8, (ctx.rng() - 0.5) * 8, 25, 1 / 120);
      if (this.lastLob >= 0 && P.alive[this.lastLob] && ctx.rng() < 0.7) P.link(this.lastLob, i, r * 1.3, 0.1, 2.2);
      this.lastLob = i;
    }
    this.V = Math.max(0, this.V - v); this.ext += v; const c = this.cur(); c.vol = Math.max(0, c.vol - v);
    ctx.fx.extrude(this, v * 10);
    if (this.V <= 0) { this.done = !this.bad; this.events.push('lipomaOut'); ctx.fx.toast('good', 'Lipoma delivered', 'Lobulated fat expressed through the incision.'); break; }
  }
};

// cyst sac / wall removal
PP.Lesion.prototype.sacUpdate = function (dt, ctx) {
  const sac = this.sac; if (!sac || sac.done) return;
  if (!sac.ready && this.fill() < 0.12) {
    sac.ready = true;
    const P = ctx.parts, cx = this.x + this.ox, cy = this.y + this.oy;
    // membrane edge presents at the opening
    const n = 6; let prev = -1;
    for (let k = 0; k < n; k++) {
      const i = P.spawn(cx + (k - 2) * 0.15, cy, 0.15 + k * 0.05, 0.35, PP.MAT.sac);
      if (i < 0) break;
      if (prev >= 0) P.link(prev, i, 0.3, 0.2, 1.4 + sac.tear * 0.3);
      else { P.pin[i] = 1; sac.chain = i; }
      prev = i;
    }
    ctx.fx.toast('warn', 'Sac visible', 'The cyst wall is presenting in the opening. Grip it with the hemostat and deliver it slowly.');
  }
};

// called by tools while a gripped sac / core is being delivered. traction (N) = leftover stretch after the
// tissue released `delivered` mm this frame. Membranes tear when pulled faster than they can release.
PP.Lesion.prototype.pullAnchor = function (ctx, what, traction, delivered) {
  if (what === 'sac' && this.sac && this.sac.ready && !this.sac.done) {
    const sac = this.sac;
    const tearAt = 0.25 * sac.tear * sac.integrity;      // N (cal)
    if (traction > tearAt) {
      sac.frags++; sac.integrity *= 0.85;
      ctx.fx.toast('bad', 'Wall tore', 'The thin wall fragmented under fast traction. ' + sac.frags + ' piece(s) out; inspect for remnants (AAFP).');
      if (sac.frags >= 4) { sac.done = true; this.recur = true; this.done = true; this.bad = true; this.events.push('sacFragments'); }
      return 'tear';
    }
    sac.out += delivered;
    if (sac.out > this.rc * 1.6) {
      sac.done = true; this.done = !this.bad; this.recur = sac.frags > 0;
      this.events.push(sac.frags ? 'sacPieces' : 'sacWhole');
      ctx.fx.toast(sac.frags ? 'warn' : 'good', sac.frags ? 'Sac out in pieces' : 'Sac out whole', sac.frags ? 'Most of the wall is out; fragments left behind can let it recur.' : 'Complete cyst wall delivered: lowest recurrence risk.');
      return 'out';
    }
    return 'pulling';
  }
  if (what === 'core' && !this._coreDone) {
    this.coreOutLen = (this.coreOutLen || 0) + delivered;
    if (this.coreOutLen > 2.5) {
      this._coreDone = 1;
      const c = this.cur(); if (c) { this.ext += c.vol; this.V = Math.max(0, this.V - c.vol); c.vol = 0; }
      this.qi = this.queue.length; this.done = !this.bad; this.events.push('core');
      this.crater = Math.max(this.crater, 0.4);
      ctx.fx.toast('good', 'Core out', 'Necrotic core removed, leaving the typical yellow-grey crater (MSD).');
      return 'out';
    }
    return 'pulling';
  }
  return 'hold';
};

// slow physiology (runs every frame; dt may be large during time-lapse)
PP.Lesion.prototype.slow = function (dt, ctx) {
  // boils "point" with moist heat (MSD): roof thins over hours
  if (this.T.point && this.open.r <= 0) {
    const T = ctx.heatAt(this.x, this.y);
    const heat = PP.clamp((T - 33) / 6, 0, 1);
    this.pointing = PP.clamp(this.pointing + dt * (heat * 1 / 3600 + 1 / (36 * 3600)), 0, 1);
    if (this.pointing > 0.97 && this.type === 'furuncle' && !this.spont) {
      this.spont = 1; this.surfaceRupture(ctx, 2);
      ctx.fx.toast('good', 'Drained spontaneously', 'Moist heat brought the boil to a head and it ruptured on its own (MSD).');
    }
  }
  if (this.steroidT >= 0) {
    this.steroidT += dt;
    const k = PP.clamp(this.steroidT / (2 * 86400), 0, 1);
    this.inflam *= 1 - 0.9 * Math.min(1, dt / 86400);
    if (k >= 1 && !this.done && this.solid()) { this.done = true; this.events.push('flattened'); ctx.fx.toast('good', 'Flattened', 'The steroid injection settled the inflammation.'); }
  }
  if (this.spreadFlag && ctx.clock - this.spreadAt > 86400 && !this.spreadDone) {
    this.spreadDone = true; ctx.fx.spreadMolluscum(this);
  }
  if (this.refill && dt > 30) { this.refillT = (this.refillT || 0) + dt; }
  // healing: crater -> scab -> fade (days)
  if ((this.popped || this.open.r > 0) && dt > 1) {
    this.heal = PP.clamp(this.heal + dt / (5 * 86400), 0, 1);
    this.scab = this.heal < 0.15 ? this.heal / 0.15 : this.heal < 0.7 ? 1 : 1 - (this.heal - 0.7) / 0.3;
    this.inflam *= 1 - Math.min(0.5, dt / (3 * 86400));
  }
};

/* ---- 06_wounds.js ---- */
'use strict';
/* Wounds, injections, temperature and bleeding.
   - Incisions open by Griffith crack opening under prestress across the cut (PP.Phys.cutGape).
   - Punch holes ovalise along the relaxed tension lines (Kirsch) and keep a tissue core until lifted.
   - Bleeding from the dermal plexus scales with depth, perfusion, epinephrine (vasoconstriction peaks ~7–10 min),
     applied pressure and clotting (bleeding time ~2–8 min); an unpressed emptied cavity fills into a hematoma.
   - Lidocaine: anaesthesia onset ~1–2 min; epinephrine blanching builds toward ~10 min (AAFP).
   - Temperature: warm compress heats tissue; diffusion + relaxation to ~32.5 °C skin temperature. */
PP.Wounds = function (W) {
  this.W = W;
  this.cuts = []; this.holes = []; this.punct = []; this.inj = [];
  this.N = 64; this.heat = new Float32Array(this.N * this.N).fill(32.5); this.heat2 = new Float32Array(this.N * this.N);
  this.T0 = 32.5;
  this.compress = null;     // {x,y,r} while the compress is held
  this.press = [];          // gauze pressure discs this frame {x,y,r}
  this.strokeId = 0;
  this.bleedVol = 0;
};

PP.Wounds.prototype.reset = function () {
  this.cuts.length = 0; this.holes.length = 0; this.punct.length = 0; this.inj.length = 0; this.heat.fill(this.T0);
};

PP.Wounds.prototype.depthLimits = function () {
  const A = this.W.area;
  return { epi: A.epi, dermis: A.dermis, total: A.dermis + 6 };
};

// lesions whose cavity this wound reaches; opens them
PP.Wounds.prototype.openLesions = function (x, y, rOpen, depth, kind, len, cx, cy, gape) {
  for (const L of this.W.lesions) {
    const lx = L.x + L.ox, ly = L.y + L.oy;
    const d = Math.hypot(x - lx, y - ly);
    const T = L.T;
    if (d > Math.max(L.R * 0.75, 0.6)) continue;
    const reach = T.open === 'open' ? 0 : Math.max(L.roofT * 0.8, 0.03);
    if (depth < reach) {
      if (kind === 'needle' && T.roofT > 0.2 && !L._needleWarn) { L._needleWarn = 1; this.W.fx.toast('warn', 'Too deep for a needle prick', 'This roof is ' + L.roofT.toFixed(1) + ' mm thick. Use the #11 blade (or let it point first).'); }
      continue;
    }
    if (kind === 'needle' && L.type === 'dpow') L.open.r = Math.max(L.open.r, L.open.r * 1.25);
    const prev = L.open.r;
    L.open.r = Math.max(L.open.r, rOpen);
    L.open.L = Math.max(0.03, Math.min(L.roofT, 1.5));
    L.open.kind = L.open.kind || kind;
    if (len) { L.incLen = Math.max(L.incLen || 0, len); L.incCx = (cx || x) - lx; L.incCy = (cy || y) - ly; L.open.w = Math.max(L.open.w || 0, Math.min(len, L.d)); L.open.h = Math.max(L.open.h || 0, Math.max(gape || 0, 0.12)); }
    if (L.T.mobile && len) L.open.r = Math.max(L.open.r, 0.6);
    if (prev <= 0 && L.open.r > 0) {
      L.state = L.state === 'intact' ? 'opened' : L.state; L.events.push('opened:' + kind);
      // injecting into / incising a pressurised abscess: pus wells up immediately
      if ((L.type === 'furuncle' || L.type === 'carbuncle' || L.type === 'pseudocyst' || L.type === 'giant') && L.P > 2) L.surfaceRuptureLike = true;
      if (L.hair && kind === 'needle') { /* tip still embedded until lifted */ }
      this.W.fx.opened(L, kind);
    }
  }
};

PP.Wounds.prototype.addPuncture = function (x, y, depth) {
  const r = 0.16 + 0.06 * this.W.rng();
  this.punct.push({ x, y, r, depth, t: this.W.clock, clot: 0, acc: 0 });
  if (this.punct.length > 40) this.punct.shift();
  this.openLesions(x, y, PP.clamp(0.2, 0.15, 0.3), depth, 'needle');
  this.W.pain(x, y, 0.25);
};

// a blade stroke segment; consecutive segments of one stroke merge into one cut
PP.Wounds.prototype.addCut = function (ax, ay, bx, by, depthAdd, blade, stroke) {
  const len = Math.hypot(bx - ax, by - ay);
  if (len < 0.05) return null;
  const lim = this.depthLimits();
  let c = this.cuts.find((k) => k.stroke === stroke);
  if (c) {
    // extend (straight-ish strokes) or start a new one if direction changes a lot
    const dx = bx - c.bx, dy = by - c.by;
    const cd = Math.hypot(c.bx - c.ax, c.by - c.ay) + 1e-6;
    const dot = ((c.bx - c.ax) * dx + (c.by - c.ay) * dy) / (cd * (Math.hypot(dx, dy) + 1e-6));
    if (dot > 0.8 || cd < 0.3) { c.bx = bx; c.by = by; }
    else { c = null; }
  }
  if (!c) {
    // a second pass along an existing cut deepens it
    const ex = this.cuts.find((k) => this.segDist(k, (ax + bx) / 2, (ay + by) / 2) < 0.35 && k.stroke !== stroke);
    if (ex) { ex.depth = Math.min(lim.total, ex.depth + depthAdd); ex.stroke = stroke; this.updCut(ex); return ex; }
    c = { ax, ay, bx, by, depth: 0, t: this.W.clock, clot: 0, acc: 0, stroke, blade, id: ++this.strokeId };
    this.cuts.push(c);
    if (this.cuts.length > 16) this.cuts.shift();
  }
  c.depth = Math.min(blade === 'blade11' ? Math.max(c.depth, depthAdd) : lim.total, Math.max(c.depth, depthAdd));
  this.updCut(c);
  this.W.pain((ax + bx) / 2, (ay + by) / 2, 0.55 * len);
  return c;
};
PP.Wounds.prototype.updCut = function (c) {
  const lim = this.depthLimits();
  const len = Math.hypot(c.bx - c.ax, c.by - c.ay);
  const dx = (c.bx - c.ax) / (len + 1e-6), dy = (c.by - c.ay) / (len + 1e-6);
  c.len = len; c.dx = dx; c.dy = dy;
  c.gape = this.W.phys.cutGape(dx, dy, len / 2, c.depth / lim.dermis);
  const mx = (c.ax + c.bx) / 2, my = (c.ay + c.by) / 2;
  const rEq = Math.sqrt((len * Math.max(c.gape, 0.22 * len)) / Math.PI);
  // any lesion the cut crosses gets an opening
  for (const L of this.W.lesions) {
    const d = this.segDist(c, L.x + L.ox, L.y + L.oy);
    if (d < Math.max(L.R * 0.6, 0.6)) this.openLesions(L.x + L.ox, L.y + L.oy, Math.min(rEq, 2.2), c.depth, c.blade, len, mx, my, c.gape);
  }
};
PP.Wounds.prototype.segDist = function (c, x, y) {
  const vx = c.bx - c.ax, vy = c.by - c.ay, l2 = vx * vx + vy * vy + 1e-9;
  const t = PP.clamp(((x - c.ax) * vx + (y - c.ay) * vy) / l2, 0, 1);
  return Math.hypot(c.ax + vx * t - x, c.ay + vy * t - y);
};

PP.Wounds.prototype.addPunch = function (x, y, a, depth) {
  const h = this.W.phys.holeRadii(a);
  let hole = this.holes.find((k) => Math.hypot(k.x - x, k.y - y) < 0.5);
  if (!hole) { hole = { x, y, r: a, depth: 0, t: this.W.clock, clot: 0, acc: 0, core: true, along: h.along, across: h.across }; this.holes.push(hole); if (this.holes.length > 8) this.holes.shift(); }
  hole.depth = Math.max(hole.depth, depth);
  this.openLesions(x, y, a * 0.9, hole.depth, 'punch');
  this.W.pain(x, y, 0.4);
  return hole;
};

PP.Wounds.prototype.inject = function (x, y, kind, vol) {
  let j = this.inj.find((k) => k.kind === kind && Math.hypot(k.x - x, k.y - y) < 2.5);
  if (!j) { j = { x, y, kind, vol: 0, t: this.W.clock }; this.inj.push(j); if (this.inj.length > 8) this.inj.shift(); }
  j.vol = Math.min(3, j.vol + vol);
  return j;
};
// anaesthesia 0..1 and epinephrine vasoconstriction 0..1 at a point
PP.Wounds.prototype.anesth = function (x, y) {
  let a = 0;
  for (const j of this.inj) {
    if (j.kind !== 'lido') continue;
    const age = this.W.clock - j.t, R = 5 + 4 * j.vol;
    const d = Math.hypot(x - j.x, y - j.y);
    a = Math.max(a, (1 - Math.exp(-age / 45)) * PP.clamp(j.vol / 0.6, 0, 1) * (1 - PP.smooth(R * 0.6, R, d)));
  }
  // acidic, hyperaemic abscess tissue: less un-ionised lidocaine and faster washout
  for (const L of this.W.lesions) {
    if ((L.type === 'furuncle' || L.type === 'carbuncle' || L.type === 'pseudocyst') && !L.drained && Math.hypot(x - L.x, y - L.y) < L.R) { a *= 0.45; break; }
  }
  return a;
};
PP.Wounds.prototype.epi = function (x, y) {
  let e = 0;
  for (const j of this.inj) {
    if (j.kind !== 'lido') continue;
    const age = this.W.clock - j.t, R = 5 + 4 * j.vol;
    const d = Math.hypot(x - j.x, y - j.y);
    e = Math.max(e, (1 - Math.exp(-age / 280)) * PP.clamp(j.vol / 0.6, 0, 1) * (1 - PP.smooth(R * 0.5, R, d)));
  }
  return e;
};

PP.Wounds.prototype.heatAt = function (x, y) {
  const s = this.W.area.size, N = this.N;
  const gx = PP.clamp(((x / s) + 0.5) * N - 0.5, 0, N - 1.001), gy = PP.clamp(((y / s) + 0.5) * N - 0.5, 0, N - 1.001);
  const ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
  const h = this.heat, i = iy * N + ix;
  return (h[i] * (1 - fx) + h[i + 1] * fx) * (1 - fy) + (h[i + N] * (1 - fx) + h[i + N + 1] * fx) * fy;
};
PP.Wounds.prototype.stepHeat = function (dt) {
  const N = this.N, s = this.W.area.size, cell = s / N;
  const D = 0.14;                         // mm^2/s (tissue thermal diffusivity ~0.1–0.15)
  const steps = Math.min(40, Math.ceil(dt / 0.25));
  const h = dt / steps;
  for (let k = 0; k < steps; k++) {
    const a = this.heat, b = this.heat2;
    const lam = Math.min(0.24, (D * h) / (cell * cell));
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      const l = a[y * N + Math.max(0, x - 1)], r = a[y * N + Math.min(N - 1, x + 1)];
      const u = a[Math.max(0, y - 1) * N + x], d = a[Math.min(N - 1, y + 1) * N + x];
      let v = a[i] + lam * (l + r + u + d - 4 * a[i]);
      v += (this.T0 - v) * (h / 120);                 // perfusion carries heat away (~2 min)
      if (this.compress) {
        const wx = (x + 0.5) * cell - s / 2, wy = (y + 0.5) * cell - s / 2;
        const dd = Math.hypot(wx - this.compress.x, wy - this.compress.y);
        if (dd < this.compress.r) v += (41 - v) * (h / 25);   // warm moist compress ~41 °C
      }
      b[i] = v;
    }
    this.heat = b; this.heat2 = a;
  }
};

PP.Wounds.prototype.pressureAt = function (x, y) {
  let p = 0;
  for (const g of this.press) { const d = Math.hypot(x - g.x, y - g.y); if (d < g.r) p = Math.max(p, g.k); }
  for (const c of this.W.phys.contacts) { if (c.fn > 0.3 && Math.hypot(x - c.x, y - c.y) < c.a) p = Math.max(p, 0.6); }
  return p;
};

// bleeding: spawn blood droplets along wounds
PP.Wounds.prototype.stepBleed = function (dt) {
  const W = this.W, S = W.S, P = W.parts;
  const lim = this.depthLimits();
  // clotting progresses once per wound per frame; gauze pressure roughly triples the rate
  const clot = (el, x, y) => { const press = this.pressureAt(x, y); el.clot = Math.min(1, el.clot + (dt / 240) * (press > 0.5 ? 3 : 1)); return press; };
  // emitted volume (µL) -> number of droplets of radius rd
  const emit = (el, rate, rd, x, y, press) => {
    if (!S.blood) return 0;
    const e = this.epi(x, y);
    const q = rate * (1 - 0.85 * e) * (1 - el.clot) * (1 - 0.92 * press) * S.bloodAmt;
    el.acc += q * dt;
    const vd = (4 / 3) * Math.PI * rd * rd * rd;
    let n = 0;
    while (el.acc > vd && n < 6) { el.acc -= vd; n++; this.bleedVol += vd; }
    return n;
  };
  for (const c of this.cuts) {
    const mx = (c.ax + c.bx) / 2, my = (c.ay + c.by) / 2;
    const press = clot(c, mx, my);
    const deep = PP.clamp((c.depth - lim.epi) / (lim.dermis * 0.6), 0, 1.5);
    if (deep <= 0) continue;
    const n = emit(c, 0.18 * c.len * deep, 0.13, mx, my, press);   // µL/s per mm at dermal depth (cal)
    for (let k = 0; k < n; k++) {
      const t = W.rng(), side = W.rng() < 0.5 ? -1 : 1;
      const x = PP.lerp(c.ax, c.bx, t) - c.dy * side * c.gape * 0.5, y = PP.lerp(c.ay, c.by, t) + c.dx * side * c.gape * 0.5;
      // emptied cyst with an incision and no pressure: blood pools inside (hematoma, AAFP)
      const L = W.lesions.find((l) => l.drained && l.V0 > 200 && Math.hypot(l.x - x, l.y - y) < l.R && press < 0.3);
      if (L && W.rng() < 0.6) { L.hematoma = Math.min(L.R * 0.25, L.hematoma + 0.012); continue; }
      const i = P.spawn(x, y, 0.05, 0.13, PP.MAT.blood);
      if (i >= 0) P.setVel(i, 0, 0, 2, 1 / 120);
    }
  }
  for (const h of this.holes) {
    const press = clot(h, h.x, h.y);
    const n = emit(h, 0.5 * PP.clamp(h.depth / lim.dermis, 0, 1.3), 0.14, h.x, h.y, press);
    for (let k = 0; k < n; k++) {
      const a = W.rng() * Math.PI * 2;
      const i = P.spawn(h.x + Math.cos(a) * h.along * 0.9, h.y + Math.sin(a) * h.across * 0.9, 0.05, 0.14, PP.MAT.blood);
      if (i >= 0) P.setVel(i, 0, 0, 2, 1 / 120);
    }
  }
  for (const p of this.punct) {
    const press = clot(p, p.x, p.y);
    const n = emit(p, 0.025 * PP.clamp(p.depth / 0.3, 0.2, 2), 0.11, p.x, p.y, press);
    for (let k = 0; k < n; k++) { const i = P.spawn(p.x, p.y, 0.05, 0.11, PP.MAT.blood); if (i >= 0) P.setVel(i, 0, 0, 1, 1 / 120); }
  }
  for (const L of W.lesions) {
    if (L.bleedOpen <= 0 || L.open.r <= 0) continue;
    const el = L._bleedEl || (L._bleedEl = { clot: 0, acc: 0 });
    const press = clot(el, L.x, L.y);
    if (L.Pext > 6) el.clot = Math.max(0, el.clot - dt * 0.5);   // squeezing re-opens capillaries
    const n = emit(el, 0.35 * L.bleedOpen * (0.5 + L.inflam), 0.12, L.x, L.y, press);
    for (let k = 0; k < n; k++) { const i = P.spawn(L.x + L.ox, L.y + L.oy, L.domeH() + 0.1, 0.12, PP.MAT.blood); if (i >= 0) P.setVel(i, 0, 0, 6, 1 / 120); }
    L.bleedOpen = Math.max(0, L.bleedOpen - dt * 0.05);
  }
};

/* ---- 07_tools.js ---- */
'use strict';
/* Instruments. Each frame the active tool turns pointer input into:
   - contacts (discs with normal force fn, tangential load q, or suction) for the skin mechanics,
   - actions (punctures, incisions, injections, grasping, wiping, heat),
   - render primitives (analytic shapes ray-traced from above in the object pass).
   Primitive instance: [Ax,Ay,Az,ra, Bx,By,Bz,rb, type,mat,p1,p2, r,g,b,a]
   type 0 sphere, 1 round cone A->B, 2 slab (A=centre, B=(hx,hy,hz,angle)), 3 blade (A tip, B heel, p1/p2 = spine xy, a = spine z) */
PP.MATOBJ = { nitrile: 30, cotton: 31, chrome: 32, glass: 33, gauze: 34, terry: 35, plastic: 36, hydro: 37, iodineSwab: 38, paper: 39, skinCore: 40 };

PP.Tools = function (W) {
  this.W = W;
  this.id = 'fingers';
  this.ptr = { down: false, x: 0, y: 0, x0: 0, y0: 0, t: 0, pressure: 0, moved: 0, shift: false, lx: 0, ly: 0, speed: 0 };
  this.touch = null;           // {a:{x,y}, b:{x,y}, d0}
  this.angle = 0; this.spread = { fingers: 4.6, swabs: 3.0 };
  this.loopR = 1.25; this.vacLevel = 1; this.vacLevels = [40, 52, 65];
  this.force = 0; this.forceN = 0;
  this.prims = new Float32Array(16 * 160); this.nPrim = 0;
  this.grab = null;            // {i, kind, lesion, ax, ay}
  this.stroke = 0;
  this.wet = 0;
  this.punchDepth = 0; this.punchRot = 0;
  this.lidoVol = 0;
};

PP.Tools.prototype.select = function (id) {
  this.release();
  this.id = id;
  this.W.fx.toolChanged(id);
};

PP.Tools.prototype.down = function (x, y, opt = {}) {
  const p = this.ptr;
  Object.assign(p, { down: true, x, y, x0: x, y0: y, lx: x, ly: y, t: 0, moved: 0, shift: !!opt.shift, pressure: opt.pressure || 0 });
  this.stroke++;
  const W = this.W;
  if (this.id === 'gauze' && opt.shift) { W.S.shield = !W.S.shield; W.fx.toast('', 'Splatter shield ' + (W.S.shield ? 'on' : 'off'), W.S.shield ? 'Gauze held loosely over the lesion catches spray (AAFP).' : ''); p.down = false; return; }
  if (this.id === 'forceps' || this.id === 'hemostat') this.tryGrab(x, y);
  if (this.id === 'steroid') this.steroid(x, y);
  if (this.id === 'patch') this.patch(x, y);
  if (this.id === 'needle') {
    this.needleStart = { x, y };
    const P = this.W.parts;
    const ci = P.nearest(x, y, 1.8, (k) => P.mat[k] === PP.MATOBJ.skinCore && P.pin[k]);
    if (ci >= 0) { P.pin[ci] = 0; P.setVel(ci, 0, 0, 60, 1 / 120); for (const h of this.W.wounds.holes) if (h.coreIdx === ci) h.core = false; this.needleStart = null; this.W.fx.toast('', 'Core lifted', 'The punched tissue core is out; the cyst wall is exposed beneath.'); }
  }
};
PP.Tools.prototype.move = function (x, y, opt = {}) {
  const p = this.ptr;
  const dx = x - p.x, dy = y - p.y;
  p.moved += Math.hypot(dx, dy);
  p.x = x; p.y = y;
  if (opt.pressure != null) p.pressure = opt.pressure;
};
PP.Tools.prototype.up = function () {
  const p = this.ptr, W = this.W;
  if (!p.down) return;
  if (this.id === 'needle') {
    const s = this.needleStart;
    if (s) {
      const drag = Math.hypot(p.x - s.x, p.y - s.y);
      if (drag < 0.6) W.wounds.addPuncture(s.x, s.y, 0.15 + 0.1 * W.rng());
      else this.liftHair(s, p);
    }
  }
  if (this.id === 'punch' && this.punchDepth > 0.15) {
    const hole = W.wounds.addPunch(p.x0, p.y0, 2.0, this.punchDepth);
    if (hole && hole.core) this.spawnTissueCore(hole);
    W.fx.toast('', 'Punch', 'Cut a 4 mm core, ' + this.punchDepth.toFixed(1) + ' mm deep. The hole relaxes into an oval along the tension lines. Lift the core out with the needle.');
  }
  this.punchDepth = 0; this.punchRot = 0;
  if (this.id === 'lido' && this.lidoVol > 0) {
    W.fx.toast('', 'Infiltrated ' + this.lidoVol.toFixed(1) + ' mL', 'Anaesthesia sets in within a minute or two; epinephrine blanching builds toward ~10 min. Use Wait.');
    this.lidoVol = 0;
  }
  this.release();
  p.down = false;
};
PP.Tools.prototype.release = function () {
  const W = this.W;
  if (this.grab) {
    const P = W.parts, i = this.grab.i;
    if (i >= 0 && P.alive[i] && !this.grab.wasPinned) P.pin[i] = 0;
    this.grab = null;
  }
  W.wounds.compress = null;
  for (const L of W.lesions) { if (L.spread) L.open.h = Math.max(L.open.h || 0, (L.open.h || 0) + L.spread * 0.35); L.spread = 0; }
};

PP.Tools.prototype.tryGrab = function (x, y) {
  const W = this.W, P = W.parts;
  const grabbable = (i) => { const m = P.mat[i]; return m === PP.MAT.hair || m === PP.MAT.core || m === PP.MAT.sac || m === PP.MAT.fat || m === PP.MAT.sebum || m === PP.MAT.keratin || m === PP.MAT.packing || m === PP.MAT.molluscum || m === PP.MATOBJ.skinCore || m === PP.MAT.pus || m === PP.MAT.pearl; };
  const anchored = (k) => { const m = P.mat[k]; return m === PP.MAT.sac || m === PP.MAT.core || m === PP.MAT.hair || m === PP.MATOBJ.skinCore; };
  let i;
  if (this.id === 'hemostat') {
    // the hemostat grips anchored structures; otherwise, inside an opening, it spreads / sweeps (blunt dissection)
    i = P.nearest(x, y, 1.3, anchored);
    if (i < 0 && !this.lesionAt(x, y, true)) i = P.nearest(x, y, 1.0, grabbable);
  } else i = P.nearest(x, y, 1.0, grabbable);
  if (i >= 0) {
    // find owning lesion anchor (pinned root of this chain)
    const chain = P.chainOf(i);
    const root = chain.find((k) => P.pin[k]);
    let L = null, kind = null;
    if (root != null) for (const l of W.lesions) {
      if (l.sac && l.sac.chain === root) { L = l; kind = 'sac'; }
      if (l.coreChain === root) { L = l; kind = 'core'; }
      if (l.hair && l.hair.chain === root) { L = l; kind = 'hair'; }
      if (l._coreHole && l._coreHole === root) { L = l; kind = 'tissue'; }
    }
    if (root != null && P.mat[root] === PP.MATOBJ.skinCore) kind = 'tissue';
    let anchor = null, slack = 0;
    if (root != null && kind) {
      anchor = { x: P.x[root], y: P.y[root], z: P.z[root] };
      const ch = P.chainOf(root); const k = Math.max(0, ch.indexOf(i));
      slack = k * (P.rest[root] || 0.3) + 0.4;
    }
    this.grab = { i, kind, L, root, wasPinned: !!P.pin[i] && !kind, ax: x, ay: y, t: 0, anchor, slack, released: false };
    P.pin[i] = 1;
    W.fx.click();
    return;
  }
  if (this.id === 'hemostat') {
    // inserted into an opening: spreading mode
    const L = this.lesionAt(x, y, true);
    if (L && L.open.r > 0) this.grab = { i: -1, kind: 'spread', L, ax: x, ay: y, sweep: 0 };
  }
};

PP.Tools.prototype.lesionAt = function (x, y, needOpen) {
  let best = null, bd = 1e9;
  for (const L of this.W.lesions) {
    const d = Math.hypot(x - L.x - L.ox, y - L.y - L.oy);
    if (d < Math.max(L.R, 1.0) * 1.15 && d < bd && (!needOpen || L.open.r > 0)) { bd = d; best = L; }
  }
  return best;
};

PP.Tools.prototype.liftHair = function (s, p) {
  const W = this.W;
  const L = this.lesionAt(s.x, s.y, false);
  if (!L || !L.hair) { W.wounds.addPuncture(s.x, s.y, 0.2); return; }
  if (L.hair.freed) return;
  const T = W.wounds.heatAt(L.x, L.y);
  // the curled tip springs out once the needle passes under the loop; warmth softens the keratin
  L.hair.freed = true; L.events.push('hairLifted');
  if (L.open.r <= 0) { L.open.r = 0.2; L.open.L = 0.05; L.popped = true; }
  const P = W.parts;
  const n = Math.round(L.hair.len / 0.15);
  let prev = -1;
  const a = L.hair.angle;
  for (let k = 0; k < n; k++) {
    const t = k / n;
    // stored curl: the free part springs into an arc
    const ang = a + t * 2.2;
    const rr = 0.8 + t * 2.5;
    const i = P.spawn(L.x + Math.cos(ang) * rr * t, L.y + Math.sin(ang) * rr * t, 0.05 + 0.35 * Math.sin(t * Math.PI), 0.035, PP.MAT.hair, PP.hex2lin('#2b1d14'));
    if (i < 0) break;
    if (prev >= 0) P.link(prev, i, 0.15, 0.95, 3.5);
    else { P.pin[i] = 1; L.hair.chain = i; }
    prev = i;
  }
  W.fx.toast('good', 'Tip freed', 'The embedded tip sprang out of the skin' + (T > 34 ? '; the warm compress softened it.' : '.') + ' Leave the root in. Plucking invites another ingrown hair.');
};

PP.Tools.prototype.spawnTissueCore = function (hole) {
  const P = this.W.parts;
  const i = P.spawn(hole.x, hole.y, 0.2, 1.7, PP.MATOBJ.skinCore, this.W.skinColLin());
  if (i >= 0) { P.pin[i] = 1; hole.coreIdx = i; }
};

PP.Tools.prototype.steroid = function (x, y) {
  const W = this.W, L = this.lesionAt(x, y, false);
  if (!L) return;
  W.wounds.inject(x, y, 'steroid', 0.1);
  W.wounds.addPuncture(x, y, 0.8);
  if (['nodule', 'papule', 'pseudocyst', 'epidermoid', 'sebhyper'].includes(L.type)) {
    if (L.steroidT < 0) { L.steroidT = 0; L.events.push('steroid'); }
    W.fx.toast('good', 'Triamcinolone injected', 'Intralesional steroid settles inflamed nodules and cysts over the following days. Use Wait (2 days).');
  } else W.fx.toast('warn', 'Steroid not indicated', 'Steroid injections are for inflamed nodules, cysts and papules, not this.');
};

PP.Tools.prototype.patch = function (x, y) {
  const W = this.W, L = this.lesionAt(x, y, false);
  W.decals.patches.push({ x, y, r: 6, t: W.clock });
  if (L) { L.patched = true; L.events.push('patched'); }
  W.fx.toast('', 'Hydrocolloid patch', 'Covers the wound and absorbs exudate; it whitens as it swells.');
};

// ------------------------------------------------------------------------------------------------
PP.Tools.prototype.update = function (dt) {
  const W = this.W, p = this.ptr, ph = W.phys;
  ph.contacts.length = 0;
  W.wounds.press.length = 0;
  this.nPrim = 0;
  this.force = 0;
  if (p.down) p.t += dt;
  const sp = Math.hypot(p.x - p.lx, p.y - p.ly) / Math.max(dt, 1e-4);
  p.speed = PP.lerp(p.speed, sp, 0.3);
  const id = this.id;
  const ramp = (tau, Fmax) => Fmax * (1 - Math.exp(-p.t / tau)) * (p.pressure > 0 ? 0.3 + 1.4 * p.pressure : 1);
  // lesion-specific suction reset
  for (const L of W.lesions) L.suck = 0;

  if (id === 'fingers' || id === 'swabs') {
    const isF = id === 'fingers';
    let c1, c2, F = 0;
    const a = isF ? 4.2 : 2.0;
    if (this.touch) {
      c1 = this.touch.a; c2 = this.touch.b;
      const d = Math.hypot(c2.x - c1.x, c2.y - c1.y);
      F = PP.clamp((this.touch.d0 - d) * (isF ? 1.6 : 0.9) + 0.6, 0, isF ? 9 : 4);
    } else if (p.down) {
      const s = this.spread[id];
      const ax = Math.cos(this.angle), ay = Math.sin(this.angle);
      c1 = { x: p.x - ax * s, y: p.y - ay * s }; c2 = { x: p.x + ax * s, y: p.y + ay * s };
      F = ramp(0.9, isF ? (p.shift ? 10 : 6) : 3);
    }
    if (c1 && c2) {
      // wet gloves lose grip: lower friction (cal 0.8 dry -> 0.25 wet) and the pads slide inward
      const mu = isF ? PP.lerp(0.8, 0.25, PP.clamp(this.wet, 0, 1)) : 0.6;
      if (isF && this.wet > 0.5 && F > 3 && !this.touch) this.spread.fingers = Math.max(2.2, this.spread.fingers - dt * 0.6 * this.wet);
      const dx = c2.x - c1.x, dy = c2.y - c1.y, d = Math.hypot(dx, dy) + 1e-6, ux = dx / d, uy = dy / d;
      ph.contacts.push({ x: c1.x, y: c1.y, a, fn: 0.45 * F, qx: ux * F * mu, qy: uy * F * mu });
      ph.contacts.push({ x: c2.x, y: c2.y, a, fn: 0.45 * F, qx: -ux * F * mu, qy: -uy * F * mu });
      this.force = F; this.forceMax = isF ? 10 : 4;
      const zOf = (c) => W.skinH(c.x, c.y);
      if (isF) {
        for (const [c, sgn] of [[c1, -1], [c2, 1]]) {
          // distal fingertip: ~9 mm wide at the tip, widening toward the knuckle, rising out of frame
          const z0 = zOf(c) + 3.9;
          this.prim([c.x + ux * sgn * 1.2, c.y + uy * sgn * 1.2, z0, 4.4, c.x + ux * sgn * 24, c.y + uy * sgn * 24 + 5, z0 + 24, 7.0], 1, PP.MATOBJ.nitrile, [0.24, 0.2, 0.62, this.wet]);
        }
      } else {
        for (const [c, sgn] of [[c1, -1], [c2, 1]]) {
          const z0 = zOf(c) + 1.7;
          this.prim([c.x - ux * sgn * 0.6, c.y - uy * sgn * 0.6, z0, 1.9, c.x + ux * sgn * 3.2, c.y + uy * sgn * 3.2, z0 + 1.4, 2.0], 1, PP.MATOBJ.cotton, this.swabStain || [0.86, 0.85, 0.82, 0]);
          this.prim([c.x + ux * sgn * 4.5, c.y + uy * sgn * 4.5, z0 + 1.6, 0.9, c.x + ux * sgn * 40, c.y + uy * sgn * 40, z0 + 26, 0.9], 1, PP.MATOBJ.paper, [0.9, 0.9, 0.88, 0]);
        }
      }
    }
  } else if (id === 'loop') {
    const R = this.loopR;
    const F = p.down ? ramp(0.6, 2.6) : 0;
    const zr = W.skinH(p.x, p.y);
    if (p.down) {
      // ring load as 16 small discs; friction + Poisson effect drives tissue inward under the wire
      const tilt = PP.clamp((p.x - p.lx) * 0.0, -1, 1);
      const rx = PP.clamp((p.x - p.x0) * 0.4, -0.6, 0.6), ry = PP.clamp((p.y - p.y0) * 0.4, -0.6, 0.6); // rocking
      for (let k = 0; k < 16; k++) {
        const an = (k / 16) * Math.PI * 2, cx = Math.cos(an), cy = Math.sin(an);
        const bias = 1 + 0.8 * (cx * rx + cy * ry);
        ph.contacts.push({ x: p.x + cx * R, y: p.y + cy * R, a: 0.32, fn: (F / 16) * bias, qx: -cx * F * 0.04 * bias, qy: -cy * F * 0.04 * bias });
      }
      this.force = F; this.forceMax = 4;
    }
    // ring (12 capsule segments) + shank + handle
    const zc = zr + (p.down ? 0.05 : 0.8) + 0.22;
    for (let k = 0; k < 12; k++) {
      const a0 = (k / 12) * Math.PI * 2, a1 = ((k + 1) / 12) * Math.PI * 2;
      this.prim([p.x + Math.cos(a0) * R, p.y + Math.sin(a0) * R, zc, 0.22, p.x + Math.cos(a1) * R, p.y + Math.sin(a1) * R, zc, 0.22], 1, PP.MATOBJ.chrome, [0.8, 0.8, 0.82, 0]);
    }
    this.prim([p.x - R * 0.7, p.y + R * 0.7, zc, 0.3, p.x - 9, p.y + 9, zc + 9, 1.0], 1, PP.MATOBJ.chrome, [0.78, 0.78, 0.8, 0]);
    this.prim([p.x - 9, p.y + 9, zc + 9, 1.6, p.x - 40, p.y + 40, zc + 30, 2.2], 1, PP.MATOBJ.chrome, [0.7, 0.7, 0.72, 0]);
  } else if (id === 'vacuum') {
    const a = 3.5, dP = this.vacLevels[this.vacLevel];
    const s = p.down ? dP * (1 - Math.exp(-p.t / 0.3)) : 0;
    const zr = W.skinH(p.x, p.y);
    if (p.down) {
      ph.contacts.push({ x: p.x, y: p.y, a, suction: s });
      const Fr = s * 1e-3 * Math.PI * a * a;
      for (let k = 0; k < 16; k++) { const an = (k / 16) * Math.PI * 2; ph.contacts.push({ x: p.x + Math.cos(an) * (a + 0.6), y: p.y + Math.sin(an) * (a + 0.6), a: 0.6, fn: Fr / 16 }); }
      W.decals.suction(p.x, p.y, a, s, dt);
      for (const L of W.lesions) {
        const d = Math.hypot(L.x - p.x, L.y - p.y);
        if (d < a && L.open.r > 0) L.suck = s * 0.35 * (1 - d / a);
      }
      this.force = s / 65; this.forceMax = 1;
    }
    const zc = zr + (p.down ? 0.2 : 1.2);
    for (let k = 0; k < 16; k++) {
      const a0 = (k / 16) * Math.PI * 2, a1 = ((k + 1) / 16) * Math.PI * 2;
      this.prim([p.x + Math.cos(a0) * (a + 0.6), p.y + Math.sin(a0) * (a + 0.6), zc + 0.6, 0.6, p.x + Math.cos(a1) * (a + 0.6), p.y + Math.sin(a1) * (a + 0.6), zc + 0.6, 0.6], 1, PP.MATOBJ.glass, [0.9, 0.95, 1, 0.75]);
    }
    this.prim([p.x, p.y, zc + 6, a + 1.0, p.x + 10, p.y + 14, zc + 34, a + 3], 1, PP.MATOBJ.glass, [0.92, 0.96, 1, 0.8]);
    this.prim([p.x + 12, p.y + 17, zc + 36, 6, p.x + 40, p.y + 60, zc + 70, 8], 1, PP.MATOBJ.plastic, [0.93, 0.93, 0.95, 0]);
  } else if (id === 'needle') {
    const zr = W.skinH(p.x, p.y);
    const tipz = zr + (p.down ? 0.0 : 0.6);
    this.prim([p.x, p.y, tipz + 0.05, 0.03, p.x + 6, p.y + 4, tipz + 5, 0.24], 1, PP.MATOBJ.chrome, [0.82, 0.82, 0.85, 0]);
    this.prim([p.x + 6, p.y + 4, tipz + 5, 0.26, p.x + 30, p.y + 20, tipz + 25, 0.26], 1, PP.MATOBJ.chrome, [0.82, 0.82, 0.85, 0]);
    this.prim([p.x + 30, p.y + 20, tipz + 25, 2.2, p.x + 50, p.y + 34, tipz + 40, 2.4], 1, PP.MATOBJ.plastic, [0.2, 0.55, 0.85, 0]);
    if (p.down && this.needleStart && W.lesions.some((L) => L.hair && Math.hypot(L.x - p.x, L.y - p.y) < L.R * 1.5)) this.force = 0.3;
  } else if (id === 'blade11' || id === 'blade15') {
    const zr = W.skinH(p.x, p.y);
    let dx = p.x - p.lx, dy = p.y - p.ly;
    if (Math.hypot(dx, dy) < 1e-4) { dx = this.bdx || 1; dy = this.bdy || 0; } else { const n = Math.hypot(dx, dy); this.bdx = dx / n; this.bdy = dy / n; dx /= n; dy /= n; }
    if (p.down) {
      const stab = id === 'blade11';
      const sx = p.x0, sy = p.y0;
      let ex = p.x, ey = p.y;
      if (stab) { const L = Math.hypot(ex - sx, ey - sy); if (L > 3) { ex = sx + ((ex - sx) / L) * 3; ey = sy + ((ey - sy) / L) * 3; } }
      const segLen = Math.hypot(p.x - p.lx, p.y - p.ly);
      if (segLen > 0.05 || p.t < dt * 1.5) {
        const depth = stab ? W.area.dermis * 0.9 + 0.4 + Math.min(p.t, 1.5) * 0.4 : 0.55 + 0.45 * (p.pressure || 0.6);
        if (stab) W.wounds.addCut(sx, sy, ex, ey, depth, id, this.stroke);
        else W.wounds.addCut(p.lx, p.ly, p.x, p.y, depth, id, this.stroke);
      }
    }
    const tz = zr + (p.down ? -0.3 : 0.8);
    const bx = -dx, by = -dy;   // blade trails behind the motion
    const nx = -by, ny = bx;
    const tip = [p.x, p.y, tz];
    const heel = [p.x + bx * 7, p.y + by * 7, tz + 3];
    const spine = [p.x + bx * 5 + nx * 2.6, p.y + by * 5 + ny * 2.6, tz + 3.4];
    if (id === 'blade15') { spine[0] = p.x + bx * 4 + nx * 3; spine[1] = p.y + by * 4 + ny * 3; }
    this.primRaw([tip[0], tip[1], tip[2], 0.08, heel[0], heel[1], heel[2], 0, 3, PP.MATOBJ.chrome, spine[0], spine[1], spine[2], 0, 0, 0]);
    this.prim([heel[0], heel[1], heel[2] + 0.3, 1.2, heel[0] + bx * 30, heel[1] + by * 30, heel[2] + 26, 1.6], 1, PP.MATOBJ.chrome, [0.68, 0.68, 0.7, 0]);
  } else if (id === 'punch') {
    const zr = W.skinH(p.x, p.y);
    if (p.down) {
      this.punchRot += dt * 6;
      const lim = W.wounds.depthLimits();
      const anes = W.wounds.anesth(p.x0, p.y0);
      this.punchDepth = Math.min(lim.dermis + 2.5, this.punchDepth + dt * 1.4);
      if (anes < 0.5) W.pain(p.x0, p.y0, dt * 0.8);
      ph.contacts.push({ x: p.x0, y: p.y0, a: 2.2, fn: 0.8 });
      this.force = this.punchDepth / (lim.dermis + 2.5); this.forceMax = 1;
    }
    const cx = p.down ? p.x0 : p.x, cy = p.down ? p.y0 : p.y;
    for (let k = 0; k < 14; k++) {
      const a0 = (k / 14) * Math.PI * 2 + this.punchRot, a1 = ((k + 1) / 14) * Math.PI * 2 + this.punchRot;
      this.prim([cx + Math.cos(a0) * 2.1, cy + Math.sin(a0) * 2.1, zr + 0.4, 0.18, cx + Math.cos(a1) * 2.1, cy + Math.sin(a1) * 2.1, zr + 0.4, 0.18], 1, PP.MATOBJ.chrome, [0.85, 0.85, 0.88, 0]);
    }
    this.prim([cx, cy, zr + 3, 2.4, cx, cy + 3, zr + 14, 2.4], 1, PP.MATOBJ.chrome, [0.8, 0.8, 0.82, 0]);
    this.prim([cx, cy + 3, zr + 14, 4, cx + 2, cy + 20, zr + 50, 4.5], 1, PP.MATOBJ.plastic, [0.92, 0.92, 0.94, 0]);
  } else if (id === 'hemostat' || id === 'forceps') {
    const zr = W.skinH(p.x, p.y);
    const g = this.grab;
    let open = 0.25;
    if (g && g.kind === 'spread' && p.down) {
      const d = Math.hypot(p.x - g.ax, p.y - g.ay);
      const sprd = PP.clamp(d * 0.9, 0, 3);
      g.L.spread = sprd; open = 0.25 + sprd * 0.5;
      g.sweep += Math.hypot(p.x - p.lx, p.y - p.ly);
      if (g.L.pockets > 0 && sprd > 1.2 && g.sweep > 6) { g.sweep = 0; g.L.pockets--; W.fx.toast('good', 'Pocket opened', 'The hemostat sweep broke a loculation; trapped pus can drain. ' + (g.L.pockets ? g.L.pockets + ' left.' : 'All pockets open.')); }
      if (g.L.lig && g.sweep > 10) { g.L.lig = false; W.fx.toast('good', 'Ligaments freed', 'Blunt dissection released the retaining ligaments.'); }
      if (W.wounds.anesth(g.ax, g.ay) < 0.5) W.pain(g.ax, g.ay, dt * sprd * 0.3);
    } else if (g && g.i >= 0 && p.down) {
      const P = W.parts, i = g.i;
      if (!P.alive[i]) this.grab = null;
      else {
        P.x[i] = p.x; P.y[i] = p.y; P.z[i] = Math.max(zr + 0.6, Math.min(P.z[i] + dt * 25, zr + 0.6 + Math.min(p.t, 2) * 2.5));
        g.t += dt;
        if (g.anchor && !g.released) {
          // traction ~ how far the grip is beyond the slack of the strand back to its anchored root
          const dd = Math.hypot(P.x[i] - g.anchor.x, P.y[i] - g.anchor.y, P.z[i] - g.anchor.z);
          const freeRoot = () => { g.released = true; if (g.root !== i) P.pin[g.root] = 0; else g.wasPinned = false; };
          if ((g.kind === 'sac' || g.kind === 'core') && g.L) {
            // the wall/core slides out as fast as the tissue releases it; pulling faster builds traction
            const excess = Math.max(0, dd - g.slack);
            const vdel = g.kind === 'sac' ? 2.6 * g.L.sac.tear * g.L.sac.integrity + 0.8 : 2.5;   // mm/s (cal)
            const deliver = Math.min(excess, vdel * dt);
            if (deliver > 0) {
              const k = deliver / (dd + 1e-6);
              g.anchor.x += (P.x[i] - g.anchor.x) * k; g.anchor.y += (P.y[i] - g.anchor.y) * k; g.anchor.z += (P.z[i] - g.anchor.z) * k;
              if (g.root !== i && P.alive[g.root]) { P.x[g.root] = g.anchor.x; P.y[g.root] = g.anchor.y; P.z[g.root] = g.anchor.z; }
            }
            const res = g.L.pullAnchor(this.W.ctx, g.kind, (excess - deliver) * 0.08, deliver);
            if (res === 'out') { freeRoot(); if (g.kind === 'sac') g.L.sac.chain = -1; else g.L.coreChain = -1; }
            if (res === 'tear') {
              // the gripped piece comes away; the rest of the wall stays anchored inside
              if (g.root !== i) { const pv = P.prev[i]; if (pv >= 0) { P.next[pv] = -1; P.prev[i] = -1; } }
              else { const nx = P.next[i]; if (nx >= 0) { P.next[i] = -1; P.prev[nx] = -1; P.pin[nx] = 1; if (g.L.sac) g.L.sac.chain = nx; } g.wasPinned = false; }
              g.released = true;
            }
          } else if (g.kind === 'hair' && g.L) {
            if (dd > g.L.hair.len * 0.85 && !g.L.hair.out) {
              g.L.hair.out = true; freeRoot(); g.L.events.push('hairPlucked'); g.L.done = true;
              W.fx.toast('warn', 'Plucked', 'You pulled the whole hair out by the root. Freeing the tip is enough; plucking invites regrowth into the skin.');
            } else if (dd > 1.2 && !g.L._tipOk) { g.L._tipOk = 1; g.L.done = true; g.L.events.push('hairFreed'); W.fx.toast('good', 'Hair freed', 'The ingrown tip is out of the skin; the inflammation can settle.'); }
          } else if (g.kind === 'tissue') {
            if (dd > 1.5) { freeRoot(); for (const h of W.wounds.holes) if (h.coreIdx === g.root) h.core = false; W.fx.toast('', 'Core lifted', 'The punched tissue core is out; the cavity beneath is exposed.'); }
          }
        }
      }
      open = 0.05;
    }
    const jaw = this.id === 'forceps' ? 0.22 : 0.32;
    const ax = Math.cos(0.7), ay = Math.sin(0.7);
    const nx = -ay, ny = ax;
    const tz = zr + 0.3;
    for (const s of [-1, 1]) {
      const ox = nx * s * open, oy = ny * s * open;
      this.prim([p.x + ox, p.y + oy, tz, jaw * 0.6, p.x + ox * 2 + ax * 9, p.y + oy * 2 + ay * 9, tz + 8, jaw * 1.8], 1, PP.MATOBJ.chrome, [0.8, 0.8, 0.83, 0]);
      this.prim([p.x + ox * 2 + ax * 9, p.y + oy * 2 + ay * 9, tz + 8, jaw * 1.8, p.x + ax * 45 + nx * s * 4, p.y + ay * 45 + ny * s * 4, tz + 40, jaw * 2.6], 1, PP.MATOBJ.chrome, [0.74, 0.74, 0.77, 0]);
    }
  } else if (id === 'curette') {
    const zr = W.skinH(p.x, p.y);
    if (p.down && p.moved > 0.5) {
      const L = this.lesionAt(p.x, p.y, false);
      if (L && L.type === 'molluscum' && !L.coreOut) {
        L.open.r = Math.max(L.open.r, L.R * 0.5);
        L.spawnCore(this.W.ctx, true);
        W.wounds.addPuncture(L.x, L.y, 0.35);
      } else if (p.moved > 2 && !this._scr) { this._scr = 1; W.wounds.addPuncture(p.x, p.y, 0.15); }
      ph.contacts.push({ x: p.x, y: p.y, a: 1.0, fn: 0.5 });
    } else this._scr = 0;
    this.prim([p.x, p.y, zr + 0.5, 0.9, p.x + 4, p.y + 4, zr + 3, 0.5], 1, PP.MATOBJ.chrome, [0.82, 0.82, 0.85, 0]);
    this.prim([p.x + 4, p.y + 4, zr + 3, 0.5, p.x + 40, p.y + 30, zr + 30, 1.6], 1, PP.MATOBJ.chrome, [0.75, 0.75, 0.78, 0]);
  } else if (id === 'lido' || id === 'steroid') {
    const zr = W.skinH(p.x, p.y);
    if (id === 'lido' && p.down) {
      const v = dt * 0.35;
      this.lidoVol += v;
      W.wounds.inject(p.x, p.y, 'lido', v);
      if (p.t < dt * 1.5) W.wounds.addPuncture(p.x, p.y, 0.6);
      W.pain(p.x, p.y, dt * 0.15);
      // into a cyst lumen? (AAFP: infiltrate around and beneath, never into the cyst)
      for (const L of W.lesions) {
        if (L.group === undefined && (L.T.group === 'Cyst') && L.open.r <= 0 && Math.hypot(L.x - p.x, L.y - p.y) < L.rc * 0.55) {
          L.V += v * 1000 * 0.2; L.P += 3;
          if (!L._lumen) { L._lumen = 1; L.events.push('lumenInjection'); W.fx.toast('bad', 'Injected into the cyst', 'Anaesthetic belongs around and beneath the cyst, not in its lumen. It raises the pressure and can burst the wall (AAFP).'); }
        }
      }
    }
